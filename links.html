<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Showbiz</title>
<script src="version.js"></script>
<script src="shared.js"></script>
<script src="demo-catalog.js"></script>
<style>
  :root { --bg:#0c1628; --card:#14213a; --card2:#1a2b4a; --line:#2c4168; --fg:#f2f5fa; --muted:#9aa8bf; --orange:#f59e4b; --orange-d:#e0852f; --teal:#2ec4b6; color-scheme:dark; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg); font-family:'Tajawal',system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif; padding:0 max(16px, env(safe-area-inset-left, 0px)) 110px max(16px, env(safe-area-inset-right, 0px)); }
  h1, h2, h3 { font-family:'Cairo',system-ui,sans-serif; margin:0; }
  .wrap { max-width:480px; margin:0 auto; padding-top:16px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .tbtn { height:40px; min-width:40px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:inherit; font-size:13px; font-weight:700; cursor:pointer; padding:0 14px; display:flex; align-items:center; justify-content:center; }
  .tbtn.round { width:40px; padding:0; border-radius:50%; }
  .tbtn svg { width:20px; height:20px; }
  .hero { text-align:center; margin:24px 0 20px; }
  .kick { color:var(--orange); font-size:12px; font-weight:800; letter-spacing:2px; text-transform:uppercase; }
  .brand { margin:8px 0 6px; font-family:'Cairo',system-ui,sans-serif; font-weight:800; font-size:44px; line-height:1; direction:ltr; }
  .brand .a { color:var(--orange); } .brand .b { color:var(--teal); }
  .tag { color:var(--muted); font-size:15px; line-height:1.7; margin:0; }
  .btn { display:flex; align-items:center; gap:14px; width:100%; padding:17px 18px; border-radius:18px; text-decoration:none; color:var(--fg); font:inherit; font-family:'Cairo',system-ui,sans-serif; font-weight:800; font-size:18px; margin-bottom:12px; border:1px solid var(--line); background:var(--card); cursor:pointer; text-align:start; }
  .btn .ic { width:44px; height:44px; flex-shrink:0; border-radius:50%; background:rgba(255,255,255,.06); color:var(--orange); display:flex; align-items:center; justify-content:center; }
  .btn .ic svg { width:22px; height:22px; }
  .btn .arr { margin-inline-start:auto; font-size:22px; color:var(--muted); }
  .btn .sub { display:block; font-size:13px; font-weight:400; color:var(--muted); margin-top:2px; font-family:'Tajawal',system-ui,sans-serif; direction:ltr; text-align:start; }
  .btn .tx { flex:1; min-width:0; }
  .btn.main { background:var(--orange); border-color:transparent; color:#111; box-shadow:0 12px 28px rgba(245,158,75,.25); }
  .btn.main .ic { background:rgba(0,0,0,.08); color:#111; }
  .btn.main .arr { color:#111; }
  .btn:hover { border-color:var(--orange); }
  .status { font-size:12px; font-weight:800; padding:5px 10px; border-radius:999px; white-space:nowrap; font-family:'Tajawal',system-ui,sans-serif; }
  .status.open { background:rgba(34,197,94,.15); color:#4ade80; }
  .status.closed { background:rgba(248,113,113,.15); color:#fca5a5; }
  .sec { margin-top:26px; }
  .sh { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .sh h2 { font-size:19px; font-weight:800; }
  .sh .lbl { color:var(--orange); font-size:12px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase; }
  .tabs { display:flex; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:4px; margin-bottom:14px; }
  .tab { flex:1; border:0; background:transparent; color:var(--muted); font:inherit; font-weight:700; font-size:15px; padding:10px 8px; border-radius:999px; cursor:pointer; }
  .tab.on { background:var(--orange); color:#111; }
  .car { display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:6px; scrollbar-width:none; }
  .car::-webkit-scrollbar { display:none; }
  .pc { flex:0 0 46%; max-width:200px; scroll-snap-align:start; background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; text-decoration:none; color:var(--fg); position:relative; }
  .pc .im { aspect-ratio:1/1; background:var(--card2); position:relative; }
  .pc .im img { width:100%; height:100%; object-fit:cover; display:block; }
  .pc .badge { position:absolute; top:8px; inset-inline-start:8px; background:#e11d48; color:#fff; font-size:11px; font-weight:800; padding:3px 8px; border-radius:6px; font-family:'Inter',system-ui,sans-serif; }
  .pc .tx { padding:10px 10px 12px; }
  .pc .nm { font-size:14px; line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.9em; }
  .pc .pr { display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 8px; margin-top:4px; }
  .pc .pr b { color:var(--orange); font-weight:800; font-size:15px; white-space:nowrap; font-family:'Inter',system-ui,sans-serif; }
  .pc .pr s { color:var(--muted); font-size:12px; white-space:nowrap; }
  .psearch { display:flex; gap:8px; margin-top:14px; }
  .psearch input { flex:1; min-width:0; height:44px; border-radius:999px; border:1px solid var(--line); background:var(--card2); color:var(--fg); padding:0 16px; font:inherit; font-size:15px; }
  .psearch input::placeholder { color:var(--muted); }
  .psearch button { height:44px; border-radius:999px; padding:0 18px; background:var(--card2); color:var(--fg); border:1px solid var(--line); font:inherit; font-weight:700; cursor:pointer; }
  .allbtn { display:block; text-align:center; margin-top:10px; padding:14px; border-radius:14px; border:1px solid var(--line); color:var(--fg); text-decoration:none; font-weight:800; font-family:'Cairo',system-ui,sans-serif; }
  .allbtn:hover { border-color:var(--orange); }
  .help { display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:10px; color:var(--fg); text-decoration:none; }
  .help .ic { width:44px; height:44px; flex-shrink:0; border-radius:50%; background:rgba(255,255,255,.06); color:var(--orange); display:flex; align-items:center; justify-content:center; }
  .help .ic svg { width:22px; height:22px; }
  .help .tx { flex:1; min-width:0; }
  .help b { display:block; font-size:16px; font-weight:800; font-family:'Cairo',system-ui,sans-serif; }
  .help small { display:block; color:var(--muted); font-size:13px; margin-top:3px; }
  .help:hover { border-color:var(--orange); }
  .copy { text-align:center; color:var(--muted); font-size:12px; margin-top:26px; line-height:1.8; }
  .copy .ver { direction:ltr; opacity:.7; }
  /* الشريط السفلي */
  .dock { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(14px + env(safe-area-inset-bottom,0px)); z-index:30; width:min(calc(100% - 28px),440px); display:flex; gap:4px; padding:8px; border-radius:999px; background:rgba(40,40,44,.92); border:1px solid rgba(255,255,255,.1); box-shadow:0 12px 32px rgba(0,0,0,.4); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  .dock a { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 4px; border-radius:999px; color:#d6dbe6; text-decoration:none; font-size:12px; font-weight:700; font-family:'Tajawal',system-ui,sans-serif; }
  .dock a svg { width:22px; height:22px; }
  .dock a.on { background:var(--orange-d); color:#111; }
  /* نافذة أوقات العمل */
  .modal { position:fixed; inset:0; z-index:50; background:rgba(5,10,20,.6); display:flex; align-items:center; justify-content:center; padding:16px; }
  .modal[hidden] { display:none !important; }
  .mbox { width:min(92vw,380px); background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden; }
  .mhead { display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--line); }
  .mhead h3 { font-size:18px; font-weight:800; }
  .mx { width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:transparent; color:var(--fg); font-size:18px; cursor:pointer; }
  .mbody { padding:16px 18px 20px; }
  .mrow { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 0; border-bottom:1px dashed var(--line); font-size:15px; }
  .mrow:last-of-type { border-bottom:0; }
  .mrow span:last-child { direction:ltr; color:var(--muted); white-space:nowrap; }
  .mstat { text-align:center; margin-top:14px; font-weight:800; }
  .mstat.open { color:#4ade80; } .mstat.closed { color:#fca5a5; }
</style>
</head>
<body data-nodock>
<main class="wrap">
  <div class="top">
    <button class="tbtn" id="langBtn" type="button"></button>
    <button class="tbtn round" id="themeBtn" type="button"></button>
  </div>

  <header class="hero">
    <div class="kick" id="kick"></div>
    <div class="brand"><span class="a">Show</span><span class="b">biz</span></div>
    <p class="tag" id="tag"></p>
  </header>

  <a class="btn main" href="index.html">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5h2.2l2.3 11.2h10.4l2.1-7.6H6.6"/><circle cx="9.3" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg></span>
    <span class="tx" id="shopTxt"></span><span class="arr" aria-hidden="true">›</span>
  </a>

  <button class="btn" id="hoursBtn" type="button">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span>
    <span class="tx"><span id="hTtl"></span><span class="sub" id="hSub"></span></span>
    <span class="status" id="hStat"></span>
  </button>

  <a class="btn" href="contact.html">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1.3-4A8 8 0 1 1 8 18.7z"/></svg></span>
    <span class="tx" id="contactTxt"></span><span class="arr" aria-hidden="true">›</span>
  </a>

  <section class="sec">
    <div class="sh"><h2 id="pTtl"></h2></div>
    <div class="tabs" role="tablist">
      <button class="tab on" id="tabNew" type="button" data-tab="new"></button>
      <button class="tab" id="tabSale" type="button" data-tab="sale"></button>
    </div>
    <div class="car" id="pGrid"></div>
    <form class="psearch" id="pForm">
      <input id="pQ" type="search" autocomplete="off">
      <button type="submit" id="pGo"></button>
    </form>
    <a class="allbtn" id="allBtn" href="index.html"></a>
  </section>

  <section class="sec">
    <div class="sh"><h2 id="hlpTtl"></h2></div>
    <a class="help" id="hSales" target="_blank" rel="noopener">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5L5.5 4h13L20 9.5M4 9.5h16M5 9.5V20h14V9.5M9.5 20v-5h5v5"/></svg></span>
      <span class="tx"><b id="sLbl"></b><small id="sSub"></small></span>
    </a>
    <a class="help" id="hCare" target="_blank" rel="noopener">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 13a8 8 0 0 1 16 0"/><rect x="3" y="13" width="4" height="6" rx="1.5"/><rect x="17" y="13" width="4" height="6" rx="1.5"/><path d="M19 19c0 1.5-2 2-5 2"/></svg></span>
      <span class="tx"><b id="cLbl"></b><small id="cSub"></small></span>
    </a>
  </section>

  <div class="copy"><div class="ver" id="ver"></div></div>
</main>

<nav class="dock" aria-label="navigation">
  <a href="index.html" id="dShop"></a>
  <a href="#" id="dWa" target="_blank" rel="noopener"></a>
  <a href="#" id="dCall"></a>
</nav>

<div class="modal" id="hoursModal" hidden>
  <div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mTtl">
    <div class="mhead"><h3 id="mTtl"></h3><button class="mx" id="mClose" type="button" aria-label="close">×</button></div>
    <div class="mbody">
      <div class="mrow"><span id="rA1"></span><span id="rA2"></span></div>
      <div class="mrow"><span id="rB1"></span><span id="rB2"></span></div>
      <div class="mstat" id="mStat"></div>
    </div>
  </div>
</div>

<script>
  const CT = {
    ar: { kick: "متجر إلكتروني", tag: "متجر إلكتروني لمنتجات منزلية وإلكترونيات وأكثر.", hTtl: "أوقات العمل", hTap: "اضغط لعرض الجدول",
      open: "مفتوح الآن", closed: "مغلق الآن", shop: "تسوّق الآن", contact: "التواصل معنا", lang: "English", theme: "تغيير المظهر",
      pTtl: "منتجات مختارة", pLbl: "Showbiz", tabNew: "وصل حديثاً", tabSale: "خصومات", search: "ابحث عن منتج...", go: "بحث", all: "عرض كل المنتجات",
      hlp: "كيف نقدر نساعدك؟", sales: "الاستفسارات والمبيعات", salesSub: "معلومات المنتجات والطلبات",
      care: "خدمة العملاء بعد البيع", careSub: "الإرجاع والاستبدال والمتابعة",
      dShop: "تسوّق", dWa: "واتساب", dCall: "اتصال", mTtl: "أوقات العمل",
      rA: "السبت – الخميس", rB: "الجمعة", close: "إغلاق" },
    en: { kick: "Online store", tag: "An online store for home goods, electronics and more.", hTtl: "Working hours", hTap: "Tap to see the schedule",
      open: "Open now", closed: "Closed now", shop: "Shop now", contact: "Contact us", lang: "العربية", theme: "Change theme",
      pTtl: "Selected products", pLbl: "Showbiz", tabNew: "New arrivals", tabSale: "Discounts", search: "Search products...", go: "Search", all: "View all products",
      hlp: "How can we help?", sales: "Sales and enquiries", salesSub: "Product info and orders",
      care: "After-sales support", careSub: "Returns, exchanges and follow-up",
      dShop: "Shop", dWa: "WhatsApp", dCall: "Call", mTtl: "Working hours",
      rA: "Saturday – Thursday", rB: "Friday", close: "Close" }
  };
  const C = ShowbizCore.CONTACT;
  // ساعات العمل: السبت إلى الخميس، والجمعة (قيم تجريبية، عدّلها)
  const SCHEDULE = { week: { open: 9, close: 22 }, fri: { open: 11, close: 20 } };
  const RATE = 0.377;
  const readState = () => { try { return JSON.parse(localStorage.getItem("showbiz_state") || "{}"); } catch (e) { return {}; } };
  let lang = readState().lang === "en" ? "en" : "ar";
  let tab = "new";
  const L = () => CT[lang];
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const bhd = usd => (usd * RATE).toLocaleString("en-US", { minimumFractionDigits: 3, maximumFractionDigits: 3 });
  const h12 = h => { const x = h % 12 || 12; return x + ":00 " + (h < 12 ? (lang === "ar" ? "ص" : "AM") : (lang === "ar" ? "م" : "PM")); };
  const range = s => `<bdi>${h12(s.open)}</bdi> – <bdi>${h12(s.close)}</bdi>`;

  // الوقت الحالي بتوقيت البحرين، والجمعة لها جدول مختلف
  function nowBH() { return new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Bahrain" })); }
  function openState() {
    const n = nowBH(), h = n.getHours() + n.getMinutes() / 60;
    const s = n.getDay() === 5 ? SCHEDULE.fri : SCHEDULE.week;
    return { open: h >= s.open && h < s.close };
  }

  // المنتجات: الجديدة أولاً، والخصومات تشمل المنتجات اللي فيها سعر قبل الخصم
  const allProducts = () => (window.SHOWBIZ_DEMO && window.SHOWBIZ_DEMO.products) || [];
  const minOf = p => Math.min(...p.variants.map(v => Number(v.price)));
  const cmpOf = p => Math.max(0, ...p.variants.map(v => Number(v.compareAt || p.compareAt) || 0));
  function listFor(t) {
    const list = allProducts();
    if (t === "sale") return list.filter(p => cmpOf(p) > minOf(p)).slice(0, 8);
    return list.slice(0, 8);
  }
  function renderProducts() {
    const grid = document.getElementById("pGrid");
    grid.innerHTML = listFor(tab).map(p => {
      const name = (lang === "ar" && p.nameAr) ? p.nameAr : (p.nameEn || "");
      const min = minOf(p), cmp = cmpOf(p);
      const pct = cmp > min ? Math.round((1 - min / cmp) * 100) : 0;
      const pre = p.choose ? (lang === "ar" ? "يبدأ من " : "From ") : "";
      return `<a class="pc" href="index.html?q=${encodeURIComponent(name)}">
        <div class="im">${p.image ? `<img src="${esc(p.image)}" alt="" loading="lazy">` : ""}${pct ? `<span class="badge">-${pct}%</span>` : ""}</div>
        <div class="tx"><div class="nm">${esc(name)}</div><div class="pr">${esc(pre)}<b>BHD ${bhd(min)}</b>${cmp > min ? `<s>BHD ${bhd(cmp)}</s>` : ""}</div></div></a>`;
    }).join("") || `<p style="color:var(--muted)">—</p>`;
    grid.scrollLeft = 0;
  }

  function fillHours() {
    document.getElementById("rA1").textContent = L().rA;
    document.getElementById("rA2").innerHTML = range(SCHEDULE.week);
    document.getElementById("rB1").textContent = L().rB;
    document.getElementById("rB2").innerHTML = range(SCHEDULE.fri);
    const st = openState();
    const ms = document.getElementById("mStat");
    ms.textContent = st.open ? L().open : L().closed;
    ms.className = "mstat " + (st.open ? "open" : "closed");
  }

  function apply() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.title = "Showbiz";
    document.getElementById("kick").textContent = L().kick;
    document.getElementById("tag").textContent = L().tag;
    document.getElementById("shopTxt").textContent = L().shop;
    document.getElementById("hTtl").textContent = L().hTtl;
    document.getElementById("hSub").textContent = L().hTap;
    const st = openState();
    const hs = document.getElementById("hStat");
    hs.textContent = st.open ? L().open : L().closed;
    hs.className = "status " + (st.open ? "open" : "closed");
    document.getElementById("contactTxt").textContent = L().contact;
    document.getElementById("langBtn").textContent = L().lang;
    document.getElementById("pTtl").textContent = L().pTtl;
    document.getElementById("tabNew").textContent = L().tabNew;
    document.getElementById("tabSale").textContent = L().tabSale;
    document.getElementById("pQ").placeholder = L().search;
    document.getElementById("pGo").textContent = L().go;
    document.getElementById("allBtn").textContent = L().all;
    document.getElementById("hlpTtl").textContent = L().hlp;
    document.getElementById("sLbl").textContent = L().sales;
    document.getElementById("sSub").textContent = L().salesSub;
    document.getElementById("cLbl").textContent = L().care;
    document.getElementById("cSub").textContent = L().careSub;
    document.getElementById("mTtl").textContent = L().mTtl;
    document.getElementById("mClose").setAttribute("aria-label", L().close);
    document.getElementById("dShop").innerHTML = dockIcon("cart") + `<span>${L().dShop}</span>`;
    document.getElementById("dWa").innerHTML = dockIcon("chat") + `<span>${L().dWa}</span>`;
    document.getElementById("dCall").innerHTML = dockIcon("phone") + `<span>${L().dCall}</span>`;
    const wa = "https://wa.me/" + C.whatsapp;
    document.getElementById("dWa").href = wa;
    document.getElementById("hSales").href = wa + "?text=" + encodeURIComponent(lang === "ar" ? "مرحباً، عندي استفسار" : "Hello, I have a question");
    document.getElementById("hCare").href = wa + "?text=" + encodeURIComponent(lang === "ar" ? "مرحباً، أحتاج خدمة ما بعد البيع" : "Hello, I need after-sales support");
    document.getElementById("dCall").href = "tel:" + C.call;
    document.getElementById("ver").textContent = window.SHOWBIZ_BUILD ? window.SHOWBIZ_BUILD.version : "";
    document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
    fillHours();
    renderProducts();
    syncTheme();
  }

  function dockIcon(k) {
    const P = {
      cart: '<path d="M3 4.5h2.2l2.3 11.2h10.4l2.1-7.6H6.6"/><circle cx="9.3" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/>',
      chat: '<path d="M4 20l1.3-4A8 8 0 1 1 8 18.7z"/>',
      phone: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>'
    };
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[k]}</svg>`;
  }

  document.getElementById("langBtn").addEventListener("click", () => {
    lang = lang === "ar" ? "en" : "ar";
    try { const s = readState(); s.lang = lang; localStorage.setItem("showbiz_state", JSON.stringify(s)); } catch (e) {}
    apply();
  });

  // المظهر يبدأ داكن، والتبديل من الأيقونة بالانتقال الدائري
  const themeBtn = document.getElementById("themeBtn");
  const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>';
  const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  function syncTheme() {
    themeBtn.innerHTML = ShowbizCore.theme() === "light" ? MOON : SUN;
    themeBtn.setAttribute("aria-label", L().theme);
    themeBtn.title = L().theme;
  }
  if (ShowbizCore.theme() === "light") ShowbizCore.setTheme("dark");
  themeBtn.addEventListener("click", () => {
    ShowbizCore.setTheme(ShowbizCore.theme() === "light" ? "dark" : "light", themeBtn);
  });
  document.addEventListener("sbthemechange", syncTheme);

  // تبويب المنتجات
  document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => { tab = b.dataset.tab; apply(); }));

  // نافذة أوقات العمل
  const modal = document.getElementById("hoursModal");
  const openModal = () => { fillHours(); modal.hidden = false; };
  const closeModal = () => { modal.hidden = true; };
  document.getElementById("hoursBtn").addEventListener("click", openModal);
  document.getElementById("mClose").addEventListener("click", closeModal);
  modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

  document.getElementById("pForm").addEventListener("submit", e => {
    e.preventDefault();
    const q = document.getElementById("pQ").value.trim();
    location.href = "index.html" + (q ? "?q=" + encodeURIComponent(q) : "");
  });

  apply();
</script>
</body>
</html>
