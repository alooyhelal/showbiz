<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Showbiz</title>
<script src="version.js"></script>
<script src="shared.js"></script>
<style>
  :root { --bg:#0c1628; --card:#14213a; --card2:#1a2b4a; --line:#2c4168; --fg:#f2f5fa; --muted:#9aa8bf; --orange:#f59e4b; --teal:#2ec4b6; color-scheme:dark; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg); font-family:'Tajawal',system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
  .wrap { max-width:480px; margin:0 auto; padding-block:16px 24px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .tbtn { height:40px; min-width:40px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:inherit; font-size:13px; font-weight:700; cursor:pointer; padding:0 14px; display:flex; align-items:center; justify-content:center; }
  .tbtn.round { width:40px; padding:0; border-radius:50%; }
  .tbtn svg { width:20px; height:20px; }
  .brand { text-align:center; margin:22px 0 6px; font-family:'Cairo',system-ui,sans-serif; font-weight:800; font-size:40px; line-height:1; direction:ltr; }
  .brand .a { color:var(--orange); } .brand .b { color:var(--teal); }
  .tag { text-align:center; color:var(--muted); font-size:15px; line-height:1.7; margin:0 0 22px; }
  .card { display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:14px; }
  .ic { width:44px; height:44px; flex-shrink:0; border-radius:50%; background:rgba(255,255,255,.06); color:var(--orange); display:flex; align-items:center; justify-content:center; }
  .ic svg { width:22px; height:22px; }
  .grow { flex:1; min-width:0; }
  .grow h2 { margin:0; font-size:16px; font-weight:700; font-family:'Cairo',system-ui,sans-serif; }
  .grow p { margin:4px 0 0; color:var(--muted); font-size:14px; direction:ltr; text-align:start; }
  .status { font-size:12px; font-weight:800; padding:5px 10px; border-radius:999px; white-space:nowrap; }
  .status.open { background:rgba(34,197,94,.15); color:#4ade80; }
  .status.closed { background:rgba(248,113,113,.15); color:#fca5a5; }
  .btn { display:flex; align-items:center; gap:14px; padding:18px; border-radius:18px; text-decoration:none; font-family:'Cairo',system-ui,sans-serif; font-weight:800; font-size:18px; margin-bottom:12px; }
  .btn .arr { margin-inline-start:auto; font-size:22px; }
  .btn.main { background:var(--orange); color:#111; box-shadow:0 12px 28px rgba(245,158,75,.25); }
  .btn.sec { background:var(--card); color:var(--fg); border:1px solid var(--line); }
  .btn.sec:hover, .btn.main:hover { filter:brightness(1.05); }
  .copy { text-align:center; color:var(--muted); font-size:12px; margin-top:24px; }
</style>
</head>
<body data-nodock>
<main class="wrap">
  <div class="top">
    <button class="tbtn" id="langBtn" type="button"></button>
    <button class="tbtn round" id="themeBtn" type="button"></button>
  </div>

  <div class="brand"><span class="a">Show</span><span class="b">biz</span></div>
  <p class="tag" id="tag"></p>

  <section class="card">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span>
    <div class="grow"><h2 id="hTtl"></h2><p id="hTxt"></p></div>
    <span class="status" id="hStat"></span>
  </section>

  <a class="btn main" href="index.html">
    <span class="ic" style="background:rgba(0,0,0,.08);color:#111"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5h2.2l2.3 11.2h10.4l2.1-7.6H6.6"/><circle cx="9.3" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg></span>
    <span id="shopTxt"></span><span class="arr" aria-hidden="true">›</span>
  </a>

  <a class="btn sec" href="contact.html">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1.3-4A8 8 0 1 1 8 18.7z"/></svg></span>
    <span id="contactTxt"></span><span class="arr" aria-hidden="true">›</span>
  </a>

  <div class="copy" id="ver"></div>
</main>
<script>
  const CT = {
    ar: { tag: "متجر إلكتروني لمنتجات منزلية وإلكترونيات وأكثر.", hTtl: "أوقات العمل", open: "مفتوح الآن", closed: "مغلق الآن",
      shop: "تسوّق الآن", contact: "التواصل معنا", lang: "English", theme: "تغيير المظهر" },
    en: { tag: "An online store for home goods, electronics and more.", hTtl: "Working hours", open: "Open now", closed: "Closed now",
      shop: "Shop now", contact: "Contact us", lang: "العربية", theme: "Change theme" }
  };
  const C = ShowbizCore.CONTACT;
  const readState = () => { try { return JSON.parse(localStorage.getItem("showbiz_state") || "{}"); } catch (e) { return {}; } };
  let lang = readState().lang === "en" ? "en" : "ar";
  const L = () => CT[lang];
  const h12 = h => (h % 12 || 12) + (h < 12 ? (lang === "ar" ? " ص" : " AM") : (lang === "ar" ? " م" : " PM"));

  // ساعات العمل بتوقيت البحرين
  function hoursState() {
    const now = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Bahrain" }));
    const h = now.getHours() + now.getMinutes() / 60;
    return { open: h >= C.hours.open && h < C.hours.close, text: h12(C.hours.open) + " – " + h12(C.hours.close) };
  }

  function apply() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.title = "Showbiz";
    document.getElementById("tag").textContent = L().tag;
    document.getElementById("hTtl").textContent = L().hTtl;
    const hs = hoursState();
    document.getElementById("hTxt").textContent = hs.text;
    const st = document.getElementById("hStat");
    st.textContent = hs.open ? L().open : L().closed;
    st.className = "status " + (hs.open ? "open" : "closed");
    document.getElementById("shopTxt").textContent = L().shop;
    document.getElementById("contactTxt").textContent = L().contact;
    document.getElementById("langBtn").textContent = L().lang;
    document.getElementById("ver").textContent = window.SHOWBIZ_BUILD ? window.SHOWBIZ_BUILD.version : "";
    syncTheme();
  }

  document.getElementById("langBtn").addEventListener("click", () => {
    lang = lang === "ar" ? "en" : "ar";
    try { const s = readState(); s.lang = lang; localStorage.setItem("showbiz_state", JSON.stringify(s)); } catch (e) {}
    apply();
  });

  // المظهر يبدأ داكن، والتبديل من الأيقونة بالانتقال الدائري
  const themeBtn = document.getElementById("themeBtn");
  const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>';
  const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  function syncTheme() {
    themeBtn.innerHTML = ShowbizCore.theme() === "light" ? MOON : SUN;
    themeBtn.setAttribute("aria-label", L().theme);
    themeBtn.title = L().theme;
  }
  if (ShowbizCore.theme() === "light") ShowbizCore.setTheme("dark");
  themeBtn.addEventListener("click", () => {
    ShowbizCore.setTheme(ShowbizCore.theme() === "light" ? "dark" : "light", themeBtn);
  });
  document.addEventListener("sbthemechange", syncTheme);

  apply();
</script>
</body>
</html>
