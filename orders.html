<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Showbiz طلباتي</title>
<script src="version.js"></script>
<script src="shared.js"></script>
<style>
  :root { --bg:#0c1628; --card:#14213a; --card2:#1a2b4a; --field:#1d2f50; --line:#2c4168; --fg:#f2f5fa; --muted:#9aa8bf; --orange:#f59e4b; --orange-d:#e0852f; --err:#ff8593; --errbg:rgba(255,133,147,.12); --ok:#5fd39a; --okbg:rgba(95,211,154,.12); color-scheme:dark; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
  .wrap { max-width:560px; margin:0 auto; padding-block:18px 40px; }
  .hdr { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:18px; }
  .brand { font-weight:800; font-size:18px; color:var(--fg); text-decoration:none; }
  .brand b { color:var(--orange); }
  .tools { display:flex; gap:8px; align-items:center; }
  .navwrap { position:relative; }
  .menu { position:absolute; top:calc(100% + 6px); inset-inline-start:0; min-width:220px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:6px; z-index:30; box-shadow:0 12px 30px rgba(0,0,0,.5); }
  .menu a { display:block; padding:10px 12px; border-radius:8px; color:var(--fg); text-decoration:none; font-size:14px; }
  .menu a:hover { background:var(--card2); }
  .menu a.cur { color:var(--orange); font-weight:700; }
  .menu .btn { width:100%; margin-top:4px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 14px; line-height:1.7; }
  .btn { border:0; border-radius:12px; padding:12px 16px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; text-decoration:none; display:inline-block; text-align:center; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn-main { background:var(--orange); color:#111; }
  .btn-main:hover:not(:disabled) { background:var(--orange-d); }
  .btn-line { background:transparent; color:var(--fg); border:1px solid var(--line); }
  .btn-sm { padding:8px 12px; font-size:13px; border-radius:10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px 18px; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .full { grid-column:1 / -1; }
  @media (max-width:480px) { .grid { grid-template-columns:1fr; } }
  label { display:block; font-size:13px; font-weight:600; color:var(--muted); margin:0 0 6px; }
  input, select { width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:12px; background:var(--field); color:var(--fg); font-size:15px; font-family:inherit; }
  input:focus, select:focus { outline:2px solid var(--orange); outline-offset:0; }
  input[readonly] { opacity:.65; cursor:not-allowed; }
  option { background:var(--card); color:var(--fg); }
  .actions { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; justify-content:flex-end; align-items:center; }
  .hint { color:var(--muted); font-size:13px; margin-inline-end:auto; }
  .msg { border-radius:10px; padding:10px 12px; font-size:14px; line-height:1.6; margin-bottom:14px; border:1px solid transparent; }
  .msg.ok { color:var(--ok); background:var(--okbg); border-color:rgba(95,211,154,.35); }
  .msg.err { color:var(--err); background:var(--errbg); border-color:rgba(255,133,147,.35); }
  .phonebox { margin-top:10px; padding:14px; background:var(--card2); border:1px solid var(--line); border-radius:14px; }
  .phrow { display:grid; grid-template-columns:150px 1fr; gap:10px; }
  .ltr { direction:ltr; }
  .ver { text-align:center; color:var(--muted); font-size:12px; margin-top:22px; direction:ltr; }
  .loading { padding:8px 0; }
  .hidden { display:none !important; }
</style>
<style>
  .ord { border:1px solid var(--line, #2c4168); border-radius:16px; padding:16px; margin-bottom:12px; background: var(--card, #14213a); }
  .ord .top { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .ord .id { font-weight:800; font-family: ui-monospace, monospace; direction:ltr; }
  .badge { font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px; background: rgba(245,158,75,.14); color: var(--orange, #f59e4b); }
  .ord .muted { color: var(--muted, #9aa8bf); font-size:13px; line-height:1.7; }
  .ord .items { font-size:14px; line-height:1.9; margin: 8px 0; }
  .ord .total { display:flex; justify-content:space-between; border-top:1px solid var(--line, #2c4168); padding-top:10px; margin-top:8px; font-weight:800; }
  .empty { text-align:center; padding: 46px 14px; color: var(--muted, #9aa8bf); }
  .empty .big { font-size: 42px; margin-bottom: 8px; }
</style>
<style>
  .acct-hd { position:relative; display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 0 14px; margin-bottom:14px; border-bottom:1px solid var(--line, #2c4168); }
  .acct-brand { position:absolute; left:50%; transform:translateX(-50%); font-weight:800; font-size:18px; color:var(--fg, #f2f5fa); text-decoration:none; }
  .acct-brand b { color:var(--orange, #f59e4b); }
  .acct-back { width:38px; height:38px; border-radius:12px; display:inline-flex; align-items:center; justify-content:center; color:var(--fg, #f2f5fa); border:1px solid var(--line, #2c4168); text-decoration:none; z-index:1; }
  html[dir=rtl] .acct-back svg { transform:scaleX(-1); }
  .acct-hd .tools { z-index:1; }
  .menu { position:fixed !important; top:64px; left:12px !important; right:auto !important; min-width:0 !important; width:min(240px, calc(100vw - 24px)); }
  .icon-del { padding:8px 10px; }
  .icon-del svg { width:18px; height:18px; }
</style>
</head>
<body data-lite>
<div class="wrap">
  <div class="acct-hd">
    <a class="acct-back" href="index.html" aria-label="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M15 6l-6 6 6 6"/></svg></a>
    <a class="acct-brand" href="index.html">Show<b>biz</b></a>
    <div class="tools">
      <button class="btn btn-line btn-sm" id="langBtn" type="button"></button>
      <div class="navwrap">
        <button class="btn btn-line btn-sm" id="menuBtn" type="button" data-icon="menu" aria-label="menu"></button>
        <div class="menu hidden" id="navMenu">
          <a href="index.html" data-k="navStore"></a>
          <a href="account.html" data-k="navAccount"></a>
          <a href="orders.html" class="cur" data-k="navOrders"></a>
          <a href="addresses.html" data-k="navAddr"></a>
          <a href="delete-account.html" data-k="navDel"></a>
          <button class="btn btn-line btn-sm" id="navLogout" type="button" data-k="logout"></button>
        </div>
      </div>
    </div>
  </div>

  <h1 data-k="title"></h1>
  <p class="sub" data-k="intro"></p>
  <div id="loading" class="loading" data-k="loading" aria-hidden="true"><div class="sk-b sk-title"></div><div class="sk-b sk-row" style="height:110px"></div><div class="sk-b sk-row" style="height:110px"></div><div class="sk-b sk-row" style="height:110px"></div></div>
  <div id="list" class="hidden"></div>
  <div class="ver" id="ver"></div>
</div>

<script src="locations.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js" onerror="document.write('<script src=\'https://unpkg.com/@supabase/supabase-js@2.50.0/dist/umd/supabase.js\'><\/script>')"></script>
<script>
  const SUPABASE_URL = "https://fgfteqzwmtxiluqvtrak.supabase.co";
  const SUPABASE_KEY = "sb_publishable_yjE5H3v--wTK29FCi57xSA_TS3NOc5V";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const RATE_BHD = 0.377;
  const COUPONS = { TEST10: 0.10 };
  const COUNTRIES = {
    BH: { flag:"🇧🇭", dial:"+973", name:{ar:"البحرين", en:"Bahrain"}, sym:{ar:"د.ب", en:"BD"}, dec:3, rate:0.377, base:2.2 },
    SA: { flag:"🇸🇦", dial:"+966", name:{ar:"السعودية", en:"Saudi Arabia"}, sym:{ar:"SAR", en:"SAR"}, dec:2, rate:3.75, base:3.3 },
    AE: { flag:"🇦🇪", dial:"+971", name:{ar:"الإمارات", en:"UAE"}, sym:{ar:"AED", en:"AED"}, dec:2, rate:3.6725, base:3.3 },
    KW: { flag:"🇰🇼", dial:"+965", name:{ar:"الكويت", en:"Kuwait"}, sym:{ar:"د.ك", en:"KD"}, dec:3, rate:0.307, base:3.3 },
    QA: { flag:"🇶🇦", dial:"+974", name:{ar:"قطر", en:"Qatar"}, sym:{ar:"ر.ق", en:"QR"}, dec:2, rate:3.64, base:3.3 },
    OM: { flag:"🇴🇲", dial:"+968", name:{ar:"عُمان", en:"Oman"}, sym:{ar:"OMR", en:"OMR"}, dec:3, rate:0.385, base:3.3 }
  };

  const T = {
    ar: { navStore:"المتجر", navAccount:"معلومات الحساب", navOrders:"طلباتي", navAddr:"عناويني", navDel:"حذف الحساب",
      logout:"تسجيل الخروج", switchLabel:"English", title:"طلباتي", intro:"تابع حالة طلباتك هنا.",
      loading:"جاري التحميل...", none:"ما عندك طلبات بعد.", errLoad:"تعذر تحميل الطلبات، حاول مرة ثانية.",
      qty:"×", ship:"التوصيل إلى", placed:"تاريخ الطلب", total:"الإجمالي",
      st_default:"قيد المعالجة", ver:"النسخة", upd:"آخر تحديث" },
    en: { navStore:"Store", navAccount:"Account details", navOrders:"My orders", navAddr:"My addresses", navDel:"Delete account",
      logout:"Log out", switchLabel:"العربية", title:"My orders", intro:"Follow the status of your orders here.",
      loading:"Loading...", none:"You have no orders yet.", errLoad:"Could not load orders, please try again.",
      qty:"×", ship:"Delivering to", placed:"Order date", total:"Total",
      st_default:"Processing", ver:"Version", upd:"Last update" }
  };
  let state = { country:"BH", lang:"ar" };
  try { Object.assign(state, JSON.parse(localStorage.getItem("showbiz_state") || "{}")); } catch (e) {}
  if (!COUNTRIES[state.country]) state.country = "BH";
  const L = () => T[state.lang];
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  function fmtFor(code, amount) {
    const c = COUNTRIES[code] || COUNTRIES[state.country];
    const n = Number(amount || 0).toFixed(c.dec);
    return state.lang === "ar" ? `${n} ${c.sym.ar}` : `${c.sym.en} ${n}`;
  }
  function statusLabel(s) {
    if (s === "test-not-sent-to-cj") return L().st_default;
    return s || L().st_default;
  }
  function saveLang() { try { const st = JSON.parse(localStorage.getItem("showbiz_state") || "{}"); st.lang = state.lang; localStorage.setItem("showbiz_state", JSON.stringify(st)); } catch (e) {} }

  function apply() {
    document.documentElement.lang = state.lang;
    document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
    document.title = "Showbiz " + L().title;
    document.querySelectorAll("[data-k]").forEach(el => { el.textContent = L()[el.dataset.k]; });
    document.getElementById("langBtn").textContent = L().switchLabel;
    document.getElementById("ver").textContent = `${L().ver}: ${window.SHOWBIZ_BUILD.version} · ${L().upd}: ${window.SHOWBIZ_BUILD.updated}`;
  }

  function render(rows) {
    const box = document.getElementById("list");
    if (!rows.length) { box.innerHTML = `<div class="empty"><div class="big">🧾</div>${L().none}</div>`; return; }
    box.innerHTML = rows.map(o => {
      const items = (Array.isArray(o.items) ? o.items : []).map(it => `<div>${esc(it.name || "")}${it.variant ? " · " + esc(String(it.variant).replace(/-/g, " · ")) : ""} <span class="muted">${L().qty}${Number(it.qty) || 1}</span></div>`).join("");
      const addr = o.shipping_address && o.shipping_address.text ? esc(o.shipping_address.text) : "";
      const date = String(o.created_at || "").slice(0, 10);
      return `<div class="ord">
        <div class="top"><span class="id">#${esc(String(o.id).slice(0, 8))}</span><span class="badge">${esc(statusLabel(o.status))}</span></div>
        <div class="muted">${L().placed}: ${esc(date)}</div>
        <div class="items">${items}</div>
        ${addr ? `<div class="muted">${L().ship}: ${addr}</div>` : ""}
        <div class="total"><span>${L().total}</span><span>${fmtFor(o.country, o.total)}</span></div>
      </div>`;
    }).join("");
  }

  async function init() {
    apply();
    const ok = await ShowbizCore.enforceLogin(sb);
    let session = null;
    try { const { data } = await sb.auth.getSession(); session = data && data.session; } catch (e) {}
    if (!ok || !session) { location.replace("login.html"); return; }
    let rows = [];
    try {
      const { data, error } = await sb.from("orders").select("*").eq("user_id", session.user.id).order("created_at", { ascending: false });
      if (error) throw error;
      rows = data || [];
    } catch (e) { rows = []; }
    // الطلبات اللي ما وصلت للسيرفر تظهر من نسخة هذا المتصفح، والأحدث أولاً
    try {
      const local = JSON.parse(localStorage.getItem("showbiz_orders") || "[]")
        .filter(o => o.user_id === session.user.id)
        .map(o => ({ ...o, id: o.id || String(o.created || "").replace(/\D/g, "").slice(-8), created_at: o.created_at || o.created }));
      rows = rows.concat(local);
    } catch (e) {}
    rows.sort((a, b) => String(b.created_at || "").localeCompare(String(a.created_at || "")));
    document.getElementById("loading").classList.add("hidden");
    document.getElementById("list").classList.remove("hidden");
    render(rows);
  }

  document.getElementById("langBtn").addEventListener("click", () => { state.lang = state.lang === "ar" ? "en" : "ar"; saveLang(); apply(); });
  document.getElementById("menuBtn").addEventListener("click", (e) => { e.stopPropagation(); document.getElementById("navMenu").classList.toggle("hidden"); });
  document.addEventListener("click", (e) => { if (!e.target.closest(".navwrap")) document.getElementById("navMenu").classList.add("hidden"); });
  document.getElementById("navLogout").addEventListener("click", async () => { ShowbizCore.clearLogin(); try { await sb.auth.signOut(); } catch (e) {} location.replace("index.html"); });
  init();
</script>
</body>
</html>
