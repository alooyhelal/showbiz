<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Showbiz تسجيل الدخول</title>
<style>
  :root { --bg:#0b1220; --card:#162033; --card2:#1d2a44; --fg:#eef2f7; --muted:#9aa7bd; --line:#2c3b5a; --orange:#f59e4b; --orange-d:#e0852f; --err:#ffb4bf; --errbg:#3b1620; --errline:#7a2b3b; color-scheme:dark; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
  .wrap { max-width:420px; margin:0 auto; padding-block:24px 36px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:22px; box-shadow:0 20px 50px rgba(0,0,0,.35); padding:24px 22px 28px; }
  .top { display:flex; justify-content:flex-start; margin-bottom:6px; }
  .lang { background:var(--card2); color:var(--fg); border:1px solid var(--line); border-radius:10px; padding:7px 12px; font-size:13px; cursor:pointer; font-family:inherit; }
  .brand { text-align:center; margin:4px 0 16px; }
  .mark { width:64px; height:64px; margin:0 auto 10px; border-radius:18px; background:var(--orange); color:#111; display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:800; }
  .mark b { color:var(--bg); }
  .brand .name { font-weight:800; letter-spacing:.5px; color:var(--orange); font-size:15px; }
  h1 { font-size:24px; margin:0 0 6px; text-align:center; color:var(--fg); }
  .sub { color:var(--muted); text-align:center; font-size:14px; margin:0 0 18px; line-height:1.7; }
  label { display:block; font-size:13px; font-weight:600; color:var(--muted); margin:14px 0 6px; }
  input { width:100%; padding:14px; border:1px solid var(--line); border-radius:12px; background:var(--card2); color:var(--fg); font-size:15px; font-family:inherit; }
  input:focus { outline:2px solid var(--orange); outline-offset:0; }
  input.bad { border-color:var(--err); outline:1px solid var(--err); }
  .pw { position:relative; }
  .pw input { padding-inline-end:46px; }
  .eye { position:absolute; top:0; bottom:0; inset-inline-end:0; width:46px; border:0; background:transparent; color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
  .ferr { color:var(--err); font-size:13px; line-height:1.6; margin-top:6px; }
  .hidden { display:none !important; }
  .link { color:var(--orange); font-weight:700; font-size:14px; text-decoration:underline; text-underline-offset:3px; padding:4px 2px; display:inline-block; }
  .msg { text-align:center; font-size:14px; border-radius:10px; padding:9px 10px; margin-top:12px; line-height:1.6; color:var(--err); background:var(--errbg); border:1px solid var(--errline); }
  .row2 { display:flex; gap:10px; margin-top:14px; }
  .btn { flex:1; display:block; text-align:center; text-decoration:none; border:0; border-radius:12px; padding:14px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; }
  .btn-main { background:var(--orange); color:#111; }
  .btn-main:hover { background:var(--orange-d); }
  .btn-main:disabled { opacity:.6; cursor:wait; }
  .btn-line { background:transparent; color:var(--fg); border:1px solid var(--line); }
  .linkrow { text-align:center; margin-top:18px; font-size:14px; color:var(--muted); }
  .ver { text-align:center; color:var(--muted); font-size:12px; margin-top:18px; direction:ltr; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="top"><button class="lang" id="langBtn" type="button"></button></div>
    <div class="brand"><div class="mark">S<b>.</b></div><div class="name">Showbiz</div></div>
    <h1 data-k="title"></h1>
    <p class="sub" data-k="sub"></p>

    <label for="lEmail" data-k="email"></label>
    <input id="lEmail" type="email" dir="ltr" autocomplete="email">
    <div class="ferr hidden" id="lEmailErr"></div>

    <label for="lPass" data-k="pass"></label>
    <div class="pw">
      <input id="lPass" type="password" dir="ltr" autocomplete="current-password">
      <button class="eye" id="eyeBtn" type="button" aria-label=""></button>
    </div>
    <div class="ferr hidden" id="lPassErr"></div>

    <div><a class="link" href="forgot.html" data-k="forgot"></a></div>

    <div id="notice" class="msg hidden"></div>

    <div class="row2">
      <a class="btn btn-line" href="index.html" data-k="cancel"></a>
      <button class="btn btn-main" id="loginBtn" type="button"></button>
    </div>

    <div class="linkrow"><span data-k="noAcc"></span> <a class="link" href="signup.html" data-k="signupLink"></a></div>
  </div>
  <div class="ver">v21 · 2026-11-23 09:05</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = "https://fgfteqzwmtxiluqvtrak.supabase.co";
  const SUPABASE_KEY = "sb_publishable_yjE5H3v--wTK29FCi57xSA_TS3NOc5V";
  const EMAIL_RE = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}$/;
  const COUNTRY_CODES = ["BH", "SA", "AE", "KW", "QA", "OM"];

  const T = {
    ar: { title:"تسجيل الدخول", sub:"أدخل بيانات حسابك للمتابعة", email:"البريد الإلكتروني",
      pass:"كلمة المرور", forgot:"نسيت كلمة المرور؟", cancel:"إلغاء", loginBtn:"دخول", loading:"جاري الدخول...",
      noAcc:"ليس لديك حساب؟", signupLink:"سجّل حساب الآن", show:"إظهار كلمة المرور", hide:"إخفاء كلمة المرور",
      emailBad:"البريد الإلكتروني غير صحيح، لأنه لم يتم كتابته بشكل صحيح", passReq:"اكتب كلمة المرور",
      loginFail:"البريد الإلكتروني أو كلمة المرور غير صحيحة", notConfirmed:"لم يتم التحقق من بريد هذا الحساب بعد",
      rateLimit:"محاولات كثيرة، انتظر قليلًا ثم حاول مرة ثانية", switchLabel:"English" },
    en: { title:"Log in", sub:"Enter your account details to continue", email:"Email",
      pass:"Password", forgot:"Forgot password?", cancel:"Cancel", loginBtn:"Log in", loading:"Logging in...",
      noAcc:"Don't have an account?", signupLink:"Create an account", show:"Show password", hide:"Hide password",
      emailBad:"The email is not valid, it was not typed correctly", passReq:"Enter your password",
      loginFail:"Email or password is incorrect", notConfirmed:"This account's email has not been verified yet",
      rateLimit:"Too many attempts, wait a moment and try again", switchLabel:"العربية" }
  };

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = (id) => document.getElementById(id);
  const L = () => T[lang];
  const isEmail = (s) => EMAIL_RE.test(String(s || "").trim());

  // الحالة المشتركة مع المتجر (لغة + دولة مفضلة)
  let lang = "ar";
  try {
    const st = JSON.parse(localStorage.getItem("showbiz_state") || "{}");
    if (st.lang === "en" || st.lang === "ar") lang = st.lang;
  } catch (e) {}
  let busy = false;

  function mergeState(patch) {
    try {
      const st = JSON.parse(localStorage.getItem("showbiz_state") || "{}");
      localStorage.setItem("showbiz_state", JSON.stringify({ ...st, ...patch }));
    } catch (e) {}
  }
  function setErr(id, msg) {
    const i = $(id), e = $(id + "Err");
    if (i) i.classList.toggle("bad", !!msg);
    if (e) { e.textContent = msg || ""; e.classList.toggle("hidden", !msg); }
  }
  function setNotice(msg) {
    const n = $("notice");
    n.textContent = msg || ""; n.classList.toggle("hidden", !msg);
  }
  // الرسالة الحقيقية من Supabase مع الكود، عدا الحالات المعروفة
  function errMsg(e) {
    const m = String(e?.message || e || "");
    if (/invalid login/i.test(m)) return L().loginFail;
    if (/email not confirmed/i.test(m)) return L().notConfirmed;
    if (/rate|too many|seconds/i.test(m)) return L().rateLimit;
    const extra = [e?.code, e?.status].filter(Boolean).join(" · ");
    return extra ? `${m} (${extra})` : m;
  }

  function apply() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-k]").forEach(el => { el.textContent = L()[el.dataset.k]; });
    $("langBtn").textContent = L().switchLabel;
    const hidden = $("lPass").type === "password";
    $("eyeBtn").setAttribute("aria-label", hidden ? L().show : L().hide);
    $("eyeBtn").title = hidden ? L().show : L().hide;
    $("loginBtn").textContent = busy ? L().loading : L().loginBtn;
    $("loginBtn").disabled = busy;
    document.title = "Showbiz " + L().title;
  }

  async function doLogin() {
    if (busy) return;
    const email = $("lEmail").value.trim();
    const pass = $("lPass").value;
    setErr("lEmail", ""); setErr("lPass", ""); setNotice("");
    if (!isEmail(email)) return setErr("lEmail", L().emailBad);
    if (!pass) return setErr("lPass", L().passReq);
    busy = true; apply();
    try {
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) {
        // Supabase ما يفرّق بين البريد الغلط وكلمة المرور الغلط، فنعرض الخطأ على الاثنين
        if (/invalid login/i.test(String(error.message || ""))) {
          setErr("lPass", L().loginFail);
          $("lEmail").classList.add("bad");
        } else {
          setNotice(errMsg(error));
        }
        return;
      }
      // الدولة المفضلة المحفوظة في الحساب تنطبق تلقائيًا عند كل دخول
      const pref = data?.user?.user_metadata?.preferred_country;
      if (COUNTRY_CODES.includes(pref)) mergeState({ country: pref });
      location.href = "index.html";
    } catch (e) {
      setNotice(errMsg(e));
    } finally {
      busy = false; apply();
    }
  }

  $("loginBtn").addEventListener("click", doLogin);
  ["lEmail", "lPass"].forEach(id => {
    $(id).addEventListener("input", () => { setErr(id, ""); $("lEmail").classList.remove("bad"); setNotice(""); });
    $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
  });
  $("eyeBtn").addEventListener("click", () => {
    const i = $("lPass");
    i.type = i.type === "password" ? "text" : "password";
    apply();
  });
  $("langBtn").addEventListener("click", () => {
    lang = lang === "ar" ? "en" : "ar";
    mergeState({ lang });
    apply();
  });

  // إذا الزائر مسجل دخول من قبل نرجعه للمتجر
  sb.auth.getSession().then(({ data }) => { if (data && data.session) location.replace("index.html"); }).catch(() => {});

  apply();
</script>
</body>
</html>
