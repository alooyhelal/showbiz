<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Showbiz حسابي</title>
<style>
  :root { --bg:#0c1628; --card:#14213a; --card2:#1a2b4a; --field:#1d2f50; --line:#2c4168; --fg:#f2f5fa; --muted:#9aa8bf; --orange:#f59e4b; --orange-d:#e0852f; --err:#ff8593; --errbg:rgba(255,133,147,.12); --ok:#5fd39a; --okbg:rgba(95,211,154,.12); color-scheme:dark; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
  .wrap { max-width:560px; margin:0 auto; padding-block:18px 40px; }
  .hdr { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  .brand { font-weight:800; font-size:18px; color:var(--fg); text-decoration:none; }
  .brand b { color:var(--orange); }
  .tools { display:flex; gap:8px; }
  h1 { font-size:22px; margin:0 0 4px; }
  h2 { font-size:17px; margin:0 0 12px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 14px; line-height:1.7; }
  .btn { border:0; border-radius:12px; padding:12px 16px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; text-decoration:none; display:inline-block; text-align:center; }
  .btn-main { background:var(--orange); color:#111; }
  .btn-main:hover { background:var(--orange-d); }
  .btn-main:disabled { opacity:.6; cursor:wait; }
  .btn-line { background:transparent; color:var(--fg); border:1px solid var(--line); }
  .btn-danger { background:#b42339; color:#fff; }
  .btn-sm { padding:7px 12px; font-size:13px; border-radius:10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px 18px; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .full { grid-column:1 / -1; }
  @media (max-width:480px) { .grid { grid-template-columns:1fr; } }
  label { display:block; font-size:13px; font-weight:600; color:var(--muted); margin:0 0 6px; }
  input, select, textarea { width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:12px; background:var(--field); color:var(--fg); font-size:15px; font-family:inherit; }
  textarea { resize:vertical; min-height:60px; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--orange); outline-offset:0; }
  input[readonly] { opacity:.65; cursor:not-allowed; }
  input.bad { border-color:var(--err); }
  option { background:var(--card); color:var(--fg); }
  .actions { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; justify-content:flex-end; }
  .msg { border-radius:10px; padding:10px 12px; font-size:14px; line-height:1.6; margin-bottom:14px; border:1px solid transparent; }
  .msg.ok { color:var(--ok); background:var(--okbg); border-color:rgba(95,211,154,.35); }
  .msg.err { color:var(--err); background:var(--errbg); border-color:rgba(255,133,147,.35); }
  .addr { background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px; }
  .addr-h { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap; }
  .addr-t { font-weight:700; }
  .addr-b { color:var(--muted); font-size:13px; line-height:1.7; }
  .addr-a { display:flex; gap:8px; }
  .empty { color:var(--muted); font-size:14px; text-align:center; padding:14px 0; }
  .danger-box { border:1px solid rgba(255,133,147,.35); background:rgba(255,133,147,.06); border-radius:14px; padding:14px; }
  .danger-box p { color:var(--muted); font-size:13px; line-height:1.7; margin:0 0 12px; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50; }
  .box { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px 18px; max-width:380px; width:100%; }
  .box h3 { margin:0 0 8px; font-size:17px; }
  .box p { color:var(--muted); font-size:14px; line-height:1.7; margin:0 0 14px; }
  .loading { text-align:center; color:var(--muted); padding:60px 0; }
  .ver { text-align:center; color:var(--muted); font-size:12px; margin-top:22px; direction:ltr; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <a class="brand" href="index.html">Show<b>biz</b></a>
    <div class="tools">
      <button class="btn btn-line btn-sm" id="langBtn" type="button"></button>
      <a class="btn btn-line btn-sm" href="index.html" data-k="back"></a>
    </div>
  </div>

  <div id="loading" class="loading" data-k="loading"></div>

  <div id="page" class="hidden">
    <h1 data-k="title"></h1>
    <p class="sub" data-k="intro"></p>

    <div class="card">
      <h2 data-k="infoTitle"></h2>
      <div id="infoMsg" class="msg hidden"></div>
      <div class="grid">
        <div><label for="fn" data-k="fn"></label><input id="fn" autocomplete="given-name"></div>
        <div><label for="ln" data-k="ln"></label><input id="ln" autocomplete="family-name"></div>
        <div class="full"><label for="email" data-k="email"></label><input id="email" dir="ltr" readonly></div>
        <div><label for="phone" data-k="phone"></label><input id="phone" dir="ltr" type="tel" autocomplete="tel"></div>
        <div><label for="country" data-k="country"></label><select id="country"></select></div>
      </div>
      <div class="actions">
        <button class="btn btn-main" id="saveBtn" type="button"></button>
      </div>
    </div>

    <div class="card">
      <h2 data-k="addrTitle"></h2>
      <p class="sub" data-k="addrSub"></p>
      <div id="addrNotice" class="msg hidden"></div>
      <div id="addrList"></div>

      <div id="addrFormWrap" class="hidden" style="margin-top:14px">
        <div class="grid">
          <div><label for="aLabel" data-k="aLabel"></label><input id="aLabel"></div>
          <div><label for="aName" data-k="aName"></label><input id="aName"></div>
          <div><label for="aPhone" data-k="aPhone"></label><input id="aPhone" dir="ltr" type="tel"></div>
          <div><label for="aCountry" data-k="aCountry"></label><select id="aCountry"></select></div>
          <div><label for="aCity" data-k="aCity"></label><input id="aCity"></div>
          <div class="full"><label for="aLine" data-k="aLine"></label><input id="aLine"></div>
          <div class="full"><label for="aNotes" data-k="aNotes"></label><textarea id="aNotes"></textarea></div>
        </div>
        <div class="actions">
          <button class="btn btn-line" id="aCancel" type="button" data-k="aCancel"></button>
          <button class="btn btn-main" id="aSave" type="button" data-k="aSave"></button>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-line" id="addAddrBtn" type="button" data-k="addAddr"></button>
      </div>
    </div>

    <div class="card">
      <h2 data-k="dangerTitle"></h2>
      <div class="danger-box">
        <p data-k="dangerText"></p>
        <button class="btn btn-danger" id="delBtn" type="button" data-k="delBtn"></button>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-line" id="logoutBtn" type="button" data-k="logout"></button>
    </div>
  </div>

  <div class="ver" id="ver"></div>
</div>

<div class="modal hidden" id="delModal">
  <div class="box">
    <h3 data-k="delTitle"></h3>
    <p data-k="delAsk"></p>
    <div class="actions">
      <button class="btn btn-line" id="delNo" type="button" data-k="cancel"></button>
      <button class="btn btn-danger" id="delYes" type="button" data-k="delConfirm"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"></script>
<script>
  const BUILD = { version: "v1", updated: "2026-11-23 17:30" };

  const SUPABASE_URL = "https://fgfteqzwmtxiluqvtrak.supabase.co";
  const SUPABASE_KEY = "sb_publishable_yjE5H3v--wTK29FCi57xSA_TS3NOc5V";

  const COUNTRIES = [
    { code: "BH", flag: "🇧🇭", ar: "البحرين", en: "Bahrain" },
    { code: "SA", flag: "🇸🇦", ar: "السعودية", en: "Saudi Arabia" },
    { code: "AE", flag: "🇦🇪", ar: "الإمارات", en: "UAE" },
    { code: "KW", flag: "🇰🇼", ar: "الكويت", en: "Kuwait" },
    { code: "QA", flag: "🇶🇦", ar: "قطر", en: "Qatar" },
    { code: "OM", flag: "🇴🇲", ar: "عُمان", en: "Oman" }
  ];

  const T = {
    ar: {
      title: "حسابي", intro: "عدّل معلومات حسابك وإدارة عناوينك من هنا", back: "المتجر", loading: "جاري تحميل حسابك...",
      infoTitle: "معلومات حسابي", fn: "الاسم الأول", ln: "اسم العائلة", email: "البريد الإلكتروني", phone: "رقم الهاتف", country: "الدولة",
      save: "حفظ التغييرات", saving: "جاري الحفظ...", saved: "تم حفظ معلوماتك", reqName: "اكتب الاسم الأول واسم العائلة", phoneBad: "رقم الهاتف غير صحيح",
      addrTitle: "عناويني", addrSub: "العناوين المحفوظة لطلباتك القادمة", addAddr: "+ إضافة عنوان", edit: "تعديل", delAddr: "حذف",
      noAddr: "ما عندك عناوين محفوظة بعد", aLabel: "اسم العنوان (مثل: البيت)", aName: "اسم المستلم", aPhone: "رقم الجوال", aCountry: "الدولة",
      aCity: "المدينة / المنطقة", aLine: "الشارع، المبنى، الشقة", aNotes: "ملاحظات (اختياري)", aSave: "حفظ العنوان", aCancel: "إلغاء",
      aReq: "اكتب اسم العنوان والمدينة والتفاصيل", addrSaved: "تم حفظ العنوان", addrDeleted: "تم حذف العنوان",
      dangerTitle: "حذف الحساب", dangerText: "حذف الحساب نهائي ولا يمكن التراجع عنه، وتُحذف معه بياناتك المحفوظة.", delBtn: "حذف حسابي",
      delTitle: "هل تود حذف الحساب؟", delAsk: "سيتم حذف حسابك وبياناتك نهائيًا. هل أنت متأكد؟", cancel: "إلغاء", delConfirm: "نعم، احذف الحساب",
      delFail: "تعذّر حذف الحساب", logout: "تسجيل الخروج", err: "حدث خطأ", switchLabel: "English"
    },
    en: {
      title: "My account", intro: "Edit your account details and manage your addresses here", back: "Store", loading: "Loading your account...",
      infoTitle: "Account details", fn: "First name", ln: "Last name", email: "Email", phone: "Phone number", country: "Country",
      save: "Save changes", saving: "Saving...", saved: "Your details were saved", reqName: "Enter your first and last name", phoneBad: "Phone number is not valid",
      addrTitle: "My addresses", addrSub: "Saved addresses for your next orders", addAddr: "+ Add address", edit: "Edit", delAddr: "Delete",
      noAddr: "You have no saved addresses yet", aLabel: "Address name (e.g. Home)", aName: "Recipient name", aPhone: "Mobile number", aCountry: "Country",
      aCity: "City / area", aLine: "Street, building, apartment", aNotes: "Notes (optional)", aSave: "Save address", aCancel: "Cancel",
      aReq: "Enter the address name, city and details", addrSaved: "Address saved", addrDeleted: "Address deleted",
      dangerTitle: "Delete account", dangerText: "Deleting your account is permanent and cannot be undone. Your saved data will be removed too.", delBtn: "Delete my account",
      delTitle: "Do you want to delete your account?", delAsk: "Your account and data will be permanently deleted. Are you sure?", cancel: "Cancel", delConfirm: "Yes, delete account",
      delFail: "Could not delete the account", logout: "Log out", err: "Something went wrong", switchLabel: "العربية"
    }
  };

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let lang = "ar";
  let user = null, profile = {}, addresses = [], editId = null, busy = false;

  const $ = (id) => document.getElementById(id);
  const L = () => T[lang];

  function readState() { try { return JSON.parse(localStorage.getItem("showbiz_state") || "{}"); } catch (e) { return {}; } }
  function writeState(patch) { try { const st = readState(); Object.assign(st, patch); localStorage.setItem("showbiz_state", JSON.stringify(st)); } catch (e) {} }
  { const st = readState(); if (st.lang === "en" || st.lang === "ar") lang = st.lang; }

  function flash(id, type, msg) {
    const n = $(id);
    n.className = "msg " + type;
    n.textContent = msg;
    if (type === "ok") setTimeout(() => { if (n.textContent === msg) n.classList.add("hidden"); }, 3500);
  }
  function hideFlash(id) { $(id).classList.add("hidden"); }

  function countryName(code) {
    const c = COUNTRIES.find(x => x.code === code);
    return c ? c.flag + " " + (lang === "ar" ? c.ar : c.en) : (code || "");
  }
  function fillCountrySelects() {
    ["country", "aCountry"].forEach(id => {
      const s = $(id), cur = s.value;
      s.innerHTML = "";
      COUNTRIES.forEach(c => {
        const o = document.createElement("option");
        o.value = c.code;
        o.textContent = c.flag + " " + (lang === "ar" ? c.ar : c.en);
        s.appendChild(o);
      });
      if (cur) s.value = cur;
    });
  }

  function apply() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.title = "Showbiz " + L().title;
    document.querySelectorAll("[data-k]").forEach(el => { el.textContent = L()[el.dataset.k]; });
    $("langBtn").textContent = L().switchLabel;
    $("saveBtn").textContent = busy ? L().saving : L().save;
    $("saveBtn").disabled = busy;
    $("ver").textContent = "build " + BUILD.version + " · " + BUILD.updated;
    fillCountrySelects();
    renderAddresses();
  }

  function fill() {
    fillCountrySelects();
    $("fn").value = profile.first_name;
    $("ln").value = profile.last_name;
    $("email").value = user.email || "";
    $("phone").value = profile.phone;
    $("country").value = profile.country;
  }

  async function init() {
    let session = null;
    try { const { data } = await sb.auth.getSession(); session = data && data.session; } catch (e) {}
    if (!session) { location.replace("login.html"); return; }
    user = session.user;

    const meta = user.user_metadata || {};
    let row = null;
    try {
      const { data } = await sb.from("customers").select("*").eq("id", user.id).maybeSingle();
      row = data;
    } catch (e) {}

    const st = readState();
    profile = {
      first_name: (row && row.first_name) || meta.first_name || "",
      last_name: (row && row.last_name) || meta.last_name || "",
      phone: (row && row.phone) || "",
      country: meta.preferred_country || st.country || "BH"
    };

    loadAddresses();
    fill();
    $("loading").classList.add("hidden");
    $("page").classList.remove("hidden");
    apply();
  }

  async function saveAccount() {
    if (busy) return;
    hideFlash("infoMsg");
    const fn = $("fn").value.trim(), ln = $("ln").value.trim();
    const phone = $("phone").value.trim(), country = $("country").value;

    $("fn").classList.toggle("bad", !fn);
    $("ln").classList.toggle("bad", !ln);
    if (!fn || !ln) { flash("infoMsg", "err", L().reqName); return; }
    if (phone && !/^\+?[0-9 ]{6,20}$/.test(phone)) { flash("infoMsg", "err", L().phoneBad); return; }

    busy = true; apply();
    try {
      const { error: e1 } = await sb.from("customers").upsert({
        id: user.id, email: user.email, first_name: fn, last_name: ln, phone: phone || null
      });
      if (e1) throw e1;

      const { error: e2 } = await sb.auth.updateUser({
        data: { first_name: fn, last_name: ln, preferred_country: country }
      });
      if (e2) throw e2;

      profile = { first_name: fn, last_name: ln, phone: phone, country: country };
      writeState({ country: country });
      flash("infoMsg", "ok", L().saved);
    } catch (e) {
      flash("infoMsg", "err", L().err + ": " + (e.message || e));
    } finally {
      busy = false; apply();
    }
  }

  function addrKey() { return "showbiz_addr_" + (user ? user.id : "guest"); }
  function loadAddresses() {
    try { addresses = JSON.parse(localStorage.getItem(addrKey()) || "[]"); } catch (e) { addresses = []; }
  }
  function saveAddresses() {
    try { localStorage.setItem(addrKey(), JSON.stringify(addresses)); return true; } catch (e) { return false; }
  }

  function mkBtn(text, fn, danger) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "btn btn-sm " + (danger ? "btn-danger" : "btn-line");
    b.textContent = text;
    b.addEventListener("click", fn);
    return b;
  }

  function renderAddresses() {
    const list = $("addrList");
    list.innerHTML = "";
    if (!addresses.length) {
      const d = document.createElement("div");
      d.className = "empty";
      d.textContent = L().noAddr;
      list.appendChild(d);
      return;
    }
    addresses.forEach(a => {
      const box = document.createElement("div");
      box.className = "addr";

      const h = document.createElement("div");
      h.className = "addr-h";
      const t = document.createElement("div");
      t.className = "addr-t";
      t.textContent = a.label;
      const acts = document.createElement("div");
      acts.className = "addr-a";
      acts.appendChild(mkBtn(L().edit, () => openAddrForm(a.id)));
      acts.appendChild(mkBtn(L().delAddr, () => deleteAddr(a.id), true));
      h.appendChild(t);
      h.appendChild(acts);

      const b = document.createElement("div");
      b.className = "addr-b";
      b.textContent = [a.name, a.phone, countryName(a.country), a.city, a.line, a.notes].filter(Boolean).join(" · ");

      box.appendChild(h);
      box.appendChild(b);
      list.appendChild(box);
    });
  }

  function openAddrForm(id) {
    editId = id || null;
    const a = id ? addresses.find(x => x.id === id) : null;
    $("aLabel").value = a ? a.label : "";
    $("aName").value = a ? a.name : "";
    $("aPhone").value = a ? a.phone : "";
    $("aCountry").value = a ? a.country : (readState().country || "BH");
    $("aCity").value = a ? a.city : "";
    $("aLine").value = a ? a.line : "";
    $("aNotes").value = a ? a.notes : "";
    hideFlash("addrNotice");
    $("addrFormWrap").classList.remove("hidden");
    $("addAddrBtn").classList.add("hidden");
    $("aLabel").focus();
  }
  function closeAddrForm() {
    editId = null;
    $("addrFormWrap").classList.add("hidden");
    $("addAddrBtn").classList.remove("hidden");
  }
  function saveAddr() {
    const a = {
      id: editId || String(Date.now()),
      label: $("aLabel").value.trim(),
      name: $("aName").value.trim(),
      phone: $("aPhone").value.trim(),
      country: $("aCountry").value,
      city: $("aCity").value.trim(),
      line: $("aLine").value.trim(),
      notes: $("aNotes").value.trim()
    };
    if (!a.label || !a.city || !a.line) { flash("addrNotice", "err", L().aReq); return; }
    if (editId) addresses = addresses.map(x => x.id === editId ? a : x);
    else addresses.push(a);
    if (!saveAddresses()) { flash("addrNotice", "err", L().err); return; }
    closeAddrForm();
    renderAddresses();
    flash("addrNotice", "ok", L().addrSaved);
  }
  function deleteAddr(id) {
    addresses = addresses.filter(x => x.id !== id);
    saveAddresses();
    renderAddresses();
    flash("addrNotice", "ok", L().addrDeleted);
  }

  function openDel() { $("delModal").classList.remove("hidden"); }
  function closeDel() { $("delModal").classList.add("hidden"); }
  async function deleteAccount() {
    if (busy) return;
    busy = true;
    $("delYes").disabled = true;
    let err = null;
    try {
      const { error } = await sb.rpc("delete_my_account");
      err = error;
    } catch (e) { err = e; }
    if (err) {
      busy = false;
      $("delYes").disabled = false;
      closeDel();
      flash("infoMsg", "err", L().delFail + ": " + (err.message || err));
      return;
    }
    try { localStorage.removeItem(addrKey()); } catch (e) {}
    try { await sb.auth.signOut(); } catch (e) {}
    location.replace("index.html");
  }

  async function logout() {
    try { await sb.auth.signOut(); } catch (e) {}
    location.replace("index.html");
  }

  $("saveBtn").addEventListener("click", saveAccount);
  $("addAddrBtn").addEventListener("click", () => openAddrForm(null));
  $("aSave").addEventListener("click", saveAddr);
  $("aCancel").addEventListener("click", closeAddrForm);
  $("delBtn").addEventListener("click", openDel);
  $("delNo").addEventListener("click", closeDel);
  $("delYes").addEventListener("click", deleteAccount);
  $("logoutBtn").addEventListener("click", logout);
  $("langBtn").addEventListener("click", () => {
    lang = lang === "ar" ? "en" : "ar";
    writeState({ lang: lang });
    apply();
  });

  apply();
  init();
</script>
</body>
</html>
