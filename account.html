<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Showbiz معلومات الحساب</title>
<style>
  :root { --bg:#0c1628; --card:#14213a; --card2:#1a2b4a; --field:#1d2f50; --line:#2c4168; --fg:#f2f5fa; --muted:#9aa8bf; --orange:#f59e4b; --orange-d:#e0852f; --err:#ff8593; --errbg:rgba(255,133,147,.12); --ok:#5fd39a; --okbg:rgba(95,211,154,.12); color-scheme:dark; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
  .wrap { max-width:560px; margin:0 auto; padding-block:18px 40px; }
  .hdr { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:18px; }
  .brand { font-weight:800; font-size:18px; color:var(--fg); text-decoration:none; }
  .brand b { color:var(--orange); }
  .tools { display:flex; gap:8px; align-items:center; }
  .navwrap { position:relative; }
  .menu { position:absolute; top:calc(100% + 6px); inset-inline-start:0; min-width:220px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:6px; z-index:30; box-shadow:0 12px 30px rgba(0,0,0,.5); }
  .menu a { display:block; padding:10px 12px; border-radius:8px; color:var(--fg); text-decoration:none; font-size:14px; }
  .menu a:hover { background:var(--card2); }
  .menu a.cur { color:var(--orange); font-weight:700; }
  .menu .btn { width:100%; margin-top:4px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 14px; line-height:1.7; }
  .btn { border:0; border-radius:12px; padding:12px 16px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; text-decoration:none; display:inline-block; text-align:center; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn-main { background:var(--orange); color:#111; }
  .btn-main:hover:not(:disabled) { background:var(--orange-d); }
  .btn-line { background:transparent; color:var(--fg); border:1px solid var(--line); }
  .btn-sm { padding:8px 12px; font-size:13px; border-radius:10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px 18px; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .full { grid-column:1 / -1; }
  @media (max-width:480px) { .grid { grid-template-columns:1fr; } }
  label { display:block; font-size:13px; font-weight:600; color:var(--muted); margin:0 0 6px; }
  input, select { width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:12px; background:var(--field); color:var(--fg); font-size:15px; font-family:inherit; }
  input:focus, select:focus { outline:2px solid var(--orange); outline-offset:0; }
  input[readonly] { opacity:.65; cursor:not-allowed; }
  option { background:var(--card); color:var(--fg); }
  .actions { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; justify-content:flex-end; align-items:center; }
  .hint { color:var(--muted); font-size:13px; margin-inline-end:auto; }
  .msg { border-radius:10px; padding:10px 12px; font-size:14px; line-height:1.6; margin-bottom:14px; border:1px solid transparent; }
  .msg.ok { color:var(--ok); background:var(--okbg); border-color:rgba(95,211,154,.35); }
  .msg.err { color:var(--err); background:var(--errbg); border-color:rgba(255,133,147,.35); }
  .phonebox { margin-top:10px; padding:14px; background:var(--card2); border:1px solid var(--line); border-radius:14px; }
  .phrow { display:grid; grid-template-columns:150px 1fr; gap:10px; }
  .ltr { direction:ltr; }
  .ver { text-align:center; color:var(--muted); font-size:12px; margin-top:22px; direction:ltr; }
  .loading { text-align:center; color:var(--muted); padding:60px 0; }
  .hidden { display:none !important; }
</style>
<script src="version.js"></script>
<script src="shared.js"></script>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <a class="brand" href="index.html">Show<b>biz</b></a>
    <div class="tools">
      <button class="btn btn-line btn-sm" id="langBtn" type="button"></button>
      <div class="navwrap">
        <button class="btn btn-line btn-sm" id="menuBtn" type="button" data-icon="menu" aria-label="menu"></button>
        <div class="menu hidden" id="navMenu">
          <a href="index.html" data-k="navStore"></a>
          <a href="account.html" class="cur" data-k="navAccount"></a>
          <a href="orders.html" data-k="navOrders"></a>
          <a href="addresses.html" data-k="navAddr"></a>
          <a href="delete-account.html" data-k="navDel"></a>
          <button class="btn btn-line btn-sm" id="navLogout" type="button" data-k="logout"></button>
        </div>
      </div>
    </div>
  </div>

  <div id="loading" class="loading" data-k="loading"></div>

  <div id="page" class="hidden">
    <h1 data-k="title"></h1>
    <p class="sub" data-k="intro"></p>

    <div class="card">
      <div id="infoMsg" class="msg hidden"></div>
      <div class="grid">
        <div><label for="fn" data-k="fn"></label><input id="fn" autocomplete="given-name"></div>
        <div><label for="ln" data-k="ln"></label><input id="ln" autocomplete="family-name"></div>
        <div class="full"><label for="email" data-k="email"></label><input id="email" dir="ltr" readonly></div>
        <div class="full"><label for="country" data-k="country"></label><select id="country"></select></div>
        <div class="full">
          <label for="phShow" data-k="phone"></label>
          <div style="display:flex;gap:8px;align-items:center;">
            <input id="phShow" dir="ltr" readonly style="flex:1;">
            <button class="btn btn-line btn-sm" id="phChange" type="button" data-k="change"></button>
          </div>
          <div class="phonebox hidden" id="phoneBox">
            <div class="phrow">
              <select id="phCc" class="ltr"></select>
              <input id="phNum" class="ltr" dir="ltr" inputmode="numeric" autocomplete="tel-national">
            </div>
            <div class="actions" style="margin-top:10px;">
              <button class="btn btn-line btn-sm" id="phCancel" type="button" data-k="cancel"></button>
              <button class="btn btn-main btn-sm" id="phSend" type="button" data-k="sendCode"></button>
            </div>
            <div class="hidden" id="phCodeRow" style="margin-top:12px;">
              <label for="phCode" data-k="codeLabel"></label>
              <div style="display:flex;gap:8px;">
                <input id="phCode" class="ltr" dir="ltr" inputmode="numeric" maxlength="6" style="flex:1;letter-spacing:6px;text-align:center;">
                <button class="btn btn-main btn-sm" id="phVerify" type="button" data-k="verify"></button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="actions">
        <span class="hint" id="saveHint"></span>
        <button class="btn btn-main" id="saveBtn" type="button" disabled></button>
      </div>
    </div>
  </div>

  <div class="ver" id="ver"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js" onerror="document.write('<script src=\'https://unpkg.com/@supabase/supabase-js@2.50.0/dist/umd/supabase.js\'><\/script>')"></script>
<script>

  const SUPABASE_URL = "https://fgfteqzwmtxiluqvtrak.supabase.co";
  const SUPABASE_KEY = "sb_publishable_yjE5H3v--wTK29FCi57xSA_TS3NOc5V";

  const COUNTRIES = [
    { code: "BH", flag: "🇧🇭", dial: "+973", len: 8, ar: "البحرين", en: "Bahrain" },
    { code: "SA", flag: "🇸🇦", dial: "+966", len: 9, ar: "السعودية", en: "Saudi Arabia" },
    { code: "AE", flag: "🇦🇪", dial: "+971", len: 9, ar: "الإمارات", en: "UAE" },
    { code: "KW", flag: "🇰🇼", dial: "+965", len: 8, ar: "الكويت", en: "Kuwait" },
    { code: "QA", flag: "🇶🇦", dial: "+974", len: 8, ar: "قطر", en: "Qatar" },
    { code: "OM", flag: "🇴🇲", dial: "+968", len: 8, ar: "عُمان", en: "Oman" }
  ];

  const T = {
    ar: {
      title: "معلومات الحساب", intro: "عدّل بياناتك من هنا. الحفظ يصير فقط إذا تغيّر شي فعلًا.", loading: "جاري تحميل حسابك...",
      fn: "الاسم الأول", ln: "اسم العائلة", email: "البريد الإلكتروني", country: "الدولة", phone: "رقم الهاتف",
      change: "تغيير", cancel: "إلغاء", sendCode: "إرسال رمز التحقق", codeLabel: "رمز التحقق (6 أرقام)", verify: "تأكيد الرمز",
      save: "حفظ التعديلات", saving: "جاري الحفظ...", noChange: "ما فيه تغيير",
      needVerify: "أكّد رقم الهاتف الجديد أولًا بالرمز", reqName: "اكتب الاسم الأول واسم العائلة",
      samePhone: "هذا نفس رقمك الحالي، ما يحتاج تغيير", phLen: "رقم الجوال لازم يكون {n} أرقام",
      codeSent: "أرسلنا رمز التحقق إلى الرقم الجديد", codeBad: "اكتب الرمز المكوّن من 6 أرقام",
      phVerified: "تم التحقق من الرقم. اضغط حفظ التعديلات لتثبيته", saved: "تم حفظ معلوماتك", err: "حدث خطأ",
      navStore: "المتجر", navAccount: "معلومات الحساب", navOrders: "طلباتي", navAddr: "عناويني", navDel: "حذف الحساب", logout: "تسجيل الخروج", switchLabel: "English"
    },
    en: {
      title: "Account details", intro: "Edit your details here. Changes are saved only when something actually changed.", loading: "Loading your account...",
      fn: "First name", ln: "Last name", email: "Email", country: "Country", phone: "Phone number",
      change: "Change", cancel: "Cancel", sendCode: "Send verification code", codeLabel: "Verification code (6 digits)", verify: "Verify code",
      save: "Save changes", saving: "Saving...", noChange: "No changes",
      needVerify: "Verify the new phone number first", reqName: "Enter your first and last name",
      samePhone: "This is already your current number", phLen: "Phone number must be {n} digits",
      codeSent: "We sent a verification code to the new number", codeBad: "Enter the 6-digit code",
      phVerified: "Number verified. Press Save changes to apply it", saved: "Your details were saved", err: "Something went wrong",
      navStore: "Store", navAccount: "Account details", navOrders: "My orders", navAddr: "My addresses", navDel: "Delete account", logout: "Log out", switchLabel: "العربية"
    }
  };


  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = (id) => document.getElementById(id);
  const L = () => T[lang];
  const digits = (s) => String(s || "").replace(/\D/g, "");

  let lang = "ar";
  let user = null, busy = false;
  let base = {};                 // القيم المحفوظة حاليًا
  let pendingPhone = null;       // رقم جديد أُرسل له رمز
  let phoneVerified = null;      // رقم جديد تم التحقق منه ولم يُحفظ بعد

  function readState() { try { return JSON.parse(localStorage.getItem("showbiz_state") || "{}"); } catch (e) { return {}; } }
  function writeState(patch) { try { const st = readState(); Object.assign(st, patch); localStorage.setItem("showbiz_state", JSON.stringify(st)); } catch (e) {} }
  { const st = readState(); if (st.lang === "en" || st.lang === "ar") lang = st.lang; }

  function flash(type, msg) {
    const n = $("infoMsg");
    n.className = "msg " + type;
    n.textContent = msg;
    if (type === "ok") setTimeout(() => { if (n.textContent === msg) n.classList.add("hidden"); }, 3500);
  }
  function hideFlash() { $("infoMsg").classList.add("hidden"); }

  function fillSelects() {
    ["country", "phCc"].forEach(id => {
      const s = $(id), cur = s.value;
      s.innerHTML = "";
      COUNTRIES.forEach(c => {
        const text = id === "country" ? `${c.flag} ${lang === "ar" ? c.ar : c.en}` : `${c.flag} ${c.dial}`;
        s.appendChild(new Option(text, c.code));
      });
      if (cur) s.value = cur;
    });
  }

  function dirty() {
    return $("fn").value.trim() !== base.first_name
      || $("ln").value.trim() !== base.last_name
      || $("country").value !== base.country
      || phoneVerified !== null;
  }

  function updateSave() {
    const d = dirty();
    $("saveBtn").disabled = busy || !d;
    $("saveBtn").textContent = busy ? L().saving : L().save;
    $("saveHint").textContent = (!d && !busy) ? L().noChange : "";
  }

  function apply() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.title = "Showbiz " + L().title;
    document.querySelectorAll("[data-k]").forEach(el => { el.textContent = L()[el.dataset.k]; });
    $("langBtn").textContent = L().switchLabel;
    fillSelects();
    updateSave();
  }

  function resetPhone() {
    pendingPhone = null;
    phoneVerified = null;
    $("phoneBox").classList.add("hidden");
    $("phNum").value = "";
    $("phCode").value = "";
    $("phCodeRow").classList.add("hidden");
    $("phShow").value = base.phone || "";
    updateSave();
  }

  async function sendPhoneCode() {
    hideFlash();
    const c = COUNTRIES.find(x => x.code === $("phCc").value) || COUNTRIES[0];
    const num = digits($("phNum").value);
    if (num.length !== c.len) { flash("err", L().phLen.replace("{n}", c.len)); return; }
    const e164 = c.dial + num;
    if (digits(e164) === digits(base.phone)) { flash("err", L().samePhone); return; }
    $("phSend").disabled = true;
    try {
      const { error } = await sb.auth.updateUser({ phone: e164 });
      if (error) throw error;
      pendingPhone = e164;
      phoneVerified = null;
      $("phCodeRow").classList.remove("hidden");
      flash("ok", L().codeSent);
    } catch (e) {
      flash("err", L().err + ": " + (e.message || e));
    } finally {
      $("phSend").disabled = false;
      updateSave();
    }
  }

  async function verifyPhoneCode() {
    hideFlash();
    const token = digits($("phCode").value);
    if (!pendingPhone || token.length !== 6) { flash("err", L().codeBad); return; }
    $("phVerify").disabled = true;
    try {
      const { error } = await sb.auth.verifyOtp({ phone: pendingPhone, token: token, type: "phone_change" });
      if (error) throw error;
      phoneVerified = pendingPhone;
      pendingPhone = null;
      $("phShow").value = phoneVerified;
      $("phoneBox").classList.add("hidden");
      flash("ok", L().phVerified);
    } catch (e) {
      flash("err", L().err + ": " + (e.message || e));
    } finally {
      $("phVerify").disabled = false;
      updateSave();
    }
  }

  async function saveAccount() {
    if (busy) return;
    hideFlash();
    const fn = $("fn").value.trim(), ln = $("ln").value.trim(), country = $("country").value;
    if (!fn || !ln) { flash("err", L().reqName); return; }
    if (pendingPhone && phoneVerified === null) { flash("err", L().needVerify); return; }
    if (!dirty()) { updateSave(); return; }

    busy = true; updateSave();
    try {
      const row = { id: user.id, email: user.email, first_name: fn, last_name: ln };
      if (phoneVerified) row.phone = phoneVerified;
      const { error: e1 } = await sb.from("customers").upsert(row);
      if (e1) throw e1;

      const { error: e2 } = await sb.auth.updateUser({
        data: { first_name: fn, last_name: ln, preferred_country: country }
      });
      if (e2) throw e2;

      base = {
        first_name: fn, last_name: ln, country: country,
        phone: phoneVerified || base.phone
      };
      phoneVerified = null;
      writeState({ country: country });
      flash("ok", L().saved);
    } catch (e) {
      flash("err", L().err + ": " + (e.message || e));
    } finally {
      busy = false; updateSave();
    }
  }

  async function logout() {
    ShowbizCore.clearLogin();
    try { await sb.auth.signOut(); } catch (e) {}
    location.replace("index.html");
  }

  async function init() {
    const ok = await ShowbizCore.enforceLogin(sb);
    let session = null;
    try { const { data } = await sb.auth.getSession(); session = data && data.session; } catch (e) {}
    if (!ok || !session) { location.replace("login.html"); return; }
    user = session.user;

    const meta = user.user_metadata || {};
    let row = null;
    try {
      const { data } = await sb.from("customers").select("*").eq("id", user.id).maybeSingle();
      row = data;
    } catch (e) {}

    const st = readState();
    const phone = (row && row.phone) || (user.phone ? "+" + digits(user.phone) : "");
    base = {
      first_name: (row && row.first_name) || meta.first_name || "",
      last_name: (row && row.last_name) || meta.last_name || "",
      country: meta.preferred_country || st.country || "BH",
      phone: phone
    };

    fillSelects();
    $("fn").value = base.first_name;
    $("ln").value = base.last_name;
    $("email").value = user.email || "";
    $("country").value = base.country;
    $("phShow").value = base.phone || "";
    $("phCc").value = (COUNTRIES.find(c => base.phone.startsWith(c.dial)) || COUNTRIES[0]).code;

    $("loading").classList.add("hidden");
    $("page").classList.remove("hidden");
    apply();
  }

  // ===== الأحداث =====
  ["fn", "ln"].forEach(id => $(id).addEventListener("input", updateSave));
  $("country").addEventListener("change", updateSave);
  $("saveBtn").addEventListener("click", saveAccount);
  $("phChange").addEventListener("click", () => $("phoneBox").classList.toggle("hidden"));
  $("phCancel").addEventListener("click", resetPhone);
  $("phSend").addEventListener("click", sendPhoneCode);
  $("phVerify").addEventListener("click", verifyPhoneCode);
  $("phNum").addEventListener("input", () => { $("phNum").value = digits($("phNum").value); });
  $("phCode").addEventListener("input", () => { $("phCode").value = digits($("phCode").value).slice(0, 6); });
  $("langBtn").addEventListener("click", () => {
    lang = lang === "ar" ? "en" : "ar";
    writeState({ lang: lang });
    apply();
  });
  $("menuBtn").addEventListener("click", (e) => { e.stopPropagation(); $("navMenu").classList.toggle("hidden"); });
  document.addEventListener("click", (e) => {
    if (!e.target.closest(".navwrap")) $("navMenu").classList.add("hidden");
  });
  $("navLogout").addEventListener("click", logout);

  init();
</script>
<div id="verLine" style="text-align:center;font:12px monospace;color:#6b7a94;padding:10px 12px 18px;direction:ltr"></div>
</body>
</html>
