<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Showbiz الشروط والأحكام</title>
<script src="version.js"></script>
<script src="shared.js"></script>
<style>
  :root { --bg:#0c1628; --card:#14213a; --card2:#1a2b4a; --field:#1d2f50; --line:#2c4168; --fg:#f2f5fa; --muted:#9aa8bf; --orange:#f59e4b; --orange-d:#e0852f; --err:#ff8593; --errbg:rgba(255,133,147,.12); --ok:#5fd39a; --okbg:rgba(95,211,154,.12); color-scheme:dark; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
  .wrap { max-width:560px; margin:0 auto; padding-block:18px 40px; }
  .hdr { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:18px; }
  .brand { font-weight:800; font-size:18px; color:var(--fg); text-decoration:none; }
  .brand b { color:var(--orange); }
  .tools { display:flex; gap:8px; align-items:center; }
  .navwrap { position:relative; }
  .menu { position:absolute; top:calc(100% + 6px); inset-inline-start:0; min-width:220px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:6px; z-index:30; box-shadow:0 12px 30px rgba(0,0,0,.5); }
  .menu a { display:block; padding:10px 12px; border-radius:8px; color:var(--fg); text-decoration:none; font-size:14px; }
  .menu a:hover { background:var(--card2); }
  .menu a.cur { color:var(--orange); font-weight:700; }
  .menu .btn { width:100%; margin-top:4px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 14px; line-height:1.7; }
  .btn { border:0; border-radius:12px; padding:12px 16px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; text-decoration:none; display:inline-block; text-align:center; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn-main { background:var(--orange); color:#111; }
  .btn-main:hover:not(:disabled) { background:var(--orange-d); }
  .btn-line { background:transparent; color:var(--fg); border:1px solid var(--line); }
  .btn-sm { padding:8px 12px; font-size:13px; border-radius:10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px 18px; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .full { grid-column:1 / -1; }
  @media (max-width:480px) { .grid { grid-template-columns:1fr; } }
  label { display:block; font-size:13px; font-weight:600; color:var(--muted); margin:0 0 6px; }
  input, select { width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:12px; background:var(--field); color:var(--fg); font-size:15px; font-family:inherit; }
  input:focus, select:focus { outline:2px solid var(--orange); outline-offset:0; }
  input[readonly] { opacity:.65; cursor:not-allowed; }
  option { background:var(--card); color:var(--fg); }
  .actions { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; justify-content:flex-end; align-items:center; }
  .hint { color:var(--muted); font-size:13px; margin-inline-end:auto; }
  .msg { border-radius:10px; padding:10px 12px; font-size:14px; line-height:1.6; margin-bottom:14px; border:1px solid transparent; }
  .msg.ok { color:var(--ok); background:var(--okbg); border-color:rgba(95,211,154,.35); }
  .msg.err { color:var(--err); background:var(--errbg); border-color:rgba(255,133,147,.35); }
  .phonebox { margin-top:10px; padding:14px; background:var(--card2); border:1px solid var(--line); border-radius:14px; }
  .phrow { display:grid; grid-template-columns:150px 1fr; gap:10px; }
  .ltr { direction:ltr; }
  .ver { text-align:center; color:var(--muted); font-size:12px; margin-top:22px; direction:ltr; }
  .loading { text-align:center; color:var(--muted); padding:60px 0; }
  .hidden { display:none !important; }
</style>
<style>
  .doc { line-height:1.9; font-size:15px; }
  .doc h2 { font-size:17px; margin: 22px 0 6px; }
  .doc p { margin: 0 0 10px; color: var(--muted, #9aa8bf); }
  .draft { border:1px dashed var(--orange, #f59e4b); border-radius:12px; padding:10px 12px; color: var(--orange, #f59e4b); font-size:13px; margin-bottom:16px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <a class="brand" href="index.html">Show<b>biz</b></a>
    <div class="tools"><button class="btn btn-line btn-sm" id="langBtn" type="button"></button></div>
  </div>
  <h1 id="ttl"></h1>
  <div class="doc card" id="body"></div>
  <div class="ver" id="ver"></div>
</div>
<script>
  const TERMS = {
    ar: { title:"الشروط والأحكام", switch:"English", draft:"نص مؤقت. النص الرسمي يُضاف قبل النشر.",
      sections: [
        ["الطلب والدفع", "تُعتبر الطلبات مؤكدة بعد إرسالها من صفحة الدفع. طريقة الدفع المختارة تُحدد طريقة التحصيل."],
        ["التوصيل", "يُحسب الشحن حسب الوزن والحجم والدولة المختارة، ويظهر قبل إرسال الطلب."],
        ["الإرجاع والاستبدال", "تُحدد شروط الإرجاع والاستبدال حسب سياسة المتجر."],
        ["الخصوصية", "نستخدم بياناتك لمعالجة طلباتك والتواصل معك فقط."]
      ] },
    en: { title:"Terms and conditions", switch:"العربية", draft:"Draft text. The official terms will be added before publishing.",
      sections: [
        ["Orders and payment", "Orders are confirmed after they are sent from the checkout page. The chosen payment method sets how payment is collected."],
        ["Delivery", "Shipping is calculated by weight, size and the selected country, and shown before sending the order."],
        ["Returns and exchanges", "Return and exchange conditions follow the store policy."],
        ["Privacy", "We use your data only to process your orders and contact you."]
      ] }
  };
  let state = { lang:"ar" };
  try { Object.assign(state, JSON.parse(localStorage.getItem("showbiz_state") || "{}")); } catch (e) {}
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  function apply() {
    const T = TERMS[state.lang] || TERMS.ar;
    document.documentElement.lang = state.lang;
    document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
    document.title = "Showbiz " + T.title;
    document.getElementById("ttl").textContent = T.title;
    document.getElementById("langBtn").textContent = T.switch;
    document.getElementById("body").innerHTML = `<div class="draft">${esc(T.draft)}</div>` +
      T.sections.map(([h, p]) => `<h2>${esc(h)}</h2><p>${esc(p)}</p>`).join("");
    document.getElementById("ver").textContent = `${state.lang === "ar" ? "النسخة" : "Version"}: ${window.SHOWBIZ_BUILD.version} · ${state.lang === "ar" ? "آخر تحديث" : "Last update"}: ${window.SHOWBIZ_BUILD.updated}`;
  }
  document.getElementById("langBtn").addEventListener("click", () => {
    state.lang = state.lang === "ar" ? "en" : "ar";
    try { const st = JSON.parse(localStorage.getItem("showbiz_state") || "{}"); st.lang = state.lang; localStorage.setItem("showbiz_state", JSON.stringify(st)); } catch (e) {}
    apply();
  });
  apply();
</script>
</body>
</html>
