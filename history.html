<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="claude:viewport-fit-sides" content="cover">
<title>سجل التصفح</title>
<script src="version.js"></script>
<script src="shared.js"></script>
<style>
  :root { --bg:#0c1628; --card:#14213a; --card2:#1a2b4a; --line:#2c4168; --fg:#f2f5fa; --muted:#9aa8bf; --orange:#f59e4b; --orange-d:#e0852f; color-scheme:dark; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg); font-family:'Tajawal',system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif; padding:0 max(16px, env(safe-area-inset-left, 0px)) 110px max(16px, env(safe-area-inset-right, 0px)); }
  h1, h2 { font-family:'Cairo',system-ui,sans-serif; margin:0; }
  .wrap { max-width:480px; margin:0 auto; padding-top:16px; }
  .ttl { margin:18px 0 6px; font-size:22px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 6px; }
  .sec { margin-top:26px; }
  .sec-h { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px; }
  .sec-h h2 { font-size:17px; }
  .grid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; color:var(--fg); text-decoration:none; display:block; min-width:0; }
  .card img { width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:var(--card2); }
  .card .nm { display:block; padding:8px 10px 10px; font-size:13px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .empty { background:var(--card); border:1px dashed var(--line); border-radius:14px; padding:22px 16px; text-align:center; color:var(--muted); font-size:14px; }
  .clear { height:36px; padding:0 14px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--orange); font:inherit; font-size:13px; font-weight:800; cursor:pointer; }
  .clear:disabled { opacity:.4; cursor:default; }
</style>
</head>
<body data-xbar>
<div class="wrap">
  <h1 class="ttl" id="ttl">سجل التصفح</h1>
  <p class="sub" id="sub">آخر منتجات شاهدتها</p>

  <section class="sec">
    <div class="sec-h">
      <h2 id="hProd">آخر منتجات شاهدتها</h2>
    </div>
    <div class="grid" id="pGrid"></div>
  </section>

  <section class="sec">
    <button class="clear" id="clr" type="button">مسح السجل</button>
  </section>
</div>

<script>
(() => {
  const readState = () => { try { return JSON.parse(localStorage.getItem("showbiz_state") || "{}"); } catch (e) { return {}; } };
  const readList = (k) => { try { const v = JSON.parse(localStorage.getItem(k) || "[]"); return Array.isArray(v) ? v : []; } catch (e) { return []; } };
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  const T = {
    ar: { title:"سجل التصفح", sub:"آخر منتجات شاهدتها", prod:"آخر منتجات شاهدتها",
          noP:"ما شفت أي منتج بعد", clear:"مسح السجل", dir:"rtl" },
    en: { title:"Browsing history", sub:"Recently viewed products", prod:"Recently viewed",
          noP:"You haven't viewed any products yet", clear:"Clear history", dir:"ltr" }
  };

  let lang = readState().lang === "en" ? "en" : "ar";
  const tr = () => T[lang];

  function render() {
    const L = tr();
    document.documentElement.lang = lang;
    document.documentElement.dir = L.dir;
    document.title = L.title;
    document.getElementById("ttl").textContent = L.title;
    document.getElementById("sub").textContent = L.sub;
    document.getElementById("hProd").textContent = L.prod;
    document.getElementById("clr").textContent = L.clear;

    const recent = readList("showbiz_recent").filter(r => r && r.p && r.p.pid != null).slice(0, 8);
    const pEl = document.getElementById("pGrid");
    pEl.innerHTML = recent.length
      ? recent.map(r => {
          const p = r.p;
          const name = lang === "en" ? (p.nameEn || p.nameAr) : (p.nameAr || p.nameEn);
          return `<a class="card" href="index.html?open=${encodeURIComponent(p.pid)}"><img src="${esc(p.image || "")}" alt=""><span class="nm">${esc(name || "")}</span></a>`;
        }).join("")
      : `<div class="empty" style="grid-column:1/-1">${L.noP}</div>`;

    document.getElementById("clr").disabled = !recent.length;
  }

  document.getElementById("clr").addEventListener("click", () => {
    try { localStorage.removeItem("showbiz_recent"); } catch (e) {}
    render();
  });

  render();
})();
</script>
</body>
</html>
