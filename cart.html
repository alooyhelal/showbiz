  function save() { try { localStorage.setItem("showbiz_state", JSON.stringify(state)); } catch (e) {} }

  let me = null, profile = null, ready = false, step = "cart", busy = false, doneLocal = false, addrs = [];
  let payMethod = null, termsOk = false, catalogList = [];
  let folds = { cpn: false, note: false };
  let am = null; // حالة نافذة إضافة العنوان

  const t = (k) => T[state.lang][k];
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const digits = (s) => String(s || "").replace(/\D/g, "");
  const flagImg = (code) => (COUNTRIES[code] ? COUNTRIES[code].flag : "");
  const localPrice = (usd) => usd * COUNTRIES[state.country].rate;
  const shipLocal = (bhd) => bhd * (COUNTRIES[state.country].rate / RATE_BHD);
  const pName = (p) => ShowbizUI.pName(p);
  function fmtFor(code, amount) {
    const c = COUNTRIES[code] || COUNTRIES[state.country];
    const n = Number(amount).toFixed(c.dec);
    return state.lang === "ar" ? `${n} ${c.sym.ar}` : `${c.sym.en} ${n}`;
  }
  const fmt = (amount) => fmtFor(state.country, amount);
  const variantLabel = (v) => (state.lang === "ar" && v.keyAr) ? v.keyAr : (v.key ? String(v.key).replace(/-/g, " · ") : t("defaultVariant"));

  // ===== السلة: تفاصيل المنتجات من اللقطة اللي تكتبها الصفحة الرئيسية =====
  function readSnap() { try { return JSON.parse(localStorage.getItem("showbiz_cart_snap") || "[]"); } catch (e) { return []; } }
  function cartLines() {
    const snap = readSnap();
    return state.cart
      .map(i => { const s = snap.find(x => x.vid === i.vid); return s ? { vid: i.vid, qty: i.qty, p: s.p, v: s.v } : null; })
      .filter(Boolean);
  }
  // المنتجات غير المحددة تبقى في السلة لكن ما تدخل في الحساب والطلب
  const isSelected = (l) => !(state.unsel || []).includes(l.vid);
  const selLines = () => cartLines().filter(isSelected);
  const subtotalUSD = () => selLines().reduce((s, l) => s + l.v.price * l.qty, 0);
  const discountUSD = () => subtotalUSD() * (COUPONS[state.coupon] || 0);

  function shippingCalc() {
    let actualKg = 0, volKg = 0;
    selLines().forEach(l => {
      const w = (l.v.weightG || l.p.weightG || 500) / 1000;
      const d = l.v.dimsCm || l.p.dimsCm || [10, 10, 10];
      actualKg += w * l.qty;
      volKg += (d[0] * d[1] * d[2] / 5000) * l.qty;
    });
    const chargeable = Math.max(actualKg, volKg);
    const orderBHD = (subtotalUSD() - discountUSD()) * RATE_BHD;
    // التوصيل مجاني عند بلوغ حد الدولة (في ui.js)
    const shipBHD = ShowbizUI.isFree() ? 0
      : COUNTRIES[state.country].base + Math.max(0, chargeable - 1) * 0.5;
    const riskBHD = Math.max(orderBHD * 0.15, 0.3);
    return { shipBHD, riskBHD };
  }

  // ===== العناوين =====
  const selectedAddr = () => addrs.find(a => a.id === state.addrId) || null;
  function addrText(a) {
    const names = (a.path || []).map(id => {
      const n = typeof findNode === "function" ? findNode(id) : null;
      return n ? (state.lang === "en" && n.en ? n.en : n.ar) : id;
    }).join(" ← ");
    const f = a.fields || {};
    const parts = [names];
    if (f.building) parts.push(f.building);
    if (f.street) parts.push(f.street);
    if (f.complex) parts.push(f.complex);
    if (f.flat) parts.push(f.flat);
    if (f.makani) parts.push("Makani " + f.makani);
    if (f.pobox) parts.push("PO " + f.pobox);
    if (f.district) parts.push(f.district);
    if (f.postal) parts.push(f.postal);
    return parts.join(" · ");
  }

  // ===== تغيير السلة =====
  function changeQty(vid, delta) {
    const i = state.cart.find(x => x.vid === vid);
    if (!i) return;
    i.qty = Math.min(99, i.qty + delta);
    if (i.qty <= 0) state.cart = state.cart.filter(x => x.vid !== vid);
    save(); render();
  }
  function removeLine(vid) { state.cart = state.cart.filter(x => x.vid !== vid); save(); render(); }
  function applyCoupon() {
    const code = (($("cpn") || {}).value || "").trim().toUpperCase();
    if (COUPONS[code]) { state.coupon = code; save(); render(); }
    else if ($("cpnMsg")) $("cpnMsg").textContent = t("badCoupon");
  }

  // الدخول مطلوب قبل خطوة العنوان. بعد الدخول يرجعنا هنا مباشرة على خطوة العنوان
  function goLogin() {
    try { localStorage.setItem("showbiz_next", "cart"); } catch (e) {}
    location.href = "login.html";
  }

  // ===== نافذة إضافة العنوان (داخل الصفحة، فقط حقول الدولة المختارة) =====
  function amFieldsKey() { return FIELDS[am.country] ? am.country : "BH"; }
  function amTxt(n) { return state.lang === "en" && n.en ? n.en : n.ar; }
  function amCountries() {
    const s = $("amCountry");
    s.innerHTML = "";
    getCountries().forEach(c => s.appendChild(new Option(c.flag + " " + (state.lang === "en" ? c.en : c.ar), c.code)));
    s.value = am.country;
  }
  function amPhoneCodes() {
    const s = $("amCc");
    s.innerHTML = "";
    PHONE_CODES.forEach(p => s.appendChild(new Option(p.flag + " " + p.dial, p.dial)));
    const c = getCountry(am.country);
    s.value = c && PHONE_CODES.some(p => p.dial === c.dial) ? c.dial : "+973";
  }
  function amRenderChain() {
    const box = $("amChain");
    box.innerHTML = "";
    let items = getTopLevel(am.country);
    for (let depth = 0; items.length; depth++) {
      const wrap = document.createElement("div");
      wrap.className = "full";
      const lab = document.createElement("label");
      lab.className = "req";
      const tl = TYPE_LABEL[items[0].type] || TYPE_LABEL.area;
      lab.textContent = state.lang === "en" ? tl[1] : tl[0];
      const sel = document.createElement("select");
      sel.appendChild(new Option(t("choose"), ""));
      items.forEach(n => sel.appendChild(new Option(amTxt(n), n.id)));
      sel.value = am.chosen[depth] || "";
      const d = depth;
      sel.addEventListener("change", () => {
        am.chosen = am.chosen.slice(0, d);
        am.chosen[d] = sel.value;
        amRenderChain();
      });
      wrap.append(lab, sel);
      box.appendChild(wrap);
      const picked = items.find(n => n.id === am.chosen[depth]);
      if (!picked) break;
      items = getChildren(picked);
    }
  }
  function amChainResult() {
    const path = [];
    let items = getTopLevel(am.country);
    let node = null;
    for (let d = 0; items.length; d++) {
      node = items.find(n => n.id === am.chosen[d]) || null;
      if (!node) return { ok: false, path: [] };
      path.push(node.id);
      items = getChildren(node);
    }
    return { ok: !!node, path: path };
  }
  function amRenderFields() {
    const box = $("amFields");
    box.innerHTML = "";
    (FIELDS[amFieldsKey()] || []).forEach(f => {
      const d = document.createElement("div");
      const lab = document.createElement("label");
      lab.htmlFor = "amf_" + f.k;
      if (f.req) lab.className = "req";
      lab.textContent = state.lang === "en" ? f.en : f.ar;
      const inp = document.createElement("input");
      inp.id = "amf_" + f.k;
      inp.value = am.vals[f.k] || "";
      if (f.digits) { inp.className = "ltr"; inp.dir = "ltr"; inp.inputMode = "numeric"; }
      d.append(lab, inp);
      box.appendChild(d);
    });
  }
  function amBuild() {
    $("amTitle").textContent = t("addAddr");
    $("amBody").innerHTML = `
      <div id="amMsg" class="errmsg"></div>
      <div class="grid2">
        <div class="full"><label for="amLabel" class="req">${t("addrName")}</label><input id="amLabel" maxlength="40"></div>
        <div class="full"><label for="amCountry" class="req">${t("country")}</label><select id="amCountry"></select></div>
      </div>
      <div id="amChain" class="grid2"></div>
      <div id="amFields" class="grid2"></div>
      <div class="grid2">
        <div><label for="amCc" class="req">${t("phoneCode")}</label><select id="amCc" class="ltr"></select></div>
        <div><label for="amNum" class="req">${t("phone")}</label><input id="amNum" class="ltr" dir="ltr" inputmode="numeric"></div>
        <div class="full"><label for="amRecip">${t("recipient")}</label><input id="amRecip" maxlength="60"></div>
      </div>
      <div class="btnrow"><button class="ghostbtn" type="button" data-a="closeAddr">${t("cancel")}</button><button class="primary" type="button" data-a="saveAddr">${t("saveAddr")}</button></div>`;
    $("amCountry").addEventListener("change", () => {
      am.country = $("amCountry").value; am.chosen = []; am.vals = {};
      amPhoneCodes(); amRenderChain(); amRenderFields();
    });
    $("amNum").addEventListener("input", () => { $("amNum").value = digits($("amNum").value); });
    amCountries(); amPhoneCodes(); amRenderChain(); amRenderFields();
  }
  function openAddrModal() {
    if (!me) { goLogin(); return; }
    am = { country: state.country, chosen: [], vals: {} };
    amBuild();
    $("addrModal").classList.remove("hidden");
    document.body.classList.add("modal-open");
  }
  function closeAddrModal() {
    $("addrModal").classList.add("hidden");
    document.body.classList.remove("modal-open");
    am = null;
  }
  function amErr(msg) { $("amMsg").textContent = msg; }
  async function saveAddr() {
    amErr("");
    const label = $("amLabel").value.trim();
    if (!label) return amErr(t("errLabel"));
    const r = amChainResult();
    if (!r.ok) return amErr(t("errArea"));
    const fields = {};
    for (const f of (FIELDS[amFieldsKey()] || [])) {
      let v = ($("amf_" + f.k).value || "").trim();
      if (f.digits) v = digits(v);
      if (f.req && !v) return amErr(t("errField") + (state.lang === "en" ? f.en : f.ar));
      fields[f.k] = v;
    }
    const pc = PHONE_CODES.find(p => p.dial === $("amCc").value) || PHONE_CODES[0];
    const num = digits($("amNum").value);
    if (num.length !== pc.len) return amErr(t("errPhone").replace("{n}", pc.len));
    const entry = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      label: label, country: am.country, path: r.path, fields: fields,
      phone: pc.dial + num, recipient: $("amRecip").value.trim()
    };
    try { await ShowbizCore.upsertAddress(sb, me.id, entry); }
    catch (e) { return amErr(t("storeErr")); }
    addrs = await ShowbizCore.fetchAddresses(sb, me.id);
    state.addrId = entry.id; state.country = entry.country; save();
    closeAddrModal();
    render();
  }

  // ===== الطلب =====
  async function sendOrder() {
    if (busy) return;
    const addr = selectedAddr();
    if (!addr) { setStep("address"); return; }
    if (!payMethod) { $("payMsg").textContent = t("needPay"); return; }
    if (!termsOk) { $("payMsg").textContent = t("needTerms"); return; }
    busy = true;
    const btn = $("sendBtn");
    if (btn) { btn.disabled = true; btn.textContent = t("sending"); }
    const lines = selLines();
    if (!lines.length) { busy = false; setStep("cart"); return; }
    const s = shippingCalc();
    const subtotal = localPrice(subtotalUSD());
    const discount = localPrice(discountUSD());
    const ship = shipLocal(s.shipBHD);
    const row = {
      user_id: me.id, country: state.country, status: "test-not-sent-to-cj",
      items: lines.map(l => ({ pid: l.p.pid, vid: l.vid, sku: l.v.sku, name: l.p.nameEn, variant: l.v.key, qty: l.qty, unitUSD: l.v.price })),
      shipping_address: {
        id: addr.id, label: addr.label, text: addrText(addr), fields: addr.fields || {},
        phone: addr.phone, recipient: addr.recipient || "", path: addr.path || [], country: addr.country
      },
      contact: {
        name: `${profile?.first_name || ""} ${profile?.last_name || ""}`.trim(),
        phone: profile?.phone || null,
        payment: { method: payMethod },
        note: state.note || ""
      },
      coupon: state.coupon, subtotal, discount, shipping: ship,
      total: subtotal - discount + ship, internal_risk_bhd: s.riskBHD
    };
    let saved = false;
    try {
      const { error } = await sb.from("orders").insert(row);
      if (!error) saved = true; else console.warn(error);
    } catch (e) { console.warn(e); }
    if (!saved) {
      try {
        const arr = JSON.parse(localStorage.getItem("showbiz_orders") || "[]");
        arr.push({ ...row, created: new Date().toISOString() });
        localStorage.setItem("showbiz_orders", JSON.stringify(arr));
      } catch (e) {}
    }
    doneLocal = !saved;
    // نحذف المنتجات اللي انطلبت بس، وغير المحددة تبقى في السلة
    const doneVids = lines.map(l => l.vid);
    state.cart = state.cart.filter(i => !doneVids.includes(i.vid));
    state.addrId = null; state.coupon = null; state.note = ""; save();
    busy = false; payMethod = null; termsOk = false;
    setStep("done");
  }

  // ===== الخطوات =====
  function setStep(s) {
    if (s === "address" && !me) { goLogin(); return; }
    step = s;
    const h = s === "cart" ? "" : "#" + s;
    history.replaceState(null, "", location.pathname + h);
    render();
    window.scrollTo(0, 0);
  }
  function stepsHTML() {
    if (step === "done") return "";
    const order = ["cart", "address", "payment"];
    const idx = order.indexOf(step);
    const labels = [t("s1"), t("s2"), t("s3")];
    return `<div class="steps">${labels.map((label, i) => {
      const cls = i === idx ? "on" : i < idx ? "done" : "later";
      return `<div class="step ${cls}"><span class="sn">${i < idx ? "✓" : i + 1}</span><span class="sl">${esc(label)}</span></div>`;
    }).join("")}</div>`;
  }

  function summaryRows(withShip) {
    const sub = localPrice(subtotalUSD());
    const disc = localPrice(discountUSD());
    const free = ShowbizUI.isFree();
    let rows = `<div class="row"><span>${t("productsVal")}</span><span>${fmt(sub)}</span></div>`;
    if (disc > 0) rows += `<div class="row"><span>${t("discount")}</span><span>- ${fmt(disc)}</span></div>`;
    let total = sub - disc;
    if (free) {
      rows += `<div class="row ok"><span>${t("shipping")}</span><span>${t("freeMsg")}</span></div>`;
    } else if (withShip) {
      const ship = shipLocal(shippingCalc().shipBHD);
      rows += `<div class="row"><span>${t("shipping")}</span><span>${fmt(ship)}</span></div>`;
      total += ship;
    } else {
      rows += `<div class="row"><span>${t("shipping")}</span><span class="muted">${t("shipLater")}</span></div>`;
    }
    rows += `<div class="row grand"><span>${t("grand")}</span><span>${fmt(total)}</span></div>`;
    return `<div class="totals">${rows}</div>`;
  }

  const catalogPool = () => catalogList.filter(e => !state.cart.some(i => i.vid === e.vid));

  function lineHTML(l) {
    const on = isSelected(l);
    const wished = ShowbizUI.wishedPids().includes(String(l.p.pid));
    return `
      <div class="line ${on ? "" : "off"}">
        <input type="checkbox" data-ui="sel" data-vid="${esc(l.vid)}" ${on ? "checked" : ""} aria-label="${esc(pName(l.p))}">
        <img src="${esc(l.v.image || l.p.image)}" alt="">
        <div class="info">
          <div class="name">${esc(pName(l.p))}</div>
          ${l.v.key ? `<div class="var">${esc(variantLabel(l.v))}</div>` : ""}
          <div class="unit">${fmt(localPrice(l.v.price))}</div>
          <div class="days">${ShowbizUI.cfg.days[state.lang] || ""}</div>
          <div class="qty">
            <button data-a="dec" data-vid="${esc(l.vid)}" aria-label="−">−</button>
            <span>${l.qty}</span>
            <button data-a="inc" data-vid="${esc(l.vid)}" aria-label="+">+</button>
          </div>
        </div>
        <div class="acts">
          <button class="heart ${wished ? "on" : ""}" data-ui="wish" data-pid="${esc(l.p.pid)}" aria-label="wish">${ShowbizCore.icon("heart")}</button>
          <button data-a="rm" data-vid="${esc(l.vid)}" aria-label="remove">${ShowbizCore.icon("trash")}</button>
        </div>
      </div>`;
  }

  function emptyHTML(msg) {
    return `<div class="panel empty"><div class="big">🛒</div><p>${msg}</p>
      <a class="ghostbtn" href="index.html">${t("goStore")}</a></div>`;
  }

  function cartHTML() {
    const lines = cartLines();
    if (!lines.length) {
      if (state.cart.length) return stepsHTML() + emptyHTML(t("snapMissing"));
      return stepsHTML() + emptyHTML(`${t("cartEmpty")}<br><span style="font-size:13px">${t("emptyHint")}</span>`)
        + ShowbizUI.suggestRow(catalogPool().slice(0, 12));
    }
    const selCount = lines.filter(isSelected).length;
    const allOn = selCount === lines.length;
    const cpnBox = state.coupon
      ? `<div class="cbox on"><span>${esc(state.coupon)}</span><button class="linkbtn" data-a="removeCoupon">${t("removeCoupon")}</button></div>`
      : `<div class="cbox"><button class="cfold" data-a="foldCpn"><span>% ${t("coupon")}</span><span>${folds.cpn ? "▴" : "▾"}</span></button>` +
        (folds.cpn ? `<div class="couponrow"><input id="cpn" placeholder="${esc(t("coupon"))}"><button class="ghostbtn" data-a="applyCoupon">${t("apply")}</button></div><p id="cpnMsg" class="errmsg"></p>` : "") + `</div>`;
    const noteBox = `<div class="cbox"><button class="cfold" data-a="foldNote"><span>${t("note")}</span><span>${folds.note ? "▴" : "▾"}</span></button>` +
      (folds.note ? `<div class="notebox"><textarea id="noteTa" placeholder="${esc(t("notePh"))}">${esc(state.note || "")}</textarea></div>` : "") + `</div>`;
    const grandNow = localPrice(subtotalUSD() - discountUSD());
    const free = ShowbizUI.isFree();
    return stepsHTML() + `
      ${ShowbizUI.progressHTML()}
      <div class="panel">
        <label class="selall"><input type="checkbox" data-ui="selAll" ${allOn ? "checked" : ""}> ${t("selAll")} (${lines.length})</label>
        <p class="selhint">${t("selHint")}</p>
        ${lines.map(lineHTML).join("")}
      </div>
      <div class="panel">
        ${noteBox}
        ${cpnBox}
        ${summaryRows(false)}
        ${free ? "" : `<p class="shipnote">${t("shipInfo")}</p>`}
      </div>
      ${ShowbizUI.suggestRow(catalogPool().slice(0, 12))}
      <div class="stickyfoot">
        <div class="tot"><span class="muted">${t("grand")}</span><strong>${fmt(grandNow)}</strong></div>
        <button class="primary" data-a="toAddr" ${selCount ? "" : "disabled"}>${t("toAddr")}</button>
      </div>
      <p class="manage"><a href="index.html">${t("keep")}</a></p>`;
  }

  function addressHTML() {
    if (!ready) return stepsHTML() + `<div aria-hidden="true"><div class="sk-b sk-line" style="width:45%;margin-top:4px"></div><div class="sk-panel"><div class="sk-b sk-row" style="height:96px"></div><div class="sk-b sk-row" style="height:96px"></div></div><div class="sk-panel"><div class="sk-b sk-line"></div><div class="sk-b sk-input"></div><div class="sk-b sk-input"></div></div></div>`;
    if (!selLines().length) return cartHTML();
    if (!me) return stepsHTML() + `<div class="panel empty"><p>${t("needLogin")}</p>
      <button class="primary" data-a="login">${t("goLogin")}</button></div>`;

    const sel = selectedAddr();
    const pref = addrs.filter(a => a.country === state.country);
    const other = addrs.filter(a => a.country !== state.country);
    const card = (a, isPref) => `
      <label class="acard ${state.addrId === a.id ? "on" : ""}">
        <input type="radio" name="addr" data-pick="${esc(a.id)}" ${state.addrId === a.id ? "checked" : ""}>
        <div class="ac-body">
          <div class="ac-top"><span class="flag">${flagImg(a.country)}</span><span>${esc(a.label)}</span>${isPref ? `<span class="tag">${t("addrSelected")}</span>` : ""}</div>
          <div class="ac-txt">${esc(addrText(a))}</div>
          <div class="ac-txt ltr">${esc(a.phone || "")}</div>
        </div>
      </label>`;
    let list = "";
    if (!addrs.length) list = `<p class="muted">${t("noAddr")}</p>`;
    else {
      if (pref.length) list += pref.map(a => card(a, true)).join("");
      if (other.length) {
        list += `<div class="muted" style="margin:12px 0 8px">${t("addrOther")}</div>`;
        list += other.map(a => card(a, false)).join("");
      }
    }
    return stepsHTML() + `
      <div class="panel">
        <div class="sect-title req">${t("addrTitle")}</div>
        ${list}
        <button class="ghostbtn addnew" data-a="addAddr">${t("addAddr")}</button>
        <p class="manage"><a href="addresses.html">${t("manageAddr")}</a></p>
      </div>
      <div class="panel">${summaryRows(!!sel)}</div>
      <div class="btnrow">
        <button class="ghostbtn" data-a="backCart">${t("back2")}</button>
        <button class="primary" data-a="toPay" ${sel ? "" : "disabled"}>${t("toPay")}</button>
      </div>
      ${sel ? "" : `<p class="errmsg" style="margin-top:8px">${t("pickAddrErr")}</p>`}`;
  }

  function payHTML() {
    if (!me || !selectedAddr()) return addressHTML();
    const methods = [
      { k: "apple_pay", label: t("pay_apple") },
      { k: "cash", label: t("pay_cash") },
      { k: "benefit", label: t("pay_benefit") },
      { k: "card", label: t("pay_card") }
    ];
    const opts = methods.map(m => `
      <label class="pay ${payMethod === m.k ? "on" : ""}"><input type="radio" name="pay" data-paym="${m.k}" ${payMethod === m.k ? "checked" : ""}>${esc(m.label)}</label>`).join("");
    const sel = selectedAddr();
    return stepsHTML() + `
      <div class="panel">
        <div class="sect-title">${t("addrTitle")}</div>
        <div class="paddr">
          <div class="pa-txt">
            <div class="ac-top">${esc(sel.label)}</div>
            <div class="ac-txt">${esc(addrText(sel))}</div>
            <div class="ac-txt ltr">${esc(sel.phone || "")}</div>
          </div>
          <div class="pa-side">
            <span class="pa-flag">${flagImg(sel.country)}</span>
            <button class="ghostbtn" data-a="backAddr">${t("back2")}</button>
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="sect-title">${t("payTitle")}</div>
        ${opts}
        <label class="terms"><input type="checkbox" id="termsCb" ${termsOk ? "checked" : ""}>
          <span>${t("termsA")} <a href="terms.html" target="_blank" rel="noopener">${t("termsLink")}</a></span></label>
        ${summaryRows(true)}
        <p id="payMsg" class="errmsg"></p>
        <button class="primary" id="sendBtn" data-a="send" style="width:100%;margin-top:6px">${t("send")}</button>
      </div>`;
  }

  // تأكيد الطلب: دائرة ترسم نفسها، وعلامة صح، وكونفيتي يطلع مرة وحدة (مثل Lottie بدون تكرار)
  function doneHTML() {
    const bits = Array.from({ length: 14 }, (_, i) => `<i class="cf" style="--a:${i * 25.7}deg;--d:${(i % 3) * 6 + 40}px;--cl:${["#f59e4b","#5b9cff","#7ee2a8","#ff6b8a","#ffd166"][i % 5]}"></i>`).join("");
    return `<div class="panel done"><div class="okanim" aria-hidden="true"><svg viewBox="0 0 120 120"><circle class="ok-ring" cx="60" cy="60" r="52" pathLength="1"/><path class="ok-tick" d="M34 62 L52 80 L87 44" pathLength="1"/></svg>${bits}</div><h2>${t("doneTitle")}</h2><p class="muted">${t("doneMsg")}</p>
      ${doneLocal ? `<p class="muted">${t("savedLocal")}</p>` : ""}
      <div class="btnrow" style="margin-top:14px"><a class="ghostbtn" href="orders.html">${t("myOrders")}</a><a class="primary" href="index.html" style="text-align:center;text-decoration:none;display:block;padding:13px">${t("home")}</a></div></div>`;
  }

  function render() {
    document.documentElement.lang = state.lang;
    document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
    document.getElementById("backBtn").setAttribute("aria-label", t("back2"));
    const v = $("view");
    if (step === "done") v.innerHTML = doneHTML();
    else if (step === "address") v.innerHTML = addressHTML();
    else if (step === "payment") v.innerHTML = payHTML();
    else v.innerHTML = cartHTML();
    $("verLine").textContent = `${t("buildLabel")}: ${window.SHOWBIZ_BUILD.version} · ${t("updatedLabel")}: ${window.SHOWBIZ_BUILD.updated}`;
    ShowbizUI.syncFree();
  }

  // ===== الأحداث =====
  document.addEventListener("click", (e) => {
    if (e.target.closest("#backBtn")) {
      if (step === "payment") setStep("address");
      else if (step === "address") setStep("cart");
      else location.href = "index.html";
      return;
    }
    const el = e.target.closest("[data-a]");
    if (!el) return;
    const a = el.dataset.a;
    if (a === "inc") { changeQty(el.dataset.vid, 1); return; }
    if (a === "dec") { changeQty(el.dataset.vid, -1); return; }
    if (a === "rm") { const vidRm = el.dataset.vid; ShowbizCore.confirmDel("product", function () { removeLine(vidRm); }); return; }
    if (a === "applyCoupon") { applyCoupon(); return; }
    if (a === "removeCoupon") { state.coupon = null; save(); render(); return; }
    if (a === "toAddr") { setStep("address"); return; }
    if (a === "login") { goLogin(); return; }
    if (a === "addAddr") { openAddrModal(); return; }
    if (a === "closeAddr") { closeAddrModal(); return; }
    if (a === "saveAddr") { saveAddr(); return; }
    if (a === "backCart") { setStep("cart"); return; }
    if (a === "toPay") { if (selectedAddr()) setStep("payment"); return; }
    if (a === "backAddr") { setStep("address"); return; }
    if (a === "send") { sendOrder(); return; }
    if (a === "foldCpn") { folds.cpn = !folds.cpn; render(); return; }
    if (a === "foldNote") { folds.note = !folds.note; render(); return; }
  });
  document.getElementById("addrModal").addEventListener("click", (e) => {
    if (e.target.id === "addrModal") closeAddrModal();
  });
  $("amX") && $("amX").addEventListener("click", closeAddrModal);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && am) closeAddrModal(); });

  // الملاحظة تُحفظ أثناء الكتابة بدون إعادة رسم (عشان ما يطيح التركيز)
  document.addEventListener("input", (e) => {
    if (e.target.id === "noteTa") { state.note = e.target.value; save(); }
  });
  // أي تغيير من السلة الجانبية أو من الصفحة يعيد رسم السلة
  document.addEventListener("cartchange", () => { if (step === "cart" || step === "address") render(); });

  document.addEventListener("change", (e) => {
    const tgt = e.target;
    if (tgt.dataset && tgt.dataset.pick) {
      const a = addrs.find(x => x.id === tgt.dataset.pick);
      if (!a) return;
      state.addrId = a.id; state.country = a.country; save(); render();
      return;
    }
    if (tgt.dataset && tgt.dataset.paym) { payMethod = tgt.dataset.paym; render(); return; }
    if (tgt.id === "termsCb") { termsOk = tgt.checked; const m = $("payMsg"); if (m) m.textContent = ""; }
  });

  // الضغط على عنوان محدد مرة ثانية يلغي تحديده
  document.addEventListener("click", (e) => {
    const tgt = e.target;
    if (tgt.dataset && tgt.dataset.pick && state.addrId === tgt.dataset.pick) {
      e.preventDefault();
      state.addrId = null; save(); render();
    }
  });

  window.addEventListener("hashchange", () => {
    if (step === "done") return;
    const h = location.hash.replace("#", "");
    if (h === "address" || h === "payment") {
      if (h === "address" && !me && ready) { goLogin(); return; }
      step = h; render();
    } else { step = "cart"; render(); }
  });

  // ===== البدء =====
  (async () => {
    try { localStorage.removeItem("showbiz_next"); } catch (e) {}
    const hashStep = location.hash.replace("#", "");
    if (hashStep === "address" || hashStep === "payment") step = hashStep;
    render();
    const ok = await ShowbizCore.enforceLogin(sb);
    if (ok) {
      try {
        const r = await sb.auth.getSession();
        me = (r.data && r.data.session && r.data.session.user) || userFromStoredToken();
      } catch (e) { me = userFromStoredToken(); }
    }
    if (me) {
      try { const r = await sb.from("customers").select("*").eq("id", me.id).maybeSingle(); profile = r.data || null; } catch (e) {}
      addrs = await ShowbizCore.fetchAddresses(sb, me.id);
    }
    try {
      const pick = localStorage.getItem("showbiz_pick_addr");
      if (pick) {
        localStorage.removeItem("showbiz_pick_addr");
        if (addrs.find(x => x.id === pick)) { state.addrId = pick; save(); }
      }
    } catch (e) {}
    if (!me && step === "address") { goLogin(); return; }
    ready = true;
    render();
    // منتجات قد تعجبك من الكتالوج الوهمي (مرحلة التجربة: بدون جلب من الـ API)
    ShowbizUI.catalogDemo().then(list => { catalogList = list; render(); });
  })();

  function userFromStoredToken() {
    try {
      const key = Object.keys(localStorage).find(k => k.startsWith("sb-") && k.endsWith("-auth-token"));
      const o = key ? JSON.parse(localStorage.getItem(key)) : null;
      return (o && o.user && o.user.id) ? o.user : null;
    } catch (e) { return null; }
  }
</script>
</body>
</html>
