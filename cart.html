<style>

  main { padding:16px 16px 56px; max-width:1000px; margin:auto; }
  select, input { padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card2); color:var(--fg); width:100%; box-sizing:border-box; margin-bottom:8px; font-size:15px; font-family:inherit; }
  select option { background:var(--card2); color:var(--fg); }
  input:focus, select:focus { outline:2px solid var(--orange); outline-offset:1px; }
  header select { width:auto; margin:0; }
  button { padding:10px 14px; border:0; border-radius:10px; background:var(--orange); color:#111; cursor:pointer; font-size:14px; font-family:inherit; font-weight:700; }

    const RATE_BHD = 0.377;

  const COUNTRIES = {
    BH: { flag:"🇧🇭", dial:"+973", name:{ar:"البحرين", en:"Bahrain"}, sym:{ar:"د.ب", en:"BD"}, dec:3, rate:0.377, base:2.2 },

    KW: { flag:"🇰🇼", dial:"+965", name:{ar:"الكويت", en:"Kuwait"}, sym:{ar:"د.ك", en:"KD"}, dec:3, rate:0.307, base:3.3 },

  };

  const T = {
    ar: {
      goLogin:"تسجيل الدخول", back:"الموقع", cart:"السلة", cartTitle:"سلة المشتريات", empty:"سلتك فارغة حالياً",

      termsA:"أوافق على", termsLink:"الشروط والأحكام", send:"إرسال الطلب", sending:"جاري الإرسال...",

      doneTitle:"تم استلام طلبك", doneMsg:"شكراً لك. تقدر تتابع حالة طلبك من صفحة طلباتي.",
      myOrders:"طلباتي", home:"الصفحة الرئيسية", savedLocal:"تم حفظ الطلب على هذا الجهاز مؤقتاً لأن الحفظ على السيرفر تعذر.",
      snapMissing:"افتح الصفحة الرئيسية مرة وحدة عشان تتحدث السلة", pickAddrErr:"اختر عنوان أولاً",
      loading:"جاري التحميل...", needLogin:"سجّل دخولك عشان تكمل الطلب",
      defaultVariant:"افتراضي", buildLabel:"النسخة", updatedLabel:"آخر تحديث", qty:"الكمية",
      saveErr:"تعذر إرسال الطلب، حاول مرة ثانية"
    },
    en: {
      goLogin:"Sign in", back:"Store", cart:"Cart", cartTitle:"Shopping cart", empty:"Your cart is empty",
      emptyHint:"Add products from the store and come back here", goStore:"Browse products",
      s1:"Cart", s2:"Address", s3:"Payment",
      productsVal:"Products", discount:"Discount", shipping:"Shipping", shipLater:"Calculated after choosing an address",
      grand:"Total", coupon:"Coupon code", apply:"Apply", removeCoupon:"Remove", badCoupon:"Invalid code",
      toAddr:"Continue to address", toPay:"Continue to payment", keep:"Keep shopping", back2:"Back",
      addrTitle:"Delivery address", addrSelected:"Address in selected country", addrOther:"Other countries",
      noAddr:"You have no saved addresses yet", addAddr:"Add new address", manageAddr:"Manage addresses",
      payTitle:"Payment method", pay_apple:"Apple Pay", pay_cash:"Cash on delivery", pay_benefit:"Benefit",
      pay_card:"Credit card", pay_soon:"Soon",
      termsA:"I agree to the", termsLink:"Terms and conditions", send:"Send order", sending:"Sending...",
      needTerms:"Accept the terms to continue", needPay:"Choose a payment method",
      doneTitle:"Order received", doneMsg:"Thank you. You can follow your order from My orders.",
      myOrders:"My orders", home:"Home page", savedLocal:"The order was saved on this device for now because the server could not be reached.",
      snapMissing:"Open the home page once so the cart can refresh", pickAddrErr:"Choose an address first",
      loading:"Loading...", needLogin:"Sign in to complete your order",
      defaultVariant:"Default", buildLabel:"Version", updatedLabel:"Last update", qty:"Quantity",
      saveErr:"Could not send the order, please try again"
    }
  };

  // ===== الحالة (نفس المفاتيح اللي تستخدمها الصفحة الرئيسية) =====
  let state = { country:"BH", lang:"ar", cart:[], addrId:null, coupon:null };
  try { Object.assign(state, JSON.parse(localStorage.getItem("showbiz_state") || "{}")); } catch (e) {}
  if (!Array.isArray(state.cart)) state.cart = [];
  if (!COUNTRIES[state.country]) state.country = "BH";
  function save() { try { localStorage.setItem("showbiz_state", JSON.stringify(state)); } catch (e) {} }

  let me = null, profile = null, ready = false, step = "cart", busy = false, doneLocal = false, addrs = [];
  let payMethod = null, termsOk = false;

  const t = (k) => T[state.lang][k];
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const flagImg = (code) => (COUNTRIES[code] ? COUNTRIES[code].flag : "");
  const localPrice = (usd) => usd * COUNTRIES[state.country].rate;
  const shipLocal = (bhd) => bhd * (COUNTRIES[state.country].rate / RATE_BHD);
  function fmtFor(code, amount) {
    const c = COUNTRIES[code] || COUNTRIES[state.country];
    const n = Number(amount).toFixed(c.dec);
    return state.lang === "ar" ? `${n} ${c.sym.ar}` : `${c.sym.en} ${n}`;
  }
  const fmt = (amount) => fmtFor(state.country, amount);
  const variantLabel = (v) => v.key ? String(v.key).replace(/-/g, " · ") : t("defaultVariant");

  // ===== السلة: تفاصيل المنتجات من اللقطة اللي تكتبها الصفحة الرئيسية =====
  function readSnap() { try { return JSON.parse(localStorage.getItem("showbiz_cart_snap") || "[]"); } catch (e) { return []; } }
  function cartLines() {
    const snap = readSnap();
    return state.cart
      .map(i => { const s = snap.find(x => x.vid === i.vid); return s ? { vid: i.vid, qty: i.qty, p: s.p, v: s.v } : null; })
      .filter(Boolean);
  }
  const subtotalUSD = () => cartLines().reduce((s, l) => s + l.v.price * l.qty, 0);
  const discountUSD = () => subtotalUSD() * (COUPONS[state.coupon] || 0);

  function shippingCalc() {
    let actualKg = 0, volKg = 0;
    cartLines().forEach(l => {
      const w = (l.v.weightG || l.p.weightG || 500) / 1000;
      const d = l.v.dimsCm || l.p.dimsCm || [10, 10, 10];
      actualKg += w * l.qty;
      volKg += (d[0] * d[1] * d[2] / 5000) * l.qty;
    });
    const chargeable = Math.max(actualKg, volKg);
    const shipBHD = COUNTRIES[state.country].base + Math.max(0, chargeable - 1) * 0.5;
    const orderBHD = (subtotalUSD() - discountUSD()) * RATE_BHD;
    const riskBHD = Math.max(orderBHD * 0.15, 0.3);
    return { shipBHD, riskBHD };
  }

  // ===== العناوين =====
  const selectedAddr = () => addrs.find(a => a.id === state.addrId) || null;
  function addrText(a) {
    const names = (a.path || []).map(id => {
      const n = typeof findNode === "function" ? findNode(id) : null;
      return n ? (state.lang === "en" && n.en ? n.en : n.ar) : id;
    }).join(" ← ");
    const f = a.fields || {};
    const parts = [names];
    if (f.building) parts.push(f.building);
    if (f.street) parts.push(f.street);
    if (f.complex) parts.push(f.complex);
    if (f.flat) parts.push(f.flat);
    if (f.makani) parts.push("Makani " + f.makani);
    if (f.pobox) parts.push("PO " + f.pobox);
    return parts.join(" · ");
  }

  // ===== تغيير السلة =====
  function changeQty(vid, delta) {
    const i = state.cart.find(x => x.vid === vid);
    if (!i) return;
    i.qty = Math.min(99, i.qty + delta);
    if (i.qty <= 0) state.cart = state.cart.filter(x => x.vid !== vid);
    save(); render();
  }
  function removeLine(vid) { state.cart = state.cart.filter(x => x.vid !== vid); save(); render(); }
  function applyCoupon() {
    const code = (document.getElementById("cpn").value || "").trim().toUpperCase();
    if (COUPONS[code]) { state.coupon = code; save(); render(); }
    else document.getElementById("cpnMsg").textContent = t("badCoupon");
  }

  // الدخول مطلوب قبل خطوة العنوان. بعد الدخول يرجعنا هنا مباشرة على خطوة العنوان
  function goLogin() {
    try { localStorage.setItem("showbiz_next", "cart"); } catch (e) {}
    location.href = "login.html";
  }
  function goAddAddr() {
    try {
      localStorage.setItem("showbiz_next", "cart");
      localStorage.setItem("showbiz_open_add", "1");
    } catch (e) {}
    location.href = "addresses.html";
  }

  // ===== الطلب =====
  async function sendOrder() {
    if (busy) return;
    const addr = selectedAddr();
    if (!addr) { setStep("address"); return; }
    if (!payMethod) { document.getElementById("payMsg").textContent = t("needPay"); return; }
    if (!termsOk) { document.getElementById("payMsg").textContent = t("needTerms"); return; }
    busy = true;
    const btn = document.getElementById("sendBtn");
    if (btn) { btn.disabled = true; btn.textContent = t("sending"); }
    const lines = cartLines();
    const s = shippingCalc();
    const subtotal = localPrice(subtotalUSD());
    const discount = localPrice(discountUSD());
    const ship = shipLocal(s.shipBHD);
    const row = {
      user_id: me.id, country: state.country, status: "test-not-sent-to-cj",
      items: lines.map(l => ({ pid: l.p.pid, vid: l.vid, sku: l.v.sku, name: l.p.nameEn, variant: l.v.key, qty: l.qty, unitUSD: l.v.price })),
      shipping_address: {
        id: addr.id, label: addr.label, text: addrText(addr), fields: addr.fields || {},
        phone: addr.phone, recipient: addr.recipient || "", path: addr.path || [], country: addr.country
      },
      contact: {
        name: `${profile?.first_name || ""} ${profile?.last_name || ""}`.trim(),
        phone: profile?.phone || null,
        payment: { method: payMethod }
      },
      coupon: state.coupon, subtotal, discount, shipping: ship,
      total: subtotal - discount + ship, internal_risk_bhd: s.riskBHD
    };
    let saved = false;
    try {
      const { error } = await sb.from("orders").insert(row);
      if (!error) saved = true; else console.warn(error);
    } catch (e) { console.warn(e); }
    if (!saved) {
      try {
        const arr = JSON.parse(localStorage.getItem("showbiz_orders") || "[]");
        arr.push({ ...row, created: new Date().toISOString() });
        localStorage.setItem("showbiz_orders", JSON.stringify(arr));
      } catch (e) {}
    }
    doneLocal = !saved;
    state.cart = []; state.addrId = null; state.coupon = null; save();
    busy = false; payMethod = null; termsOk = false;
    setStep("done");
  }

  // ===== الخطوات =====
  function setStep(s) {
    if (s === "address" && !me) { goLogin(); return; }
    step = s;
    const h = s === "cart" ? "" : "#" + s;
    history.replaceState(null, "", location.pathname + h);
    render();
    window.scrollTo(0, 0);
  }

  function stepsHTML() {
    if (step === "done") return "";
    const order = ["cart", "address", "payment"];
    const idx = order.indexOf(step);
    return `<div class="steps">${[["cart", t("s1")], ["address", t("s2")], ["payment", t("s3")]]
      .map(([k, label], i) => `<span class="${i === idx ? "on" : i < idx ? "done" : ""}">${label}</span>`).join("")}</div>`;
  }

  function emptyHTML(msg) {
    return `<div class="panel empty"><div class="big">🛒</div><p>${msg}</p>
      <a class="ghostbtn" href="index.html">${t("goStore")}</a></div>`;
  }

  function summaryRows(withShip) {
    const sub = localPrice(subtotalUSD());
    const disc = localPrice(discountUSD());
    let rows = `<div class="row"><span>${t("productsVal")}</span><span>${fmt(sub)}</span></div>`;
    if (disc > 0) rows += `<div class="row"><span>${t("discount")}</span><span>- ${fmt(disc)}</span></div>`;
    if (withShip) {
      const ship = shipLocal(shippingCalc().shipBHD);
      rows += `<div class="row"><span>${t("shipping")}</span><span>${fmt(ship)}</span></div>`;
      rows += `<div class="row grand"><span>${t("grand")}</span><span>${fmt(sub - disc + ship)}</span></div>`;
    } else {
      rows += `<div class="row"><span>${t("shipping")}</span><span class="muted">${t("shipLater")}</span></div>`;
      rows += `<div class="row grand"><span>${t("grand")}</span><span>${fmt(sub - disc)}</span></div>`;
    }
    return `<div class="totals">${rows}</div>`;
  }

  function cartHTML() {
    const lines = cartLines();
    if (!lines.length) {
      if (state.cart.length) return stepsHTML() + emptyHTML(t("snapMissing"));
      return stepsHTML() + emptyHTML(`${t("empty")}<br><span style="font-size:13px">${t("emptyHint")}</span>`);
    }
    const rows = lines.map(l => `
      <div class="line">
        <img src="${esc(l.v.image || l.p.image)}" alt="">
        <div class="info">
          <div class="name">${esc(l.p.nameEn)}</div>
          ${l.v.key ? `<div class="var">${esc(variantLabel(l.v))}</div>` : ""}
          <div class="unit">${fmt(localPrice(l.v.price))}</div>
          <div class="qty">
            <button data-a="dec" data-vid="${esc(l.vid)}" aria-label="−">−</button>
            <span>${l.qty}</span>
            <button data-a="inc" data-vid="${esc(l.vid)}" aria-label="+">+</button>
          </div>
        </div>
        <button class="rm" data-a="rm" data-vid="${esc(l.vid)}" aria-label="remove">✕</button>
      </div>`).join("");
    const couponLine = state.coupon
      ? `<div class="row" style="display:flex;justify-content:space-between;align-items:center;font-size:14px"><span class="muted">${esc(state.coupon)}</span><button class="rm" style="font-size:13px" data-a="removeCoupon">${t("removeCoupon")}</button></div>`
      : `<div class="couponrow"><input id="cpn" placeholder="${t("coupon")}"><button class="ghostbtn" data-a="applyCoupon">${t("apply")}</button></div><p id="cpnMsg" class="errmsg"></p>`;
    return stepsHTML() + `
      <div class="panel">${rows}</div>
      <div class="panel">${couponLine}${summaryRows(false)}</div>
      <div class="btnrow">
        <a class="ghostbtn" href="index.html">${t("keep")}</a>
        <button class="primary" data-a="toAddr">${t("toAddr")}</button>
      </div>`;
  }

  function addressHTML() {
    if (!ready) return stepsHTML() + `<p class="muted">${t("loading")}</p>`;
    if (!cartLines().length) return cartHTML();
    if (!me) return stepsHTML() + `<div class="panel empty"><p>${t("needLogin")}</p>
      <button class="primary" data-a="login">${t("goLogin")}</button></div>`;

    const sel = selectedAddr();
    const pref = addrs.filter(a => a.country === state.country);
    const other = addrs.filter(a => a.country !== state.country);
    const card = (a, isPref) => `
      <label class="addr ${isPref ? "pref" : ""}">
        <input type="radio" name="addr" data-pick="${esc(a.id)}" ${state.addrId === a.id ? "checked" : ""}>
        <div style="flex:1;min-width:0">
          <div class="lbl">${flagImg(a.country)} ${esc(a.label)} ${isPref ? `<span class="tag">${t("addrSelected")}</span>` : ""}</div>
          <div class="txt">${esc(addrText(a))}</div>
          <div class="txt" dir="ltr">${esc(a.phone || "")}</div>
        </div>
      </label>`;
    let list = "";
    if (!addrs.length) list = `<p class="muted">${t("noAddr")}</p>`;
    else {
      if (pref.length) list += pref.map(a => card(a, true)).join("");
      if (other.length) {
        list += `<div class="sect-title" style="font-size:13px;color:var(--muted,#9aa8bf);margin:14px 0 8px">${t("addrOther")}</div>`;
        list += other.map(a => card(a, false)).join("");
      }
    }
    return stepsHTML() + `
      <div class="panel">
        <div class="sect-title" style="margin-top:0">${t("addrTitle")}</div>
        ${list}
        <button class="ghostbtn" style="width:100%" data-a="addAddr">${t("addAddr")}</button>
        <p class="manage"><a href="addresses.html">${t("manageAddr")}</a></p>
      </div>
      <div class="panel">${summaryRows(!!sel)}</div>
      <div class="btnrow">
        <button class="ghostbtn" data-a="backCart">${t("back2")}</button>
        <button class="primary" data-a="toPay" ${sel ? "" : "disabled"}>${t("toPay")}</button>
      </div>
      ${sel ? "" : `<p class="errmsg" style="margin-top:8px">${t("pickAddrErr")}</p>`}`;
  }

  function payHTML() {
    if (!me || !selectedAddr()) return addressHTML();
    const methods = [
      { k: "apple_pay", label: t("pay_apple"), on: true },
      { k: "cash", label: t("pay_cash"), on: true },
      { k: "benefit", label: t("pay_benefit"), on: true },
      { k: "card", label: t("pay_card"), on: true }
    ];
    const opts = methods.map(m => `
      <label class="pay"><input type="radio" name="pay" data-paym="${m.k}" ${payMethod === m.k ? "checked" : ""}>${esc(m.label)}</label>`).join("");
    const sel = selectedAddr();
    return stepsHTML() + `
      <div class="panel">
        <div class="sect-title" style="margin-top:0">${t("addrTitle")}</div>
        <div class="addr" style="cursor:default"><div style="flex:1"><div class="lbl">${flagImg(sel.country)} ${esc(sel.label)}</div>
          <div class="txt">${esc(addrText(sel))}</div></div></div>
        <button class="ghostbtn" style="margin-top:6px" data-a="backAddr">${t("back2")}</button>
      </div>
      <div class="panel">
        <div class="sect-title" style="margin-top:0">${t("payTitle")}</div>
        ${opts}
        <label class="terms"><input type="checkbox" id="termsCb" ${termsOk ? "checked" : ""}>
          <span>${t("termsA")} <a href="terms.html" target="_blank" rel="noopener">${t("termsLink")}</a></span></label>
        <div class="totals">${summaryRows(true)}</div>
        <p id="payMsg" class="errmsg"></p>
        <button class="primary" id="sendBtn" data-a="send" style="width:100%">${t("send")}</button>
      </div>`;
  }

  function doneHTML() {
    return `<div class="panel done"><div class="big">✅</div><h2>${t("doneTitle")}</h2><p>${t("doneMsg")}</p>
      ${doneLocal ? `<p class="muted">${t("savedLocal")}</p>` : ""}
      <div class="btnrow" style="margin-top:14px"><a class="ghostbtn" href="orders.html">${t("myOrders")}</a><a class="primary" href="index.html" style="text-align:center;text-decoration:none;display:block;padding:14px">${t("home")}</a></div></div>`;
  }

  function render() {
    document.documentElement.lang = state.lang;
    document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
    document.getElementById("backTxt").textContent = t("back");
    const n = state.cart.reduce((s, i) => s + i.qty, 0);
    document.getElementById("cartCount").textContent = `${t("cart")} (${n})`;
    const v = document.getElementById("view");
    if (step === "done") v.innerHTML = doneHTML();
    else if (step === "address") v.innerHTML = addressHTML();
    else if (step === "payment") v.innerHTML = payHTML();
    else v.innerHTML = cartHTML();
    document.getElementById("verLine").textContent = `${t("buildLabel")}: ${window.SHOWBIZ_BUILD.version} · ${t("updatedLabel")}: ${window.SHOWBIZ_BUILD.updated}`;
  }

  // ===== الأحداث =====
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-a]");
    if (!el) return;
    const a = el.dataset.a;
    if (a === "inc") { changeQty(el.dataset.vid, 1); return; }
    if (a === "dec") { changeQty(el.dataset.vid, -1); return; }
    if (a === "rm") { removeLine(el.dataset.vid); return; }
    if (a === "applyCoupon") { applyCoupon(); return; }
    if (a === "removeCoupon") { state.coupon = null; save(); render(); return; }
    if (a === "toAddr") { setStep("address"); return; }
    if (a === "login") { goLogin(); return; }
    if (a === "addAddr") { goAddAddr(); return; }
    if (a === "backCart") { setStep("cart"); return; }
    if (a === "toPay") { if (selectedAddr()) setStep("payment"); return; }
    if (a === "backAddr") { setStep("address"); return; }
    if (a === "send") { sendOrder(); return; }
  });

  document.addEventListener("change", (e) => {
    const tgt = e.target;
    if (tgt.dataset && tgt.dataset.pick) {
      const a = addrs.find(x => x.id === tgt.dataset.pick);
      if (!a) return;
      state.addrId = a.id; save(); render();
      return;
    }
    if (tgt.dataset && tgt.dataset.paym) { payMethod = tgt.dataset.paym; document.getElementById("payMsg").textContent = ""; return; }
    if (tgt.id === "termsCb") { termsOk = tgt.checked; document.getElementById("payMsg").textContent = ""; }
  });

  window.addEventListener("hashchange", () => {
    if (step === "done") return;
    const h = location.hash.replace("#", "");
    if (h === "address" || h === "payment") {
      if (h === "address" && !me && ready) { goLogin(); return; }
      step = h; render();
    } else { step = "cart"; render(); }
  });

  // ===== البدء =====
  (async () => {
    try { localStorage.removeItem("showbiz_next"); } catch (e) {}
    const hashStep = location.hash.replace("#", "");
    if (hashStep === "address" || hashStep === "payment") step = hashStep;
    render();
    const ok = await ShowbizCore.enforceLogin(sb);
    if (ok) {
      try {
        const r = await sb.auth.getSession();
        me = (r.data && r.data.session && r.data.session.user) || userFromStoredToken();
      } catch (e) { me = userFromStoredToken(); }
    }
    if (me) {
      try { const r = await sb.from("customers").select("*").eq("id", me.id).maybeSingle(); profile = r.data || null; } catch (e) {}
      addrs = await ShowbizCore.fetchAddresses(sb, me.id);
    }
    try {
      const pick = localStorage.getItem("showbiz_pick_addr");
      if (pick) {
        localStorage.removeItem("showbiz_pick_addr");
        if (addrs.find(x => x.id === pick)) { state.addrId = pick; save(); }
      }
    } catch (e) {}
    if (!me && step === "address") { goLogin(); return; }
    ready = true;
    render();
  })();

  function userFromStoredToken() {
    try {
      const key = Object.keys(localStorage).find(k => k.startsWith("sb-") && k.endsWith("-auth-token"));
      const o = key ? JSON.parse(localStorage.getItem(key)) : null;
      return (o && o.user && o.user.id) ? o.user : null;
    } catch (e) { return null; }
  }
</script>
</body>
</html>
