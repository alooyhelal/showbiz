<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Showbiz</title>
<style>
  :root { --bg:#0b1220; --fg:#eef2f7; --card:#162033; --card2:#1d2a44; --line:#26334d; --muted:#9aa7bd; --blue:#5b9cff; --btn:#4a8fe0; --orange:#f59e4b; --dot:#3a4a68; --ok:#7ee2a8; --err:#ffb4bf; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; padding:12px 16px; background:#0d1728; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  main { padding:16px 16px 56px; max-width:1000px; margin:auto; }
  select, input { padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card2); color:var(--fg); width:100%; box-sizing:border-box; margin-bottom:8px; font-size:15px; }
  input:focus, select:focus { outline:2px solid var(--blue); outline-offset:1px; }
  header select { width:auto; margin:0; }
  button { padding:10px 14px; border:0; border-radius:10px; background:var(--btn); color:#fff; cursor:pointer; font-size:14px; }
  button.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); }
  button.btn-orange { background:var(--orange); color:#111; font-weight:bold; padding:12px 14px; }
  button.linkbtn { background:none; color:var(--orange); padding:4px 6px; text-decoration:underline; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .btnfull { width:100%; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  .pad { padding:14px; margin-bottom:12px; }
  .pimg { height:210px; background:#f3f4f6; display:flex; align-items:center; justify-content:center; }
  .pimg img { width:100%; height:100%; object-fit:contain; transition:opacity .4s; }
  .pbody { padding:12px 14px 14px; }
  .pname { font-size:15px; line-height:1.5; margin-bottom:6px; }
  .price { color:var(--blue); font-weight:bold; font-size:17px; }
  .row2 { display:flex; gap:8px; margin-top:10px; }
  .row2 button { flex:1; }
  .dots { display:flex; gap:6px; justify-content:center; padding:8px 0 0; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--dot); display:inline-block; }
  .dot.on { background:var(--blue); }
  .muted { color:var(--muted); font-size:13px; line-height:1.7; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 0; flex-wrap:wrap; }
  .row.total { border-top:1px solid var(--line); margin-top:6px; padding-top:12px; font-size:17px; }
  .okrow { display:flex; justify-content:space-between; align-items:center; gap:8px; color:var(--ok); padding:6px 0; }
  h4 { margin:14px 0 8px; color:var(--muted); font-size:14px; font-weight:600; }
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; padding:12px; overflow:auto; z-index:20; }
  .modal { background:var(--card); color:var(--fg); padding:18px; border-radius:18px; width:100%; max-width:440px; box-sizing:border-box; position:relative; }
  .gallery { position:relative; height:300px; background:#f3f4f6; border-radius:12px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .gallery img { width:100%; height:100%; object-fit:contain; transition:opacity .4s; }
  .nav { position:absolute; top:50%; transform:translateY(-50%); background:rgba(0,0,0,.45); color:#fff; padding:6px 12px; }
  .nav.prev { left:8px; } .nav.next { right:8px; }
  .xbtn { position:absolute; top:10px; left:10px; background:rgba(0,0,0,.55); color:#fff; padding:4px 10px; z-index:2; }
  .qtyrow { display:flex; justify-content:space-between; align-items:center; margin:12px 0; }
  .qtyctl button { padding:6px 12px; }
  .crow { display:flex; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .crow img { width:72px; height:72px; object-fit:contain; background:#f3f4f6; border-radius:10px; }
  .cinfo { flex:1; }
  .couponrow { display:flex; gap:8px; } .couponrow input { margin:0; } .couponrow button { white-space:nowrap; }
  .narrow { max-width:480px; margin:0 auto; }
  .hidden { display:none !important; }

  /* ===== صفحات الدخول والتسجيل ===== */
  .auth { padding:20px; }
  .auth h2 { margin:0 0 4px; font-size:22px; }
  .auth .sub { color:var(--muted); font-size:14px; margin:0 0 16px; }
  .field label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  .step { border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; background:var(--card2); }
  .step.done { border-color:#2f6b4f; }
  .step.locked { opacity:.55; }
  .stephead { display:flex; align-items:center; gap:10px; font-weight:600; margin-bottom:10px; }
  .badge { width:26px; height:26px; border-radius:50%; background:var(--btn); display:inline-flex; align-items:center; justify-content:center; font-size:13px; flex:0 0 auto; }
  .step.done .badge { background:#2f8f5f; }
  .phone-row { display:flex; gap:8px; }
  .phone-row select { width:130px; flex:0 0 auto; margin:0; }
  .phone-row input { margin:0; flex:1; }
  .otp-row { display:flex; gap:8px; justify-content:center; margin:10px 0 14px; direction:ltr; }
  .obox { width:46px; height:56px; text-align:center; font-size:24px; font-weight:bold; margin:0; padding:0; }
  .linkrow { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:10px; }
  .msg { padding:10px 12px; border-radius:10px; font-size:14px; margin-top:12px; line-height:1.7; }
  .msg.err { background:#3b1620; color:var(--err); border:1px solid #7a2b3b; }
  .msg.ok { background:#12301f; color:var(--ok); border:1px solid #2f6b4f; }
  .msg.info { background:var(--card2); color:var(--fg); border:1px solid var(--line); }

  .build { position:fixed; bottom:0; left:0; right:0; background:#070d18; color:#6b7a94; font:12px monospace; text-align:center; padding:6px; direction:ltr; z-index:4; border-top:1px solid var(--line); }
  #debug { position:fixed; bottom:30px; left:0; right:0; background:#000; color:#0f0; font:12px monospace; padding:8px; direction:ltr; white-space:pre-wrap; max-height:40vh; overflow:auto; z-index:30; }
</style>
</head>

  function stripHTML(html) {
    if (!html) return "";
    const doc = new DOMParser().parseFromString(String(html), "text/html");
    return (doc.body.textContent || "").replace(/\s+/g, " ").trim();
  }
  function findVariant(vid) {
    for (const p of products) {
      const v = p.variants.find(x => x.vid === vid);
      if (v) return { p, v };
    }
    return null;
  }
  function cartLines() {
    return state.cart
      .map(i => { const f = findVariant(i.vid); return f ? { vid: i.vid, qty: i.qty, p: f.p, v: f.v } : null; })
      .filter(Boolean);
  }
  const cartCount = () => state.cart.reduce((s, i) => s + i.qty, 0);
  const subtotalUSD = () => cartLines().reduce((s, l) => s + l.v.price * l.qty, 0);
  const discountUSD = () => subtotalUSD() * (COUPONS[state.coupon] || 0);

  // ===== الحاسبة =====
  function shippingCalc() {
    let actualKg = 0, volKg = 0;
    cartLines().forEach(l => {
      const w = (l.v.weightG || l.p.weightG || 500) / 1000;
      const d = l.v.dimsCm || l.p.dimsCm || [10, 10, 10];
      actualKg += w * l.qty;
      volKg += (d[0] * d[1] * d[2] / 5000) * l.qty;
    });
    const chargeable = Math.max(actualKg, volKg);
    const shipBHD = COUNTRIES[state.country].base + Math.max(0, chargeable - 1) * 0.5;
    const orderBHD = (subtotalUSD() - discountUSD()) * RATE_BHD;
    const riskBHD = Math.max(orderBHD * 0.15, 0.3);
    return { actualKg, volKg, chargeable, shipBHD, riskBHD };
  }
  const shipLocal = (bhd) => bhd * (rate() / RATE_BHD);

  // ===== تحميل المنتجات من الوسيط =====
  async function loadProducts() {
    loadError = false;
    try {
      const res = await fetch(WORKER_URL + "?action=list");
      const d = await res.json();
      if (!Array.isArray(d.products)) throw new Error("bad");
      products = d.products.map(p => {
        let variants = (p.variants || []).filter(v => v.price != null);
        if (!variants.length) {
          const base = parseFloat(String(p.sellPrice || "").split("-")[0]);
          if (!isNaN(base)) variants = [{ vid: "base-" + p.pid, key: "", sku: p.sku, price: base, image: p.image, weightG: p.weightG, dimsCm: p.dimsCm }];
        }
        const images = (p.images && p.images.length) ? p.images : [p.image].filter(Boolean);
        return { ...p, images, variants };
      }).filter(p => p.variants.length > 0);
    } catch (e) {
      loadError = true;
      products = [];
    }
    loaded = true;
    render();
  }

  // رسالة الخطأ: الحقيقية من Supabase مع الكود والحالة، عدا الحالات المعروفة
  function errMsg(e) {
    const L = T[state.lang];
    const m = String(e?.message || e || "");
    if (/timeout/i.test(m)) return L.timeout;
    if (/invalid login/i.test(m)) return L.loginFail;
    if (/rate|too many|seconds/i.test(m)) return L.rateLimit;
    const extra = [e?.code, e?.status].filter(Boolean).join(" · ");
    return extra ? `${m} (${extra})` : m;
  }
  // خطأ الرمز: منتهي أو غلط
  function codeErr(e) {
    const L = T[state.lang];
    return /expired/i.test(String(e?.message || e || "")) ? L.codeExpired : L.codeWrong;
  }

  // ===== خانات الرمز (6 خانات) =====
  function otpBoxes(prefix) {
    const boxes = [0, 1, 2, 3, 4, 5].map(i =>
      `<input class="obox" data-otp="${prefix}" data-i="${i}" inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="${i + 1}">`
    ).join("");
    return `<div class="otp-row">${boxes}</div>`;
  }
  function readOtp(prefix) {
    return [...document.querySelectorAll(`[data-otp="${prefix}"]`)].map(x => x.value).join("");
  }
  function clearOtp(prefix) {
    document.querySelectorAll(`[data-otp="${prefix}"]`).forEach(x => { x.value = ""; });
  }
  function focusOtp(prefix, i) {
    setTimeout(() => {
      const el = document.querySelector(`[data-otp="${prefix}"][data-i="${i}"]`);
      if (el) { el.focus(); el.select(); }
    }, 0);
  }
  // يتحقق تلقائيًا لما تكتمل الخانات الستة
  function maybeVerify(prefix) {
    if (busy) return;
    if (readOtp(prefix).length !== 6) return;
    if (prefix === "email") verifyEmail(); else verifySms();
  }

  // ===== العدّاد لإعادة الإرسال =====
  const coolLeft = (k) => Math.max(0, cool[k] - Date.now());
  const startCool = (k) => { cool[k] = Date.now() + RESEND_MS; };
  function fmtLeft(ms) {
    const s = Math.ceil(ms / 1000);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  }
  function updateCooldowns() {
    const L = T[state.lang];
    [["email", "resendEmail"], ["sms", "resendSms"]].forEach(([k, id]) => {
      const b = document.getElementById(id);
      if (!b) return;
      const ms = coolLeft(k);
      b.disabled = ms > 0;
      b.textContent = ms > 0 ? `${L.resendIn} ${fmtLeft(ms)}` : L.resendCode;
    });
  }
  setInterval(updateCooldowns, 1000);

  async function doLogin() {
    if (busy) return;
    const L = T[state.lang];
    const email = loginEmail.trim();
    const pass = document.getElementById("lPass")?.value || "";
    if (!isEmail(email)) return setNotice(L.emailBad, "err");
    if (!pass) return setNotice(L.fillAll, "err");

    try {
      const { error } = await withTimeout(sb.auth.signInWithPassword({ email, password: pass }), VERIFY_TIMEOUT_MS);

      setNotice(isTimeout(e) ? L.verifyTimeout : errMsg(e), "err");

  // ===== صفحة إنشاء الحساب (خطوات في صفحة واحدة) =====

    const L = T[state.lang];
    const emailOK = pending.emailVerified;
    const phoneOK = REQUIRE_PHONE && pending.phoneVerified && !pending.editPhone;
    const detailsOpen = emailOK && (!REQUIRE_PHONE || phoneOK);
    const phoneDone = !REQUIRE_PHONE || phoneOK;

    // الخطوة 1: البريد
    let b1;
    if (emailOK) {
      b1 = `<div class="okrow"><span>✅ <span dir="ltr">${esc(pending.email)}</span></span>
              <button class="linkbtn" data-action="changeEmail">${L.change}</button></div>`;
    } else if (!pending.codeSent) {
      b1 = `<div class="field">
              <input id="sEmail" type="email" dir="ltr" placeholder="name@example.com" value="${esc(pending.email)}">
            </div>
            <button class="btn-orange btnfull" data-action="sendCode">${L.sendCode}</button>`;
    } else {
      b1 = `<p class="muted">${L.codeSentTo} <span dir="ltr">${esc(pending.email)}</span></p>
            ${otpBoxes("email")}
            <div class="linkrow">
              <button class="linkbtn" id="resendEmail" data-action="sendCode">${L.resendCode}</button>
              <button class="linkbtn" data-action="changeEmail">${L.change}</button>
            </div>`;
    }

    // الخطوة 2: الجوال
    let b2;
    if (!emailOK) {
      b2 = `<p class="muted">${L.lockedStep}</p>`;
    } else if (!REQUIRE_PHONE) {
      b2 = `<p class="muted">${L.skipPhone}</p>`;
    } else if (phoneOK) {
      b2 = `<div class="okrow"><span>✅ <span dir="ltr">${esc(pending.full)}</span></span>
              <button class="linkbtn" data-action="changePhone">${L.change}</button></div>`;
    } else if (!pending.otpSent) {
      const opts = Object.values(COUNTRIES).map(c =>
        `<option value="${c.dial}" ${pending.dial === c.dial ? "selected" : ""}>${c.flag} ${c.dial}</option>`
      ).join("");
      b2 = `<div class="phone-row">
              <select id="sDial">${opts}</select>
              <input id="sPhone" type="tel" dir="ltr" placeholder="36123456" value="${esc(pending.phone)}">
            </div>
            <button class="btn-orange btnfull" style="margin-top:10px" data-action="sendSms">${L.sendSms}</button>`;
    } else {
      b2 = `<p class="muted">${L.codeSentTo} <span dir="ltr">${esc(pending.full)}</span></p>
            ${otpBoxes("sms")}
            <div class="linkrow">
              <button class="linkbtn" id="resendSms" data-action="sendSms">${L.resendCode}</button>
              <button class="linkbtn" data-action="changePhone">${L.change}</button>
            </div>`;

    // الخطوة 3: بيانات الحساب
    const b3 = detailsOpen
      ? `<div class="field"><label>${L.firstName}</label><input id="sFirst" value="${esc(pending.first)}"></div>
         <div class="field"><label>${L.lastName}</label><input id="sLast" value="${esc(pending.last)}"></div>
         <div class="field"><label>${L.password}</label><input id="sPass" type="password" dir="ltr"></div>
         <div class="field"><label>${L.confirmPass}</label><input id="sPass2" type="password" dir="ltr"></div>
         <button class="btn-orange btnfull" data-action="createAccount">${L.createBtn}</button>`
      : `<p class="muted">${L.lockedStep}</p>`;

    const stepCls = (done, locked) => `step ${done ? "done" : ""} ${locked ? "locked" : ""}`;
    const badge = (n, done) => `<span class="badge">${done ? "✓" : n}</span>`;

    return `

        <div class="card auth">

  // إرسال رمز البريد (وإعادة الإرسال)
  async function sendCode() {
    if (busy) return;
    const L = T[state.lang];
    if (coolLeft("email") > 0) return;
    const email = (document.getElementById("sEmail")?.value || pending.email || "").trim();
    if (!isEmail(email)) return setNotice(L.emailBad, "err");
    busy = true; setNotice(L.wait, "info");
    try {
      const { error } = await withTimeout(sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true } }));
      if (error) return setNotice(errMsg(error), "err");
      pending.email = email; pending.codeSent = true; savePending();
      startCool("email");
      setNotice(L.codeSentTo + " " + email, "ok");
      render(); focusOtp("email", 0);
    } catch (e) {
      setNotice(errMsg(e), "err");
    } finally { busy = false; }
  }

  // التحقق من رمز البريد: تلقائي عند اكتمال 6 أرقام
  async function verifyEmail() {
    if (busy) return;
    const L = T[state.lang];
    const code = readOtp("email");
    if (!/^\d{6}$/.test(code)) return;
    busy = true; setNotice(L.verifying, "info");
    try {
      let res = await withTimeout(sb.auth.verifyOtp({ email: pending.email, token: code, type: "email" }), VERIFY_TIMEOUT_MS);
      if (res.error) res = await withTimeout(sb.auth.verifyOtp({ email: pending.email, token: code, type: "magiclink" }), VERIFY_TIMEOUT_MS);
      if (res.error) {
        // إذا كان البريد متحقق منه من قبل في الجلسة، نعتبره ناجحًا
        const { data: { user } } = await withTimeout(sb.auth.getUser(), VERIFY_TIMEOUT_MS);
        const ok = user && user.email_confirmed_at && String(user.email).toLowerCase() === pending.email.toLowerCase();
        if (!ok) {
          clearOtp("email"); focusOtp("email", 0);
          return setNotice(codeErr(res.error), "err");
        }
        me = user;
      } else {
        me = res.data.user || me;
      }
      pending.emailVerified = true; pending.codeSent = false; savePending();
      setNotice(L.emailOk, "ok"); render();
    } catch (e) {
      if (isTimeout(e)) { setNotice(L.verifyTimeout, "err"); }
      else { clearOtp("email"); focusOtp("email", 0); setNotice(errMsg(e), "err"); }
    } finally { busy = false; }
  }

  async function changeEmail() {
    try { await sb.auth.signOut(); } catch (e) {}
    me = null; profile = null; clearPending();
    notice = ""; render();
  }

  // إرسال رمز الجوال (وإعادة الإرسال)
  async function sendSms() {
    if (busy) return;
    const L = T[state.lang];
    if (coolLeft("sms") > 0) return;
    const digits = digitsOnly(document.getElementById("sPhone")?.value || pending.phone || "");
    if (!/^\d{6,12}$/.test(digits)) return setNotice(L.phoneBad, "err");
    const full = pending.dial + digits;
    // إذا الرقم نفسه متحقق منه من قبل، ما نرسل شي
    if (me && me.phone_confirmed_at && samePhone(me.phone, full)) {
      pending.phone = digits; pending.full = full; pending.phoneVerified = true; pending.otpSent = false; pending.editPhone = false; savePending();
      setNotice(L.phoneOk, "ok"); render();
      document.getElementById("stepDetails")?.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    busy = true; setNotice(L.wait, "info");
    try {
      const { data, error } = await withTimeout(sb.auth.updateUser({ phone: full }));
      console.log("[sendSms response]", { data, error });
      pending.phone = digits; pending.full = full; pending.phoneVerified = false; savePending();
      if (error) return setNotice(errMsg(error), "err");
      pending.otpSent = true; savePending();
      startCool("sms");
      setNotice(L.codeSentTo + " " + full, "ok");
      render(); focusOtp("sms", 0);
    } catch (e) {
      console.log("[sendSms error]", e);
      if (isTimeout(e)) {
        // ما رجع رد في الوقت: نعرض خانات الرمز، لأن الرسالة ممكن تكون وصلت
        pending.otpSent = true; savePending();
        startCool("sms");
        setNotice(L.smsTimeout, "info");
        render(); focusOtp("sms", 0);
      } else {
        setNotice(errMsg(e), "err");
      }
    } finally { busy = false; }
  }

  // التحقق من رمز الجوال: تلقائي عند اكتمال 6 أرقام
  async function verifySms() {
    if (busy) return;
    const L = T[state.lang];
    const code = readOtp("sms");
    if (!/^\d{6}$/.test(code)) return;
    busy = true; setNotice(L.verifying, "info");
    try {
      const { error } = await withTimeout(sb.auth.verifyOtp({ phone: pending.full, token: code, type: "phone_change" }), VERIFY_TIMEOUT_MS);
      let user = null;
      if (error) {
        // إذا الرقم متحقق منه فعلًا في الجلسة، نكمل بدل ما نطلب رمز جديد
        const r = await withTimeout(sb.auth.getUser(), VERIFY_TIMEOUT_MS);
        user = r.data?.user || null;
        const ok = user && user.phone_confirmed_at && samePhone(user.phone, pending.full);
        if (!ok) {
          clearOtp("sms"); focusOtp("sms", 0);
          return setNotice(codeErr(error), "err");
        }
      } else {
        const r = await withTimeout(sb.auth.getUser(), VERIFY_TIMEOUT_MS);
        user = r.data?.user || null;
      }
      me = user || me;
      pending.phoneVerified = true; pending.otpSent = false; pending.editPhone = false; savePending();
      setNotice(L.phoneOk, "ok"); render();
      document.getElementById("stepDetails")?.scrollIntoView({ behavior: "smooth", block: "center" });
    } catch (e) {
      if (isTimeout(e)) { setNotice(L.verifyTimeout, "err"); }
      else { clearOtp("sms"); focusOtp("sms", 0); setNotice(errMsg(e), "err"); }
    } finally { busy = false; }
  }

  function changePhone() {
    pending.otpSent = false; pending.phoneVerified = false; pending.editPhone = true; savePending();
    notice = ""; render();
  }

  // هنا فقط يُكتب الحساب في customers
  async function createAccount() {
    if (busy) return;
    const L = T[state.lang];
    const first = (document.getElementById("sFirst")?.value || "").trim();
    const last = (document.getElementById("sLast")?.value || "").trim();
    const p1 = document.getElementById("sPass")?.value || "";
    const p2 = document.getElementById("sPass2")?.value || "";
    pending.first = first; pending.last = last; savePending();
    if (!first || !last) return setNotice(L.namesReq, "err");
    if (p1.length < 8) return setNotice(L.passShort, "err");
    if (p1 !== p2) return setNotice(L.passMismatch, "err");
    busy = true; setNotice(L.wait, "info");
    try {
      await loadProfile();
      if (!me) return setNotice(L.codeExpired, "err");
      const { error } = await withTimeout(sb.auth.updateUser({ password: p1, data: { first_name: first, last_name: last } }), VERIFY_TIMEOUT_MS);
      if (error) return setNotice(errMsg(error), "err");
      const phoneValue = REQUIRE_PHONE ? (pending.full || null) : null;
      const { error: e2 } = await withTimeout(sb.from("customers").upsert({
        id: me.id, email: me.email, first_name: first, last_name: last, phone: phoneValue
      }), VERIFY_TIMEOUT_MS);
      if (e2) return setNotice(e2.message, "err");
      await loadProfile();
      clearPending();
      go("account", L.accountDone, "ok");
      loadOrders();
    } catch (e) {
      setNotice(isTimeout(e) ? L.verifyTimeout : errMsg(e), "err");
    } finally { busy = false; }
  }

  async function logout() {
    try { await sb.auth.signOut(); } catch (e) {}
    me = null; profile = null; accountOrders = null;
    go("shop", "");
  }

  async function saveProfile() {
    const first = document.getElementById("pFirst").value.trim();
    const last = document.getElementById("pLast").value.trim();
    const m = document.getElementById("pMsg");
    if (!first || !last) { m.textContent = t("namesReq"); return; }
    const { error } = await sb.from("customers").update({ first_name: first, last_name: last }).eq("id", me.id);
    if (error) { m.textContent = error.message; return; }
    await loadProfile();
    m.textContent = t("saved");
  }

  // ===== المنتجات والنافذة =====
  function priceRange(p) {
    const prices = p.variants.map(v => v.price);
    const min = Math.min(...prices), max = Math.max(...prices);
    return min === max ? fmt(localPrice(min)) : `${fmt(localPrice(min))} – ${fmt(localPrice(max))}`;
  }
  function galleryFor(p, v) { return [...new Set([v && v.image, ...(p.images || []), p.image].filter(Boolean))]; }
  function curModal() {
    if (!modal) return null;
    const p = products.find(x => x.pid === modal.pid);
    if (!p) return null;
    const v = p.variants.find(x => x.vid === modal.vid) || p.variants[0];
    return { p, v };
  }
  function openProduct(pid) {
    const p = products.find(x => x.pid === pid);
    if (!p) return;
    modal = { pid: p.pid, vid: p.variants[0].vid, qty: 1, idx: 0, paused: false, details: false };
    renderModal();
  }
  function detailsHTML(p, v) {
    const L = T[state.lang];
    const d = v.dimsCm || p.dimsCm;
    const dims = d ? d.map(x => Number(x).toFixed(1)).join(" × ") + " cm" : "—";
    const w = v.weightG || p.weightG;
    const txt = stripHTML(p.description);
    return `
      <h4 style="margin:4px 0 10px">${L.detailsTitle}</h4>
      <div class="row"><span class="muted">${L.dims}</span><span>${dims}</span></div>
      <div class="row"><span class="muted">${L.weight}</span><span>${w ? w + " g" : "—"}</span></div>
      <p style="line-height:1.8;font-size:14px;color:var(--muted)">${esc(txt ? txt.slice(0, 1500) : L.noDesc)}</p>
      <button class="ghost" data-action="mback" style="width:100%">${L.back}</button>`;
  }
  function renderModal() {
    const box = document.getElementById("pmodal");
    const c = curModal();
    if (!c) { box.classList.add("hidden"); box.innerHTML = ""; return; }
    const { p, v } = c;
    const L = T[state.lang];
    const g = galleryFor(p, v);
    if (modal.idx >= g.length) modal.idx = 0;
    const nav = g.length > 1
      ? `<button class="nav prev" data-action="mprev">‹</button><button class="nav next" data-action="mnext">›</button>` : "";
    const dots = g.length > 1
      ? `<div class="dots">${g.map((_, i) => `<span class="dot ${i === modal.idx ? "on" : ""}"></span>`).join("")}</div>` : "";

    let body;
    if (modal.details) {
      body = detailsHTML(p, v);
    } else {
      const opts = p.variants.length > 1
        ? `<label class="muted">${L.chooseOpt}</label>
           <select id="mVariant">${p.variants.map(x =>
              `<option value="${esc(x.vid)}" ${x.vid === v.vid ? "selected" : ""}>${esc(variantLabel(x))}</option>`
            ).join("")}</select>`
        : (v.key ? `<div class="muted">${esc(variantLabel(v))}</div>` : "");
      body = `
        <div class="price">${fmt(localPrice(v.price))}</div>
        ${opts}
        <div class="qtyrow">
          <span>${L.qty}</span>
          <span class="qtyctl"><button class="ghost" data-action="mqdec">−</button> <strong>${modal.qty}</strong> <button class="ghost" data-action="mqinc">+</button></span>
        </div>
        <button class="btn-orange" id="mAdd" style="width:100%">${L.add}</button>
        <button class="ghost" data-action="mdetails" style="width:100%;margin-top:8px">${L.details}</button>`;
    }

    box.innerHTML = `
      <div class="modal">
        <button class="xbtn" data-action="closeModal">✕</button>
        <div class="gallery">
          ${g.length ? `<img id="mImg" src="${esc(g[modal.idx])}" alt="">` : ""}
          ${nav}
        </div>
        ${dots}
        <h3 style="margin:12px 0 6px">${esc(p.nameEn)}</h3>
        ${body}
      </div>`;
    box.classList.remove("hidden");
  }
  function addLine(vid, qty) {
    const i = state.cart.find(x => x.vid === vid);
    if (i) i.qty += qty; else state.cart.push({ vid, qty });
    save();
  }
  function applyCoupon() {
    const code = (document.getElementById("cpn")?.value || "").trim().toUpperCase();
    if (COUPONS[code]) {
      state.coupon = code; save(); render();
      document.getElementById("cpnMsg").textContent = t("couponOk");
    } else {
      document.getElementById("cpnMsg").textContent = t("couponBad");
    }
  }

  // ===== العرض =====
  function fillCountrySelects() {
    ["countrySel", "gCountry"].forEach(id => {
      const sel = document.getElementById(id);
      sel.innerHTML = "";
      Object.entries(COUNTRIES).forEach(([code, c]) => {
        const o = document.createElement("option");
        o.value = code;
        o.textContent = `${c.flag} ${c.name[state.lang]}`;
        sel.appendChild(o);
      });
      sel.value = state.country;
    });
  }
  function renderGate() {
    const L = T[state.lang];
    document.getElementById("gTitle").textContent = L.welcome;
    document.getElementById("gCountryLbl").textContent = L.chooseCountry;
    document.getElementById("gLangLbl").textContent = L.chooseLang;
    document.getElementById("gGo").textContent = L.go;
    document.getElementById("gate").classList.toggle("hidden", state.seen);
  }
  function renderBuild() {
    const L = T[state.lang];
    document.getElementById("buildInfo").textContent = `${L.buildLabel}: ${BUILD.version} · ${L.updatedLabel}: ${BUILD.updated}`;
  }
  function viewShop() {
    if (!loaded) return `<p>${t("loading")}</p>`;
    if (loadError) return `<p>${t("loadErr")}</p>`;
    if (!products.length) return `<p>${t("noProducts")}</p>`;
    return `<div class="grid">` + products.map(p => {
      const idx = cardIdx[p.pid] || 0;
      const img = p.images[idx] || p.image || "";
      const dots = p.images.length > 1
        ? `<div class="dots">${p.images.map((_, i) => `<span class="dot ${i === idx ? "on" : ""}" data-cd="${esc(p.pid)}"></span>`).join("")}</div>`
        : "";
      return `
        <div class="card">
          <div class="pimg">${img ? `<img id="c-${esc(p.pid)}" src="${esc(img)}" alt="">` : ""}</div>
          ${dots}
          <div class="pbody">
            <div class="pname">${esc(p.nameEn)}</div>
            <div class="price">${priceRange(p)}</div>
            <div class="row2">
              <button class="ghost" data-action="open" data-pid="${esc(p.pid)}">${t("details")}</button>
              <button data-action="quickAdd" data-pid="${esc(p.pid)}">${t("add")}</button>
            </div>
          </div>
        </div>`;
    }).join("") + `</div>`;
  }
  function viewCart() {
    const lines = cartLines();
    if (!lines.length) return `<p>${t("empty")}</p><button class="ghost" data-action="shop">${t("back")}</button>`;
    const rows = lines.map(l => `
      <div class="crow">
        <img src="${esc(l.v.image || l.p.image)}" alt="">
        <div class="cinfo">
          <div class="pname">${esc(l.p.nameEn)}</div>
          ${l.v.key ? `<div class="muted">${esc(variantLabel(l.v))}</div>` : ""}
          <div class="price">${fmt(localPrice(l.v.price))}</div>
          <div class="qtyctl">
            <button class="ghost" data-action="dec" data-vid="${esc(l.vid)}">−</button>
            ${l.qty}
            <button class="ghost" data-action="inc" data-vid="${esc(l.vid)}">+</button>
          </div>
        </div>
        <button class="ghost" data-action="rm" data-vid="${esc(l.vid)}">✕</button>
      </div>`).join("");
    const disc = discountUSD();
    const couponLine = state.coupon
      ? `<div class="row"><span class="muted">${esc(state.coupon)}</span><button class="linkbtn" data-action="removeCoupon">${t("removeCoupon")}</button></div>`
      : `<div class="couponrow"><input id="cpn" placeholder="${t("coupon")}"><button class="ghost" data-action="applyCoupon">${t("apply")}</button></div>
         <p id="cpnMsg" class="muted"></p>`;
    return `
      <h3>${t("cartTitle")}</h3>
      <div class="card pad">${rows}</div>
      <div class="card pad">
        ${couponLine}
        <div class="row"><span>${t("productsVal")}</span><span>${fmt(localPrice(subtotalUSD()))}</span></div>
        ${disc > 0 ? `<div class="row"><span>${t("discount")}</span><span>- ${fmt(localPrice(disc))}</span></div>` : ""}
        <div class="row"><span>${t("shipping")}</span><span class="muted">${t("shipLater")}</span></div>
        <div class="row total"><strong>${t("grand")}</strong><strong class="price">${fmt(localPrice(subtotalUSD() - disc))}</strong></div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="ghost" data-action="shop" style="flex:1">${t("keepShopping")}</button>
        <button class="btn-orange" data-action="checkout" style="flex:1">${t("checkout")}</button>
      </div>`;
  }
  function viewCheckout() {
    const areas = AREAS[state.country][state.lang]
      .map(a => `<option value="${esc(a)}" ${state.area === a ? "selected" : ""}>${esc(a)}</option>`).join("");
    const name = `${profile?.first_name || ""} ${profile?.last_name || ""}`.trim();
    return `
      <h3>${t("checkout")}</h3>
      <div class="card pad">
        <div>${esc(name || me?.email || "")}</div>
        <div class="muted" dir="ltr">${esc(profile?.phone || me?.phone || "")}</div>
      </div>
      <select id="fArea"><option value="">${t("areaPh")}</option>${areas}</select>
      <input id="fAddr" placeholder="${t("address")}">
      <div class="card pad" id="summary"></div>
      <p id="formMsg" class="muted"></p>
      <button class="btn-orange" data-action="confirm" style="width:100%">${t("confirm")}</button>
      <p><button class="ghost" data-action="cart">${t("back")}</button></p>`;
  }
  function summaryHTML() {
    const sub = localPrice(subtotalUSD());
    const disc = localPrice(discountUSD());
    const discRow = disc > 0 ? `<div class="row"><span>${t("discount")}</span><span>- ${fmt(disc)}</span></div>` : "";
    if (!state.area) {
      return `<div class="row"><span>${t("productsVal")}</span><span>${fmt(sub)}</span></div>${discRow}<p class="muted">${t("shippingNote")}</p>`;
    }
    const ship = shipLocal(shippingCalc().shipBHD);
    return `<div class="row"><span>${t("productsVal")}</span><span>${fmt(sub)}</span></div>
            ${discRow}
            <div class="row"><span>${t("shipping")}</span><span>${fmt(ship)}</span></div>
            <div class="row total"><strong>${t("grand")}</strong><strong class="price">${fmt(sub - disc + ship)}</strong></div>`;
  }
  function ordersHTML() {
    if (ordersFailed) return `<p class="muted">${t("ordersErr")}</p>`;
    if (!accountOrders || !accountOrders.length) return `<p class="muted">${t("noOrders")}</p>`;
    return accountOrders.map(o => `
      <div class="card pad">
        <div class="row"><strong>#${esc(String(o.id).slice(0, 8))}</strong><span class="muted">${esc(String(o.created_at || "").slice(0, 10))}</span></div>
        <div class="row"><span>${esc(o.status || "")}</span><strong>${fmtFor(o.country, o.total)}</strong></div>
      </div>`).join("");
  }
  function viewAccount() {
    if (!isComplete()) return `<p>${t("needLogin")}</p><button data-action="login">${t("login")}</button>`;
    const name = `${profile?.first_name || ""} ${profile?.last_name || ""}`.trim();
    return `
      ${noticeHTML()}
      <div class="card pad">
        <strong>${esc(name || me.email)}</strong>
        <div class="muted" dir="ltr">${esc(me.email)}</div>
        ${profile?.phone ? `<div class="muted" dir="ltr">${esc(profile.phone)}</div>` : ""}
      </div>
      <h3>${t("editProfile")}</h3>
      <input id="pFirst" placeholder="${t("firstName")}" value="${esc(profile?.first_name || "")}">
      <input id="pLast" placeholder="${t("lastName")}" value="${esc(profile?.last_name || "")}">
      <button data-action="saveProfile">${t("save")}</button> <span id="pMsg" class="muted"></span>
      <h3 style="margin-top:20px">${t("myOrders")}</h3>
      <div>${accountOrders === null ? t("loading") : ordersHTML()}</div>
      <p><button class="ghost" data-action="logout">${t("logout")}</button></p>`;
  }
  function updateDebug() {
    const d = document.getElementById("debug");
    if (!(debugOn || location.hash === "#debug")) { d.classList.add("hidden"); return; }
    d.classList.remove("hidden");
    const s = shippingCalc();
    d.textContent = JSON.stringify({
      build: BUILD, view, products: products.length, sessionUser: !!me, hasProfile: !!profile,
      emailVerified: pending.emailVerified, phoneVerified: pending.phoneVerified,
      chargeableKg: s.chargeable.toFixed(3), shippingBHD: s.shipBHD.toFixed(3), area: state.area
    }, null, 1);
  }
  function render() {
    document.documentElement.lang = state.lang;
    document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
    document.getElementById("langBtn").textContent = state.lang === "ar" ? "English" : "العربية";
    document.getElementById("cartBtn").textContent = `${t("cart")} (${cartCount()})`;
    document.getElementById("acctBtn").textContent = isComplete() ? t("account") : t("login");
    document.getElementById("siteName").textContent = t("siteName");

    let html;
    if (view === "cart") html = viewCart();
    else if (view === "checkout") html = viewCheckout();
    else if (view === "account") html = viewAccount();
    else if (view === "login") html = viewLogin();
    else if (view === "signup") html = viewSignup();
    else if (view === "done") html = `<p>${lastSaveOk ? t("done") : t("doneLocal")}</p><button data-action="shop">${t("back")}</button>`;
    else html = viewShop();
    document.getElementById("view").innerHTML = html;

    if (view === "checkout") document.getElementById("summary").innerHTML = summaryHTML();
    renderGate();
    renderBuild();
    renderModal();
    updateDebug();
    updateCooldowns();
  }

  // ===== الطلب =====
  async function confirmOrder() {
    const addr = document.getElementById("fAddr").value.trim();
    const msg = document.getElementById("formMsg");
    if (!state.area || !addr) { msg.textContent = t("fillAll"); return; }
    if (!isComplete()) { afterLogin = "checkout"; go("login", t("needLogin")); return; }

    const s = shippingCalc();
    const subtotal = localPrice(subtotalUSD());
    const discount = localPrice(discountUSD());
    const ship = shipLocal(s.shipBHD);
    const row = {
      user_id: me.id, country: state.country, status: "test-not-sent-to-cj",
      items: cartLines().map(l => ({ pid: l.p.pid, vid: l.vid, sku: l.v.sku, name: l.p.nameEn, variant: l.v.key, qty: l.qty, unitUSD: l.v.price })),
      shipping_address: { area: state.area, address: addr },
      contact: { name: `${profile?.first_name || ""} ${profile?.last_name || ""}`.trim(), phone: profile?.phone || null },
      coupon: state.coupon, subtotal, discount, shipping: ship,
      total: subtotal - discount + ship, internal_risk_bhd: s.riskBHD
    };

    lastSaveOk = false;
    try {
      const { error } = await sb.from("orders").insert(row);
      if (!error) lastSaveOk = true; else console.warn(error);
    } catch (e) { console.warn(e); }
    if (!lastSaveOk) {
      try {
        const arr = JSON.parse(localStorage.getItem("showbiz_orders") || "[]");
        arr.push({ ...row, created: new Date().toISOString() });
        localStorage.setItem("showbiz_orders", JSON.stringify(arr));
      } catch (e) {}
    }
    state.cart = []; state.area = null; state.coupon = null;
    save();
    go("done", "");
  }

  // ===== الأحداث =====
  async function handleAction(a, ds) {
    if (a === "open") { openProduct(ds.pid); return; }
    if (a === "quickAdd") {
      const p = products.find(x => x.pid === ds.pid);
      if (!p) return;
      if (p.variants.length === 1) { addLine(p.variants[0].vid, 1); render(); }
      else openProduct(p.pid);
      return;
    }
    if (a === "closeModal") { modal = null; renderModal(); return; }
    if (a === "mprev" || a === "mnext") {
      const c = curModal(); if (!c) return;
      const g = galleryFor(c.p, c.v);
      modal.idx = (modal.idx + (a === "mnext" ? 1 : -1) + g.length) % g.length;
      modal.paused = true; renderModal(); return;
    }
    if (a === "mqinc") { if (modal.qty < 99) modal.qty++; renderModal(); return; }
    if (a === "mqdec") { if (modal.qty > 1) modal.qty--; renderModal(); return; }
    if (a === "mdetails") { modal.details = true; renderModal(); return; }
    if (a === "mback") { modal.details = false; renderModal(); return; }
    if (a === "inc" || a === "dec" || a === "rm") {
      const i = state.cart.find(x => x.vid === ds.vid);
      if (!i) return;
      if (a === "inc") i.qty++;
      if (a === "dec") i.qty--;
      if (a === "rm" || i.qty <= 0) state.cart = state.cart.filter(x => x.vid !== ds.vid);
      save(); render(); return;
    }
    if (a === "applyCoupon") { applyCoupon(); return; }
    if (a === "removeCoupon") { state.coupon = null; save(); render(); return; }
    if (a === "cart") { go("cart", ""); return; }
    if (a === "shop") { go("shop", ""); return; }
    if (a === "login" || a === "toLogin") { go("login", ""); return; }
    if (a === "toSignup") { go("signup", ""); return; }
    if (a === "doLogin") { await doLogin(); return; }
    if (a === "account") {
      if (!isComplete()) { go("login", ""); return; }
      view = "account"; render(); loadOrders(); return;
    }
    if (a === "checkout") {
      if (!cartCount()) return;
      if (!isComplete()) { afterLogin = "checkout"; go("login", t("needLogin")); return; }
      go("checkout", ""); return;
    }
    if (a === "confirm") { await confirmOrder(); return; }
    if (a === "sendCode") { await sendCode(); return; }
    if (a === "changeEmail") { await changeEmail(); return; }
    if (a === "sendSms") { await sendSms(); return; }
    if (a === "changePhone") { changePhone(); return; }
    if (a === "createAccount") { await createAccount(); return; }
    if (a === "saveProfile") { await saveProfile(); return; }
    if (a === "logout") { await logout(); return; }
  }

  document.getElementById("view").addEventListener("click", (e) => {
    const b = e.target.closest("[data-action]");
    if (b && !b.disabled) handleAction(b.dataset.action, b.dataset);
  });

  // خانات الرمز: كتابة تنتقل للتالي، وعند اكتمال 6 أرقام يتحقق تلقائيًا
  document.getElementById("view").addEventListener("input", (e) => {
    const el = e.target;
    if (el.classList.contains("obox")) {
      const v = digitsOnly(el.value).slice(-1);
      el.value = v;
      const i = Number(el.dataset.i);
      if (v && i < 5) focusOtp(el.dataset.otp, i + 1);
      if (v) maybeVerify(el.dataset.otp);
      return;
    }
    const id = el.id;
    if (id === "sEmail") { pending.email = el.value.trim(); savePending(); }
    else if (id === "sPhone") { pending.phone = el.value.trim(); savePending(); }
    else if (id === "sFirst") { pending.first = el.value.trim(); savePending(); }
    else if (id === "sLast") { pending.last = el.value.trim(); savePending(); }
    else if (id === "lEmail") { loginEmail = el.value.trim(); }
  });
  document.getElementById("view").addEventListener("keydown", (e) => {
    const el = e.target;
    if (el.classList.contains("obox")) {
      const i = Number(el.dataset.i);
      const prefix = el.dataset.otp;
      if (e.key === "Backspace") {
        e.preventDefault();
        if (el.value) { el.value = ""; }
        else if (i > 0) {
          const prev = document.querySelector(`[data-otp="${prefix}"][data-i="${i - 1}"]`);
          if (prev) { prev.value = ""; prev.focus(); }
        }
      } else if (e.key === "ArrowLeft" && i > 0) {
        e.preventDefault(); focusOtp(prefix, i - 1);
      } else if (e.key === "ArrowRight" && i < 5) {
        e.preventDefault(); focusOtp(prefix, i + 1);
      }
      return;
    }
    if (e.key !== "Enter") return;
    if (el.id === "lPass") doLogin();
    else if (el.id === "sEmail") sendCode();
    else if (el.id === "sPass2") createAccount();
  });
  document.getElementById("view").addEventListener("paste", (e) => {
    const el = e.target;
    if (!el.classList.contains("obox")) return;
    e.preventDefault();
    const digits = digitsOnly(e.clipboardData?.getData("text") || "").slice(0, 6);
    if (!digits) return;
    const prefix = el.dataset.otp;
    const start = Number(el.dataset.i);
    [...digits].forEach((d, k) => {
      const box = document.querySelector(`[data-otp="${prefix}"][data-i="${start + k}"]`);
      if (box) box.value = d;
    });
    focusOtp(prefix, Math.min(start + digits.length, 5));
    maybeVerify(prefix);
  });
  document.getElementById("view").addEventListener("change", (e) => {
    if (e.target.id === "fArea") {
      state.area = e.target.value || null; save();
      document.getElementById("summary").innerHTML = summaryHTML();
      updateDebug();
    }
    if (e.target.id === "sDial") { pending.dial = e.target.value; savePending(); }
  });
  document.getElementById("pmodal").addEventListener("click", (e) => {
    if (e.target.id === "pmodal") { modal = null; renderModal(); return; }
    if (e.target.id === "mAdd") {
      const c = curModal(); if (!c) return;
      addLine(c.v.vid, modal.qty);
      modal = null; render(); return;
    }
    const b = e.target.closest("[data-action]");
    if (b) handleAction(b.dataset.action, b.dataset);
  });
  document.getElementById("pmodal").addEventListener("change", (e) => {
    if (e.target.id === "mVariant" && modal) {
      modal.vid = e.target.value; modal.idx = 0; modal.paused = true; renderModal();
    }
  });
  document.getElementById("countrySel").addEventListener("change", (e) => {
    state.country = e.target.value; state.area = null; save(); fillCountrySelects(); render();
  });
  document.getElementById("gCountry").addEventListener("change", (e) => {
    state.country = e.target.value; state.area = null; save(); fillCountrySelects(); render();
  });
  document.getElementById("langBtn").addEventListener("click", () => {
    state.lang = state.lang === "ar" ? "en" : "ar"; save(); fillCountrySelects(); render();
  });
  document.querySelectorAll("[data-glang]").forEach(btn => {
    btn.addEventListener("click", () => { state.lang = btn.dataset.glang; save(); fillCountrySelects(); render(); });
  });
  document.getElementById("gGo").addEventListener("click", () => { state.seen = true; save(); render(); });
  document.getElementById("cartBtn").addEventListener("click", () => go("cart", ""));
  document.getElementById("acctBtn").addEventListener("click", () => handleAction(isComplete() ? "account" : "login", {}));
  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "d") { e.preventDefault(); debugOn = !debugOn; updateDebug(); }
  });

  // تبديل الصور كل 5 ثواني
  setInterval(() => {
    if (modal && !modal.paused && !modal.details) {
      const c = curModal();
      if (c) {
        const g = galleryFor(c.p, c.v);
        if (g.length > 1) {
          modal.idx = (modal.idx + 1) % g.length;
          const img = document.getElementById("mImg");
          if (img) img.src = g[modal.idx];
          document.querySelectorAll("#pmodal .dot").forEach((el, i) => el.classList.toggle("on", i === modal.idx));
        }
      }
    }
    products.forEach(p => {
      if (p.images.length > 1) {
        cardIdx[p.pid] = ((cardIdx[p.pid] || 0) + 1) % p.images.length;
        const img = document.getElementById("c-" + p.pid);
        if (img) img.src = p.images[cardIdx[p.pid]];
        document.querySelectorAll(`[data-cd="${p.pid}"]`).forEach((el, i) => el.classList.toggle("on", i === cardIdx[p.pid]));
      }
    });
  }, SLIDE_MS);

  sb.auth.onAuthStateChange(async (_event, session) => {
    if (session && session.user) await refreshAuth();
    else { me = null; profile = null; if (view === "account") view = "shop"; }
    render();
  });

  // ===== البدء =====
  fillCountrySelects();
  render();
  loadProducts();
  initAuth().then(() => render());
</script>
</body>
</html>
