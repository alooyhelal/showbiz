<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Showbiz - تجربة</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 16px; background: #fafafa; color: #222; }
    h1 { font-size: 22px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .card { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 12px; }
    .card img { width: 100%; height: 180px; object-fit: contain; background: #f4f4f4; border-radius: 8px; }
    .title { font-size: 15px; margin: 10px 0 6px; min-height: 40px; }
    .price { font-weight: bold; color: #e8590c; }
    .sku { font-size: 12px; color: #888; direction: ltr; }
    button { width: 100%; padding: 10px; margin-top: 8px; border: 0; border-radius: 8px; background: #111; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <h1>منتجات Showbiz</h1>
  <div class="grid" id="products"></div>

  <script>
    // منتجات تجريبية ثابتة (بدون أي مفتاح API)
    // الأسعار والصور مأخوذة من صفحة CJ للتجربة فقط، ويجب التحقق منها قبل النشر
    const products = [
      {
        sku: "CJQCQCCZ00034",
        title: "مكنسة كهربائية لاسلكية للسيارة ومحمولة باليد",
        price: "$2.25 - $7.46",
        image: "https://placehold.co/400x400?text=CJ+Product"
      },
      {
        sku: "TEST-SKU-0002",
        title: "منتج تجريبي ثاني",
        price: "$10.00",
        image: "https://placehold.co/400x400?text=Product+2"
      }
    ];

    const container = document.getElementById("products");

    products.forEach((p) => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <img src="${p.image}" alt="">
        <div class="title"></div>
        <div class="price">${p.price}</div>
        <div class="sku">${p.sku}</div>
        <button>أضف للسلة</button>
      `;
      card.querySelector(".title").textContent = p.title;
      container.appendChild(card);
    });
  </script>
</body>
</html>
