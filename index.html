<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Showbiz</title>
<style>
  :root { --bg:#0b1220; --fg:#eef2f7; --card:#162033; --card2:#1d2a44; --line:#26334d; --muted:#9aa7bd; --blue:#5b9cff; --btn:#4a8fe0; --orange:#f59e4b; --dot:#3a4a68; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; padding:12px 16px; background:#0d1728; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  main { padding:16px; max-width:1000px; margin:auto; }
  select, input { padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--card2); color:var(--fg); width:100%; box-sizing:border-box; margin-bottom:8px; font-size:15px; }
  header select { width:auto; margin:0; }
  button { padding:10px 14px; border:0; border-radius:10px; background:var(--btn); color:#fff; cursor:pointer; font-size:14px; }
  button.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); }
  button.btn-orange { background:var(--orange); color:#111; font-weight:bold; }
  button.linkbtn { background:none; color:var(--orange); padding:4px; text-decoration:underline; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  .pad { padding:14px; margin-bottom:12px; }
  .pimg { height:210px; background:#f3f4f6; display:flex; align-items:center; justify-content:center; }
  .pimg img { width:100%; height:100%; object-fit:contain; transition:opacity .4s; }
  .pbody { padding:12px 14px 14px; }
  .pname { font-size:15px; line-height:1.5; margin-bottom:6px; }
  .price { color:var(--blue); font-weight:bold; font-size:17px; }
  .row2 { display:flex; gap:8px; margin-top:10px; }
  .row2 button { flex:1; }
  .dots { display:flex; gap:6px; justify-content:center; padding:8px 0 0; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--dot); display:inline-block; }
  .dot.on { background:var(--blue); }
  .muted { color:var(--muted); font-size:13px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 0; flex-wrap:wrap; }
  .row.total { border-top:1px solid var(--line); margin-top:6px; padding-top:12px; font-size:17px; }
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; padding:12px; overflow:auto; z-index:20; }
  .modal { background:var(--card); color:var(--fg); padding:18px; border-radius:18px; width:100%; max-width:440px; box-sizing:border-box; position:relative; }
  .gallery { position:relative; height:300px; background:#f3f4f6; border-radius:12px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .gallery img { width:100%; height:100%; object-fit:contain; transition:opacity .4s; }
  .nav { position:absolute; top:50%; transform:translateY(-50%); background:rgba(0,0,0,.45); color:#fff; padding:6px 12px; }
  .nav.prev { left:8px; }
  .nav.next { right:8px; }
  .xbtn { position:absolute; top:10px; left:10px; background:rgba(0,0,0,.55); color:#fff; padding:4px 10px; z-index:2; }
  .qtyrow { display:flex; justify-content:space-between; align-items:center; margin:12px 0; }
  .qtyctl button { padding:6px 12px; }
  .crow { display:flex; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .crow:last-child { border-bottom:0; }
  .crow img { width:72px; height:72px; object-fit:contain; background:#f3f4f6; border-radius:10px; }
  .cinfo { flex:1; }
  .couponrow { display:flex; gap:8px; }
  .couponrow input { margin:0; }
  .couponrow button { white-space:nowrap; }
  .hidden { display:none !important; }
  #debug { position:fixed; bottom:0; left:0; right:0; background:#000; color:#0f0; font:12px monospace; padding:8px; direction:ltr; white-space:pre-wrap; max-height:40vh; overflow:auto; z-index:30; }
</style>
</head>
<body>

<header>
  <strong id="siteName">Showbiz</strong>
  <div>
    <select id="countrySel"></select>
    <button class="ghost" id="langBtn">English</button>
    <button class="ghost" id="cartBtn">السلة (0)</button>
    <button class="ghost" id="acctBtn">تسجيل الدخول</button>
  </div>
</header>

<main><div id="view"></div></main>

<div class="overlay hidden" id="pmodal"></div>
<div class="overlay hidden" id="authModal"></div>

<div class="overlay hidden" id="gate">

    <h3 id="gTitle"></h3>
    <label id="gCountryLbl"></label>
    <select id="gCountry"></select>
    <label id="gLangLbl"></label>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button class="ghost" data-glang="ar">العربية</button>
      <button class="ghost" data-glang="en">English</button>
    </div>
    <button id="gGo" style="width:100%"></button>
  </div>
</div>

<div id="debug" class="hidden"></div>

  const COUNTRIES = {

    SA: { flag:"🇸🇦", dial:"+966", name:{ar:"السعودية", en:"Saudi Arabia"}, sym:{ar:"SAR", en:"SAR"}, dec:2, rate:3.75,   base:3.3 },

  };
  const AREAS = {

    SA: { ar:["الرياض","جدة","الدمام","مكة المكرمة","المدينة المنورة","أخرى"], en:["Riyadh","Jeddah","Dammam","Makkah","Madinah","Other"] },

    KW: { ar:["الكويت","حولي","الفروانية","الجهراء","أخرى"], en:["Kuwait City","Hawalli","Farwaniya","Jahra","Other"] },
    QA: { ar:["الدوحة","الريان","الوكرة","أخرى"], en:["Doha","Al Rayyan","Al Wakra","Other"] },
    OM: { ar:["مسقط","صلالة","صحار","أخرى"], en:["Muscat","Salalah","Sohar","Other"] }
  };

  const T = {
    ar: {
      siteName:"Showbiz", welcome:"مرحبًا بك", chooseCountry:"اختر الدولة", chooseLang:"اختر اللغة", go:"متابعة",
      details:"التفاصيل", detailsTitle:"تفاصيل المنتج", chooseOpt:"اختر اللون / النمط", add:"إضافة للسلة", close:"إغلاق",
      qty:"الكمية", cart:"السلة", cartTitle:"سلة المشتريات", empty:"السلة فارغة", total:"المجموع", grand:"الإجمالي",

      keepShopping:"متابعة التسوق", checkout:"إتمام الطلب", name:"الاسم", area:"المنطقة", areaPh:"اختر المنطقة أو المدينة",
      address:"العنوان التفصيلي", confirm:"تأكيد الطلب", back:"رجوع", backShort:"رجوع",
      done:"تم حفظ الطلب التجريبي (لم يُرسل لـ CJ)", doneLocal:"تعذر الحفظ في السيرفر، تم حفظ الطلب في هذا المتصفح فقط",
      loadErr:"تعذر تحميل المنتجات، حاول مرة ثانية", loading:"جاري التحميل...", wait:"لحظة...",

      loginTitle:"تسجيل الدخول", email:"البريد الإلكتروني", password:"كلمة المرور", loginBtn:"دخول",
      noAccount:"ليس لدي حساب، أنشئ حساب", createAccount:"إنشاء حساب", sendCode:"إرسال رمز التحقق",
      codeSent:"تم إرسال رمز التحقق إلى بريدك", enterCode:"أدخل رمز التحقق", verify:"تحقق", resend:"إعادة الإرسال",
      emailBad:"البريد الإلكتروني غير صحيح", backToLogin:"رجوع لتسجيل الدخول", phoneStep:"رقم الجوال",
      sendSms:"إرسال رمز الجوال", smsSent:"تم إرسال الرمز إلى جوالك", phoneBad:"رقم الجوال غير صحيح",
      finishTitle:"بيانات الحساب", confirmPass:"تأكيد كلمة المرور", createBtn:"إنشاء الحساب",
      namesReq:"الاسم الأول والثاني مطلوبين", passShort:"كلمة المرور لازم تكون 8 أحرف أو أكثر",
      passMismatch:"كلمتا المرور غير متطابقتين", badCode:"رمز التحقق غير صحيح أو منتهي",
      loginFail:"البريد أو كلمة المرور غير صحيحة", rateLimit:"محاولات كثيرة، انتظر قليلًا ثم حاول",
      alreadyExists:"هذا الحساب موجود، تم تسجيل دخولك", signedUp:"تم إنشاء الحساب بنجاح",
      defaultVariant:"افتراضي"
    },
    en: {
      siteName:"Showbiz", welcome:"Welcome", chooseCountry:"Choose country", chooseLang:"Choose language", go:"Continue",
      details:"Details", detailsTitle:"Product details", chooseOpt:"Choose color / style", add:"Add to cart", close:"Close",
      qty:"Quantity", cart:"Cart", cartTitle:"Shopping cart", empty:"Your cart is empty", total:"Subtotal", grand:"Total",
      productsVal:"Products", discount:"Discount", shipping:"Delivery fee", shipLater:"Set after choosing area",
      shippingNote:"Delivery fee is added once you select your area", coupon:"Have a discount code?", apply:"Apply",
      couponBad:"Invalid discount code", couponOk:"Discount code applied", removeCoupon:"Remove code",
      keepShopping:"Keep shopping", checkout:"Checkout", name:"Name", area:"Area", areaPh:"Please select your area or city",
      address:"Full address", confirm:"Confirm order", back:"Back", backShort:"Back",
      done:"Test order saved (not sent to CJ)", doneLocal:"Could not save to server; saved in this browser only",
      loadErr:"Could not load products, please try again", loading:"Loading...", wait:"Please wait...",
      noProducts:"No products available right now", fillAll:"Please fill all fields", remove:"Remove",
      dims:"Dimensions", weight:"Weight", noDesc:"No extra details",
      login:"Log in", logout:"Log out", account:"My account", myOrders:"My orders", noOrders:"You have no orders yet",
      ordersErr:"Could not load orders", editProfile:"Edit my details", save:"Save", saved:"Saved",
      firstName:"First name", lastName:"Last name", needLogin:"Log in or create an account to complete your order",
      loginTitle:"Log in", email:"Email", password:"Password", loginBtn:"Log in",
      noAccount:"No account? Create one", createAccount:"Create account", sendCode:"Send verification code",
      codeSent:"Verification code sent to your email", enterCode:"Enter verification code", verify:"Verify",
      resend:"Resend", emailBad:"Invalid email address", backToLogin:"Back to log in", phoneStep:"Mobile number",
      sendSms:"Send SMS code", smsSent:"Code sent to your mobile", phoneBad:"Invalid mobile number",
      finishTitle:"Account details", confirmPass:"Confirm password", createBtn:"Create account",
      namesReq:"First and last name are required", passShort:"Password must be 8 characters or more",
      passMismatch:"Passwords do not match", badCode:"Invalid or expired code",
      loginFail:"Email or password is incorrect", rateLimit:"Too many attempts, wait a moment and try again",
      alreadyExists:"This account already exists, you are now logged in", signedUp:"Account created successfully",
      defaultVariant:"Default"
    }
  };

  // ===== الحالة =====
  let state = { country:"BH", lang:"ar", cart:[], area:null, seen:false, coupon:null };
  try { Object.assign(state, JSON.parse(localStorage.getItem("showbiz_state") || "{}")); } catch(e) {}
  if (!Array.isArray(state.cart)) state.cart = [];
  function save() { try { localStorage.setItem("showbiz_state", JSON.stringify(state)); } catch(e) {} }

  let products = [];
  let loaded = false;
  let loadError = false;
  let view = "shop";
  let modal = null;      // { pid, vid, qty, idx, paused, details }
  let cardIdx = {};      // فهرس الصورة الحالية لكل بطاقة
  let me = null;
  let profile = null;
  let accountOrders = null;
  let ordersFailed = false;
  let lastSaveOk = true;
  let debugOn = false;
  let auth = { open:false, step:"login", email:"", dial:"+973", phone:"", full:"", first:"", last:"", msg:"", afterLogin:null };

  // ===== مساعدات =====
  const t = (k) => T[state.lang][k];
  const rate = () => COUNTRIES[state.country].rate;
  const localPrice = (usd) => usd * rate();
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const isEmail = (s) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);

  function fmt(amount) {
    const c = COUNTRIES[state.country];
    const n = Number(amount).toFixed(c.dec);
    return state.lang === "ar" ? `${n} ${c.sym.ar}` : `${c.sym.en} ${n}`;
  }
  function fmtFor(code, amount) {
    const c = COUNTRIES[code] || COUNTRIES[state.country];
    const n = Number(amount).toFixed(c.dec);
    return state.lang === "ar" ? `${n} ${c.sym.ar}` : `${c.sym.en} ${n}`;
  }

  const variantLabel = (v) => v.key ? String(v.key).replace(/-/g, " · ") : t("defaultVariant");

  function stripHTML(html) {
    if (!html) return "";
    const doc = new DOMParser().parseFromString(String(html), "text/html");
    return (doc.body.textContent || "").replace(/\s+/g, " ").trim();
  }

  function findVariant(vid) {
    for (const p of products) {
      const v = p.variants.find(x => x.vid === vid);
      if (v) return { p, v };
    }
    return null;
  }

  function cartLines() {
    return state.cart
      .map(i => { const f = findVariant(i.vid); return f ? { vid: i.vid, qty: i.qty, p: f.p, v: f.v } : null; })
      .filter(Boolean);
  }
  const cartCount = () => state.cart.reduce((s, i) => s + i.qty, 0);
  const subtotalUSD = () => cartLines().reduce((s, l) => s + l.v.price * l.qty, 0);
  const discountUSD = () => subtotalUSD() * (COUPONS[state.coupon] || 0);

  // ===== الحاسبة =====
  function shippingCalc() {
    let actualKg = 0, volKg = 0;
    cartLines().forEach(l => {
      const w = (l.v.weightG || l.p.weightG || 500) / 1000;
      const d = l.v.dimsCm || l.p.dimsCm || [10, 10, 10];
      actualKg += w * l.qty;
      volKg += (d[0] * d[1] * d[2] / 5000) * l.qty;
    });
    const chargeable = Math.max(actualKg, volKg);
    const base = COUNTRIES[state.country].base;
    const shipBHD = base + Math.max(0, chargeable - 1) * 0.5; // تجريبي
    const orderBHD = (subtotalUSD() - discountUSD()) * RATE_BHD;
    const riskBHD = Math.max(orderBHD * 0.15, 0.3); // داخلي فقط
    return { actualKg, volKg, chargeable, shipBHD, riskBHD };
  }
  const shipLocal = (bhd) => bhd * (rate() / RATE_BHD);

  // ===== تحميل المنتجات من الوسيط =====
  async function loadProducts() {
    loadError = false;
    try {
      const res = await fetch(WORKER_URL + "?action=list");
      const d = await res.json();
      if (!Array.isArray(d.products)) throw new Error("bad");
      products = d.products.map(p => {
        let variants = (p.variants || []).filter(v => v.price != null);
        // إذا المنتج ما له خيارات، نستخدم سعره الأساسي كخيار واحد
        if (!variants.length) {
          const base = parseFloat(String(p.sellPrice || "").split("-")[0]);
          if (!isNaN(base)) {
            variants = [{ vid: "base-" + p.pid, key: "", sku: p.sku, price: base, image: p.image, weightG: p.weightG, dimsCm: p.dimsCm }];
          }
        }
        const images = (p.images && p.images.length) ? p.images : [p.image].filter(Boolean);
        return { ...p, images, variants };
      }).filter(p => p.variants.length > 0);
    } catch (e) {
      loadError = true;
      products = [];
    }
    loaded = true;
    render();
  }

  // ===== الحساب =====
  async function loadProfile() {
    const { data: { user } } = await sb.auth.getUser();
    me = user || null;
    profile = null;
    if (me) {
      const { data } = await sb.from("customers").select("*").eq("id", me.id).maybeSingle();
      profile = data || null;
    }
  }

  async function loadOrders() {
    accountOrders = null;
    ordersFailed = false;
    render();
    try {
      const { data, error } = await sb.from("orders").select("*").order("created_at", { ascending: false });
      if (error) throw error;
      accountOrders = data || [];
    } catch (e) {
      ordersFailed = true;
      accountOrders = [];
    }
    render();
  }

  function errMsg(e) {
    const m = String(e?.message || e || "");
    const L = T[state.lang];
    if (/invalid login/i.test(m)) return L.loginFail;
    if (/rate|too many|seconds/i.test(m)) return L.rateLimit;
    if (/token|otp|expired|invalid/i.test(m)) return L.badCode;
    return m;
  }

  function syncAuth() {
    const g = (id) => document.getElementById(id);
    if (g("aEmail")) auth.email = g("aEmail").value.trim();
    if (g("aPhone")) auth.phone = g("aPhone").value.trim();
    if (g("aDial")) auth.dial = g("aDial").value;
    if (g("aFirst")) auth.first = g("aFirst").value.trim();
    if (g("aLast")) auth.last = g("aLast").value.trim();
  }

  function renderAuth() {
    syncAuth();
    const box = document.getElementById("authModal");
    if (!auth.open) { box.classList.add("hidden"); box.innerHTML = ""; return; }
    const L = T[state.lang];
    const s = auth.step;
    let body = "";
    if (s === "login") {
      body = `<h3>${L.loginTitle}</h3>
        <input id="aEmail" type="email" dir="ltr" placeholder="${L.email}" value="${esc(auth.email)}">
        <input id="aPass" type="password" dir="ltr" placeholder="${L.password}">
        <button id="aLogin" style="width:100%">${L.loginBtn}</button>
        <p><button class="linkbtn" data-auth="su-email">${L.noAccount}</button></p>`;
    } else if (s === "su-email") {
      body = `<h3>${L.createAccount}</h3>
        <input id="aEmail" type="email" dir="ltr" placeholder="${L.email}" value="${esc(auth.email)}">
        <button id="aSendCode" style="width:100%">${L.sendCode}</button>
        <p><button class="linkbtn" data-auth="login">${L.backToLogin}</button></p>`;
    } else if (s === "su-emailcode") {
      body = `<h3>${L.enterCode}</h3>
        <p class="muted" dir="ltr">${esc(auth.email)}</p>
        <input id="aCode" inputmode="numeric" dir="ltr" maxlength="6" placeholder="123456">
        <button id="aVerifyEmail" style="width:100%">${L.verify}</button>
        <p><button class="linkbtn" id="aResend">${L.resend}</button></p>`;
    } else if (s === "su-phone") {
      const dialOpts = Object.entries(COUNTRIES).map(([, c]) =>
        `<option value="${c.dial}" ${auth.dial === c.dial ? "selected" : ""}>${c.flag} ${c.dial} ${c.name[state.lang]}</option>`
      ).join("");
      body = `<h3>${L.phoneStep}</h3>
        <div class="row" style="flex-wrap:nowrap">
          <select id="aDial" style="width:auto">${dialOpts}</select>
          <input id="aPhone" type="tel" dir="ltr" placeholder="36123456" value="${esc(auth.phone)}" style="flex:1">
        </div>
        <button id="aSendSms" style="width:100%">${L.sendSms}</button>`;
    } else if (s === "su-phonecode") {
      body = `<h3>${L.enterCode}</h3>
        <p class="muted" dir="ltr">${esc(auth.full)}</p>
        <input id="aCode" inputmode="numeric" dir="ltr" maxlength="6" placeholder="123456">
        <button id="aVerifyPhone" style="width:100%">${L.verify}</button>`;
    } else if (s === "su-details") {
      body = `<h3>${L.finishTitle}</h3>
        <input id="aFirst" placeholder="${L.firstName}" value="${esc(auth.first)}">
        <input id="aLast" placeholder="${L.lastName}" value="${esc(auth.last)}">
        <input id="aPass" type="password" dir="ltr" placeholder="${L.password}">
        <input id="aPass2" type="password" dir="ltr" placeholder="${L.confirmPass}">
        <button id="aCreate" style="width:100%">${L.createBtn}</button>`;
    }
    box.innerHTML = `<div class="modal">${body}
      <p id="authMsg" class="muted">${esc(auth.msg)}</p>
      <p><button class="ghost" data-auth="close">${L.close}</button></p></div>`;
    box.classList.remove("hidden");
  }

  function setMsg(m) {
    auth.msg = m;
    const el = document.getElementById("authMsg");
    if (el) el.textContent = m;
  }
  function setStep(step) {
    auth.step = step;
    auth.msg = "";
    renderAuth();
  }
  function openAuth(step, msg) {
    auth.open = true;
    auth.step = step || "login";
    auth.msg = msg || "";
    renderAuth();
  }
  function closeAuth() {
    auth.open = false;
    auth.afterLogin = null;
    renderAuth();
  }

  async function afterAuthSuccess() {
    await loadProfile();
    auth.open = false;
    if (auth.afterLogin) { view = auth.afterLogin; auth.afterLogin = null; }
    renderAuth();
    render();
  }

  async function doLogin() {
    syncAuth();
    const pass = document.getElementById("aPass").value;
    const L = T[state.lang];
    if (!isEmail(auth.email) || !pass) return setMsg(L.fillAll);
    setMsg(L.wait);
    const { error } = await sb.auth.signInWithPassword({ email: auth.email, password: pass });
    if (error) return setMsg(errMsg(error));
    await afterAuthSuccess();
  }

  async function doSendCode() {
    syncAuth();
    const L = T[state.lang];
    if (!isEmail(auth.email)) return setMsg(L.emailBad);
    setMsg(L.wait);
    const { error } = await sb.auth.signInWithOtp({ email: auth.email, options: { shouldCreateUser: true } });
    if (error) return setMsg(errMsg(error));
    setStep("su-emailcode");
    setMsg(L.codeSent);
  }

  async function doVerifyEmail() {
    const L = T[state.lang];
    const code = (document.getElementById("aCode").value || "").trim();
    if (!/^\d{6}$/.test(code)) return setMsg(L.badCode);
    setMsg(L.wait);
    const { error } = await sb.auth.verifyOtp({ email: auth.email, token: code, type: "email" });
    if (error) return setMsg(errMsg(error));
    await loadProfile();
    if (profile) {
      setMsg(L.alreadyExists);
      await afterAuthSuccess();
      return;
    }
    setStep(REQUIRE_PHONE ? "su-phone" : "su-details");
  }

  async function doSendSms() {
    syncAuth();
    const L = T[state.lang];
    const digits = auth.phone.replace(/\s+/g, "");
    if (!/^\d{6,12}$/.test(digits)) return setMsg(L.phoneBad);
    const full = auth.dial + digits;
    setMsg(L.wait);
    const { error } = await sb.auth.updateUser({ phone: full });
    if (error) return setMsg(errMsg(error));
    auth.full = full;
    setStep("su-phonecode");
    setMsg(L.smsSent);
  }

  async function doVerifyPhone() {
    const L = T[state.lang];
    const code = (document.getElementById("aCode").value || "").trim();
    if (!/^\d{6}$/.test(code)) return setMsg(L.badCode);
    setMsg(L.wait);
    const { error } = await sb.auth.verifyOtp({ phone: auth.full, token: code, type: "phone_change" });
    if (error) return setMsg(errMsg(error));
    setStep("su-details");
  }

  async function doCreate() {
    syncAuth();
    const L = T[state.lang];
    const p1 = document.getElementById("aPass").value;
    const p2 = document.getElementById("aPass2").value;
    if (!auth.first || !auth.last) return setMsg(L.namesReq);
    if (p1.length < 8) return setMsg(L.passShort);
    if (p1 !== p2) return setMsg(L.passMismatch);
    setMsg(L.wait);
    const { error } = await sb.auth.updateUser({ password: p1, data: { first_name: auth.first, last_name: auth.last } });
    if (error) return setMsg(errMsg(error));
    const { data: { user } } = await sb.auth.getUser();
    if (!user) return setMsg(L.badCode);
    const row = {
      id: user.id,
      email: user.email,
      first_name: auth.first,
      last_name: auth.last,
      phone: REQUIRE_PHONE ? auth.full : null
    };
    const { error: e2 } = await sb.from("customers").upsert(row);
    if (e2) return setMsg(e2.message);
    setMsg(L.signedUp);
    await afterAuthSuccess();
  }

  async function saveProfile() {
    const first = document.getElementById("pFirst").value.trim();
    const last = document.getElementById("pLast").value.trim();
    const m = document.getElementById("pMsg");
    if (!first || !last) { m.textContent = t("namesReq"); return; }
    const { error } = await sb.from("customers").update({ first_name: first, last_name: last }).eq("id", me.id);
    if (error) { m.textContent = error.message; return; }
    await loadProfile();
    m.textContent = t("saved");
  }

  async function logout() {
    await sb.auth.signOut();
    me = null;
    profile = null;
    accountOrders = null;
    view = "shop";
    render();
  }

  // ===== المنتجات والنافذة =====
  function galleryFor(p, v) {
    const arr = [v && v.image, ...(p.images || []), p.image].filter(Boolean);
    return [...new Set(arr)];
  }

  function curModal() {
    if (!modal) return null;
    const p = products.find(x => x.pid === modal.pid);
    if (!p) return null;
    const v = p.variants.find(x => x.vid === modal.vid) || p.variants[0];
    return { p, v };
  }

  function openProduct(pid) {
    const p = products.find(x => x.pid === pid);
    if (!p) return;
    modal = { pid: p.pid, vid: p.variants[0].vid, qty: 1, idx: 0, paused: false, details: false };
    renderModal();
  }

  function detailsHTML(p, v) {
    const L = T[state.lang];
    const d = v.dimsCm || p.dimsCm;
    const dims = d ? d.map(x => Number(x).toFixed(1)).join(" × ") + " cm" : "—";
    const w = v.weightG || p.weightG;
    const txt = stripHTML(p.description);
    return `
      <h4 style="margin:4px 0 10px">${L.detailsTitle}</h4>
      <div class="row"><span class="muted">${L.dims}</span><span>${dims}</span></div>
      <div class="row"><span class="muted">${L.weight}</span><span>${w ? w + " g" : "—"}</span></div>
      <p style="line-height:1.8;font-size:14px;color:var(--muted)">${esc(txt ? txt.slice(0, 1500) : L.noDesc)}</p>
      <button class="ghost" data-action="mback" style="width:100%">${L.backShort}</button>`;
  }

  function renderModal() {
    const box = document.getElementById("pmodal");
    const c = curModal();
    if (!c) { box.classList.add("hidden"); box.innerHTML = ""; return; }
    const { p, v } = c;
    const L = T[state.lang];
    const g = galleryFor(p, v);
    if (modal.idx >= g.length) modal.idx = 0;

    const nav = g.length > 1
      ? `<button class="nav prev" data-action="mprev">‹</button><button class="nav next" data-action="mnext">›</button>`
      : "";
    const dots = g.length > 1
      ? `<div class="dots">${g.map((_, i) => `<span class="dot ${i === modal.idx ? "on" : ""}"></span>`).join("")}</div>`
      : "";

    let body;
    if (modal.details) {
      body = detailsHTML(p, v);
    } else {
      const opts = p.variants.length > 1
        ? `<label class="muted">${L.chooseOpt}</label>
           <select id="mVariant">${p.variants.map(x =>
              `<option value="${esc(x.vid)}" ${x.vid === v.vid ? "selected" : ""}>${esc(variantLabel(x))}</option>`
            ).join("")}</select>`
        : (v.key ? `<div class="muted">${esc(variantLabel(v))}</div>` : "");
      body = `
        <div class="price">${fmt(localPrice(v.price))}</div>
        ${opts}
        <div class="qtyrow">
          <span>${L.qty}</span>
          <span class="qtyctl"><button class="ghost" data-action="mqdec">−</button> <strong>${modal.qty}</strong> <button class="ghost" data-action="mqinc">+</button></span>
        </div>
        <button class="btn-orange" id="mAdd" style="width:100%">${L.add}</button>
        <button class="ghost" data-action="mdetails" style="width:100%;margin-top:8px">${L.details}</button>`;
    }

    box.innerHTML = `
      <div class="modal">
        <button class="xbtn" data-action="closeModal">✕</button>
        <div class="gallery">
          ${g.length ? `<img id="mImg" src="${esc(g[modal.idx])}" alt="">` : ""}
          ${nav}
        </div>
        ${dots}
        <h3 style="margin:12px 0 6px">${esc(p.nameEn)}</h3>
        ${body}
      </div>`;
    box.classList.remove("hidden");
  }

  function addLine(vid, qty) {
    const i = state.cart.find(x => x.vid === vid);
    if (i) i.qty += qty; else state.cart.push({ vid, qty });
    save();
  }

  function priceRange(p) {
    const prices = p.variants.map(v => v.price);
    const min = Math.min(...prices), max = Math.max(...prices);
    return min === max
      ? fmt(localPrice(min))
      : `${fmt(localPrice(min))} – ${fmt(localPrice(max))}`;
  }

      const img = p.images[idx] || p.image || "";
      const dots = p.images.length > 1
        ? `<div class="dots">${p.images.map((_, i) => `<span class="dot ${i === idx ? "on" : ""}" data-cd="${esc(p.pid)}"></span>`).join("")}</div>`

            <div class="price">${priceRange(p)}</div>
            <div class="row2">

        <div class="cinfo">

  // ===== الطلب =====
  async function confirmOrder() {
    const addr = document.getElementById("fAddr").value.trim();
    const msg = document.getElementById("formMsg");
    if (!state.area || !addr) { msg.textContent = t("fillAll"); return; }
    if (!me) { auth.afterLogin = "checkout"; openAuth("login", t("needLogin")); return; }

    const s = shippingCalc();
    const subtotal = localPrice(subtotalUSD());
    const discount = localPrice(discountUSD());
    const ship = shipLocal(s.shipBHD);
    const row = {
      user_id: me.id,
      country: state.country,
      status: "test-not-sent-to-cj",
      items: cartLines().map(l => ({ pid: l.p.pid, vid: l.vid, sku: l.v.sku, name: l.p.nameEn, variant: l.v.key, qty: l.qty, unitUSD: l.v.price })),
      shipping_address: { area: state.area, address: addr },
      contact: { name: `${profile?.first_name || ""} ${profile?.last_name || ""}`.trim(), phone: profile?.phone || null },
      coupon: state.coupon,
      subtotal: subtotal,
      discount: discount,
      shipping: ship,
      total: subtotal - discount + ship,
      internal_risk_bhd: s.riskBHD
    };

    lastSaveOk = false;
    try {
      const { error } = await sb.from("orders").insert(row);
      if (!error) lastSaveOk = true;
      else console.warn(error);
    } catch (e) { console.warn(e); }

    if (!lastSaveOk) {
      try {
        const arr = JSON.parse(localStorage.getItem("showbiz_orders") || "[]");
        arr.push({ ...row, created: new Date().toISOString() });
        localStorage.setItem("showbiz_orders", JSON.stringify(arr));
      } catch (e) {}
    }

    state.cart = [];
    state.area = null;
    state.coupon = null;
    save();
    view = "done";
    render();
  }

  // ===== الأحداث =====
  async function handleAction(a, ds) {
    if (a === "open") { openProduct(ds.pid); return; }
    if (a === "quickAdd") {
      const p = products.find(x => x.pid === ds.pid);
      if (!p) return;
      if (p.variants.length === 1) { addLine(p.variants[0].vid, 1); render(); }
      else openProduct(p.pid);
      return;
    }
    if (a === "closeModal") { modal = null; renderModal(); return; }
    if (a === "mprev" || a === "mnext") {
      const c = curModal(); if (!c) return;
      const g = galleryFor(c.p, c.v);
      modal.idx = (modal.idx + (a === "mnext" ? 1 : -1) + g.length) % g.length;
      modal.paused = true;
      renderModal(); return;
    }
    if (a === "mqinc") { if (modal.qty < 99) modal.qty++; renderModal(); return; }
    if (a === "mqdec") { if (modal.qty > 1) modal.qty--; renderModal(); return; }
    if (a === "mdetails") { modal.details = true; renderModal(); return; }
    if (a === "mback") { modal.details = false; renderModal(); return; }

    if (a === "inc" || a === "dec" || a === "rm") {
      const i = state.cart.find(x => x.vid === ds.vid);
      if (!i) return;
      if (a === "inc") i.qty++;
      if (a === "dec") i.qty--;
      if (a === "rm" || i.qty <= 0) state.cart = state.cart.filter(x => x.vid !== ds.vid);
      save(); render(); return;
    }
    if (a === "applyCoupon") { applyCoupon(); return; }
    if (a === "removeCoupon") { state.coupon = null; save(); render(); return; }
    if (a === "cart") { view = "cart"; render(); return; }
    if (a === "shop") { view = "shop"; render(); return; }
    if (a === "login") { openAuth("login"); return; }
    if (a === "account") {
      if (!me) { openAuth("login"); return; }
      view = "account"; render(); loadOrders(); return;
    }
    if (a === "checkout") {
      if (!cartCount()) return;
      if (!me) { auth.afterLogin = "checkout"; openAuth("login", t("needLogin")); return; }
      view = "checkout"; render(); return;
    }
    if (a === "confirm") { await confirmOrder(); return; }
    if (a === "saveProfile") { await saveProfile(); return; }
    if (a === "logout") { await logout(); return; }
  }

  document.getElementById("view").addEventListener("click", (e) => {
    const b = e.target.closest("[data-action]");
    if (b) handleAction(b.dataset.action, b.dataset);
  });

  document.getElementById("pmodal").addEventListener("click", (e) => {
    if (e.target.id === "pmodal") { modal = null; renderModal(); return; }
    if (e.target.id === "mAdd") {
      const c = curModal(); if (!c) return;
      addLine(c.v.vid, modal.qty);
      modal = null;
      render();
      return;
    }
    const b = e.target.closest("[data-action]");
    if (b) handleAction(b.dataset.action, b.dataset);
  });

  document.getElementById("pmodal").addEventListener("change", (e) => {
    if (e.target.id === "mVariant" && modal) {
      modal.vid = e.target.value;
      modal.idx = 0;
      modal.paused = true; // نثبّت صورة الخيار المختار
      renderModal();
    }
  });

  document.getElementById("view").addEventListener("change", (e) => {
    if (e.target.id === "fArea") {
      state.area = e.target.value || null;
      save();
      document.getElementById("summary").innerHTML = summaryHTML();
      updateDebug();
    }
  });

  document.getElementById("authModal").addEventListener("click", async (e) => {
    if (e.target.id === "authModal") { closeAuth(); return; }
    const b = e.target.closest("[data-auth]");
    if (b) {
      const a = b.dataset.auth;
      if (a === "close") closeAuth(); else setStep(a);
      return;
    }
    switch (e.target.id) {
      case "aLogin": return doLogin();
      case "aSendCode": return doSendCode();
      case "aResend": return doSendCode();
      case "aVerifyEmail": return doVerifyEmail();
      case "aSendSms": return doSendSms();
      case "aVerifyPhone": return doVerifyPhone();
      case "aCreate": return doCreate();
    }
  });

  document.getElementById("countrySel").addEventListener("change", (e) => {
    state.country = e.target.value; state.area = null; save(); fillCountrySelects(); render();
  });
  document.getElementById("gCountry").addEventListener("change", (e) => {
    state.country = e.target.value; state.area = null; save(); fillCountrySelects(); render();
  });
  document.getElementById("langBtn").addEventListener("click", () => {
    state.lang = state.lang === "ar" ? "en" : "ar"; save(); fillCountrySelects(); render();
  });
  document.querySelectorAll("[data-glang]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.lang = btn.dataset.glang; save(); fillCountrySelects(); render();
    });
  });
  document.getElementById("gGo").addEventListener("click", () => {
    state.seen = true; save(); render();
  });
  document.getElementById("cartBtn").addEventListener("click", () => {
    view = "cart"; render();
  });
  document.getElementById("acctBtn").addEventListener("click", () => {
    handleAction(me ? "account" : "login", {});
  });
  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "d") {
      e.preventDefault();
      debugOn = !debugOn;
      updateDebug();
    }
  });

  // تبديل صور البطاقات والنافذة كل 5 ثواني
  setInterval(() => {
    if (modal && !modal.paused && !modal.details) {
      const c = curModal();
      if (c) {
        const g = galleryFor(c.p, c.v);
        if (g.length > 1) {
          modal.idx = (modal.idx + 1) % g.length;
          const img = document.getElementById("mImg");
          if (img) img.src = g[modal.idx];
          document.querySelectorAll("#pmodal .dot").forEach((el, i) => el.classList.toggle("on", i === modal.idx));
        }
      }
    }
    products.forEach(p => {
      if (p.images.length > 1) {
        cardIdx[p.pid] = ((cardIdx[p.pid] || 0) + 1) % p.images.length;
        const img = document.getElementById("c-" + p.pid);
        if (img) img.src = p.images[cardIdx[p.pid]];
        document.querySelectorAll(`[data-cd="${p.pid}"]`).forEach((el, i) => el.classList.toggle("on", i === cardIdx[p.pid]));
      }
    });
  }, SLIDE_MS);

  sb.auth.onAuthStateChange(async (_event, session) => {
    const prev = me && me.id;
    if (session && session.user) {
      if (!profile || !me || me.id !== session.user.id) await loadProfile();
    } else {
      me = null;
      profile = null;
    }
    if (prev !== (me && me.id)) render();
  });

  // ===== البدء =====
  fillCountrySelects();
  render();
  loadProducts();
  loadProfile().then(render);
</script>
</body>
</html>
