<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Showbiz</title>
<style>
  :root { --bg:#0b1220; --fg:#eef2f7; --card:#162033; --card2:#1d2a44; --line:#26334d; --muted:#9aa7bd; --blue:#5b9cff; --orange:#f59e4b; --orange-d:#e0852f; --dot:#3a4a68; --ok:#7ee2a8; --err:#ffb4bf; color-scheme:dark; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif; }
  header { display:block; padding:10px 16px; background:#0d1728; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  .announce { background:var(--orange); color:#111; font-size:13px; font-weight:700; padding:7px 0; overflow:hidden; white-space:nowrap; }
  .mq { display:inline-block; animation: mq 18s linear infinite; will-change:transform; }
  @keyframes mq { from { transform:translateX(100vw); } to { transform:translateX(-100%); } }
  @media (prefers-reduced-motion: reduce) { .mq { animation:none; transform:none; } }
  .hrow { display:flex; align-items:center; gap:8px; justify-content:space-between; flex-wrap:wrap; }
  .hctl { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .hrow2 { display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  .menubtn { display:none; padding:6px 10px; background:transparent; color:var(--fg); border:1px solid var(--line); font-weight:400; }
  .catdd { position:relative; }
  .catpanel { display:none; position:absolute; top:100%; inset-inline-start:0; min-width:260px; max-height:70vh; overflow-y:auto; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:6px; z-index:30; box-shadow:0 12px 30px rgba(0,0,0,.5); }
  .catdd:hover .catpanel, .catdd.open .catpanel { display:block; }
  .catpanel button, .side .catlink { display:block; width:100%; text-align:start; background:transparent; color:var(--fg); font-weight:400; padding:9px 10px; border-radius:8px; }
  .catpanel button:hover { background:var(--card2); }
  .searchbox { position:relative; flex:1; min-width:160px; }
  .searchbox input { margin:0; }
  .sugg { position:absolute; top:calc(100% + 4px); inset-inline:0; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:6px; z-index:30; box-shadow:0 12px 30px rgba(0,0,0,.5); }
  .sugg button { display:flex; gap:8px; align-items:center; width:100%; background:transparent; color:var(--fg); font-weight:400; padding:6px 8px; text-align:start; }
  .sugg img { width:36px; height:36px; object-fit:cover; border-radius:8px; background:#f3f4f6; }
  .sugg-h { color:var(--muted); font-size:12px; padding:4px 8px; }
  #sortSel { margin:0; width:auto; height:42px; padding:0 10px; font-size:13px; border-radius:999px; }
  .cat-tile small { display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:4px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:-2px 0 10px; }
  .chip { background:var(--card2); color:var(--fg); border:1px solid var(--line); border-radius:999px; padding:7px 12px; font-size:13px; font-weight:600; }
  .ct-row { display:flex; align-items:center; gap:4px; }
  .catpanel .ct-tog, .side .ct-tog { width:28px; height:28px; border:0; background:transparent; color:var(--muted); padding:0; font-size:14px; flex-shrink:0; }
  .catpanel .ct-tog:disabled, .side .ct-tog:disabled { visibility:hidden; }
  .catpanel .ct-name, .side .ct-name { flex:1; text-align:start; background:transparent; color:var(--fg); border:0; padding:8px 4px; font-size:14px; font-weight:600; border-radius:8px; }
  .catpanel .ct-name.on, .side .ct-name.on { color:var(--orange); }
  .catpanel .ct-name small, .side .ct-name small { color:var(--muted); font-weight:400; font-size:12px; }
  .sideov { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:44; }
  .side { position:fixed; top:0; bottom:0; inset-inline-start:0; width:min(300px,86vw); background:#0f1a2e; z-index:45; padding:14px; overflow:auto; box-shadow:0 12px 40px rgba(0,0,0,.6); }
  .side-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  @media (max-width:700px) { .menubtn { display:inline-block; } .catdd { display:none; } }
  .pimg { position:relative; }
  .badge { position:absolute; top:10px; inset-inline-start:10px; background:var(--orange); color:#111; font-size:12px; font-weight:800; padding:3px 9px; border-radius:999px; z-index:1; }
  .badge.alt { top:auto; bottom:10px; background:var(--card2); color:var(--fg); }
  .hov { position:absolute; inset-inline:10px; bottom:10px; display:flex; gap:8px; opacity:0; transition:opacity .2s; }
  .hov button { flex:1; padding:8px; font-size:13px; }
  .pimg:hover .hov { opacity:1; }
  @media (hover:none) { .hov { display:none; } }
  .old { color:var(--muted); font-size:12px; margin-inline-end:6px; font-weight:400; }
  .cat-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px; margin:14px 0; }
  .cat-tile { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 10px; color:var(--fg); font-weight:700; text-align:center; font-size:14px; }
  .sec-h { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:22px 0 10px; }
  .sec-h h3 { margin:0; font-size:17px; }
  .linkbtn { background:none; color:var(--orange); padding:4px 6px; text-decoration:underline; font-weight:400; }
  main { padding:16px 16px 56px; max-width:1000px; margin:auto; }
  select, input { padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card2); color:var(--fg); width:100%; box-sizing:border-box; margin-bottom:8px; font-size:15px; font-family:inherit; }
  select option { background:var(--card2); color:var(--fg); }
  input:focus, select:focus { outline:2px solid var(--orange); outline-offset:1px; }
  header select { width:auto; margin:0; }
  button { padding:10px 14px; border:0; border-radius:10px; background:var(--orange); color:#111; cursor:pointer; font-size:14px; font-family:inherit; font-weight:700; }
  button.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); font-weight:400; }
  button.linkbtn { background:none; color:var(--orange); padding:4px 6px; text-decoration:underline; font-weight:400; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .btnfull { width:100%; }
  .btnlink { display:block; text-align:center; padding:12px; border-radius:10px; background:var(--orange); color:#111; text-decoration:none; font-weight:700; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  .pad { padding:14px; margin-bottom:12px; }
  .pimg { height:210px; background:#f3f4f6; display:flex; align-items:center; justify-content:center; }
  .pimg img { width:100%; height:100%; object-fit:contain; transition:opacity .4s; }
  .pbody { padding:12px 14px 14px; }
  .pname { font-size:15px; line-height:1.5; margin-bottom:6px; }
  .price { color:var(--blue); font-weight:bold; font-size:17px; }
  .row2 { display:flex; gap:8px; margin-top:10px; }
  .row2 button { flex:1; }
  .dots { display:flex; gap:6px; justify-content:center; padding:8px 0 0; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--dot); display:inline-block; }
  .dot.on { background:var(--blue); }
  .muted { color:var(--muted); font-size:13px; line-height:1.7; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 0; flex-wrap:wrap; }
  .row.total { border-top:1px solid var(--line); margin-top:6px; padding-top:12px; font-size:17px; }
  h4 { margin:14px 0 8px; color:var(--muted); font-size:14px; font-weight:600; }
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; padding:12px; overflow:auto; z-index:20; }
  .modal { background:var(--card); color:var(--fg); padding:18px; border-radius:18px; width:100%; max-width:440px; box-sizing:border-box; position:relative; }
  .gallery { position:sticky; top:0; z-index:1; height:var(--gh,300px); transition:height .06s linear; background:#f3f4f6; border-radius:12px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .gallery img { width:100%; height:100%; object-fit:contain; transition:opacity .4s; }
  .nav { position:absolute; top:50%; transform:translateY(-50%); background:rgba(0,0,0,.45); color:#fff; padding:6px 12px; }
  .nav.prev { left:8px; } .nav.next { right:8px; }
  .xbtn { position:absolute; top:10px; left:10px; background:rgba(0,0,0,.55); color:#fff; padding:4px 10px; z-index:2; }
  .qtyrow { display:flex; justify-content:space-between; align-items:center; margin:12px 0; }
  .qtyctl button { padding:6px 12px; }
  .crow { display:flex; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .crow img { width:72px; height:72px; object-fit:contain; background:#f3f4f6; border-radius:10px; }
  .cinfo { flex:1; }
  .couponrow { display:flex; gap:8px; } .couponrow input { margin:0; } .couponrow button { white-space:nowrap; }
  .addrpick { display:block; cursor:pointer; margin-bottom:8px; position:relative; }
  .addrpick .flagc { position:absolute; top:12px; inset-inline-end:14px; line-height:0; }
  .flagimg { width:24px; height:18px; border-radius:2px; object-fit:cover; vertical-align:middle; }
  .addrpick strong { padding-inline-end:36px; display:block; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .addrpick .pickrow { display:flex; gap:10px; align-items:flex-start; }
  .addrpick input[type=radio] { width:auto; margin:4px 0 0; }
  .hidden { display:none !important; }
  .acctwrap { position:relative; display:inline-block; }
  .menu { position:absolute; top:calc(100% + 6px); inset-inline-end:0; min-width:210px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:6px; z-index:30; box-shadow:0 12px 30px rgba(0,0,0,.5); }
  .menu-who { padding:8px 12px; color:var(--muted); font-size:13px; border-bottom:1px solid var(--line); margin-bottom:4px; word-break:break-all; direction:ltr; text-align:start; }
  .menu a { display:block; padding:10px 12px; border-radius:8px; color:var(--fg); text-decoration:none; font-size:14px; }
  .menu a:hover { background:var(--card2); }
  .menu button.menu-out { width:100%; margin-top:4px; background:transparent; color:var(--fg); border:1px solid var(--line); font-weight:400; }
  .toast { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:var(--card); color:var(--ok); border:1px solid #2f6b4f; padding:16px 26px; border-radius:14px; font-size:17px; font-weight:bold; z-index:60; box-shadow:0 10px 30px rgba(0,0,0,.5); max-width:90vw; text-align:center; }
  .notice { padding:10px 12px; border-radius:10px; font-size:14px; margin:8px 0; color:var(--err); background:#3b1620; border:1px solid #7a2b3b; }
  .build { position:fixed; bottom:0; left:0; right:0; background:#070d18; color:#6b7a94; font:12px monospace; text-align:center; padding:6px; direction:ltr; z-index:4; border-top:1px solid var(--line); }
  /* ===== حركات: طيران المنتج للسلة، نطة السلة، فتح التفاصيل مثل Hero ===== */
  .cartbtn { overflow: visible; }
  .fly { position:fixed; left:0; top:0; z-index:300; width:64px; height:64px; border-radius:12px; overflow:hidden; box-shadow:0 8px 20px rgba(0,0,0,.45); pointer-events:none; will-change:transform; }
  .fly img { width:100%; height:100%; object-fit:cover; display:block; }
  .plus1 { position:fixed; z-index:301; pointer-events:none; color:var(--orange); font-weight:800; font-size:14px; background:var(--card); border:1px solid var(--orange); border-radius:999px; padding:2px 8px; }
  .hero-fly { position:fixed; z-index:310; object-fit:cover; border-radius:12px; pointer-events:none; }
  .card .pimg img { cursor:pointer; }
  @keyframes btnjump { 0% { transform:scale(1); } 40% { transform:scale(1.12) translateY(-3px); } 100% { transform:scale(1); } }
  .jump { animation: btnjump .45s ease; }
  @keyframes cartbounce { 0% { transform:scale(1); } 40% { transform:scale(1.3); } 100% { transform:scale(1); } }
  .bounce { animation: cartbounce .4s ease; }
  @media (prefers-reduced-motion: reduce) { .jump, .bounce { animation: none; } }
  /* ===== الأقسام: مربعات ثابتة، صف منتجات يتسحب، أيقونات بيضاء ===== */
  .tiles { display:flex; gap:10px; overflow-x:auto; padding:4px 0 12px; scrollbar-width:none; }
  .tiles::-webkit-scrollbar, .hs::-webkit-scrollbar { display:none; }
  .tile { flex:0 0 92px; width:92px; height:84px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:6px; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:14px; font-size:12px; font-weight:600; line-height:1.3; text-align:center; cursor:pointer; }
  .tile.on { border-color:var(--orange); color:var(--orange); }
  .tile span { overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .hs { display:flex; gap:12px; overflow-x:auto; padding-bottom:8px; scrollbar-width:none; }
  .hs > .card { flex:0 0 150px; }
  .cico { width:24px; height:24px; fill:none; stroke:#fff; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
  .tile .cico { width:26px; height:26px; }
  .ct-name { display:flex; align-items:center; gap:8px; }
  .ct-name.sub { font-weight:400; font-size:13px; }
  .ct-arrow { margin-inline-start:auto; color:var(--muted); }
  #resetSite { width:100%; margin-top:14px; }
  /* بطاقات المنتج: زر الإضافة في سطر كامل، والتفاصيل تحته، وبدون فراغ زائد أسفل البطاقة */
  .row2 { flex-direction:column; gap:6px; margin-top:8px; }
  .row2 button { width:100%; flex:none; }
  .pbody { padding:10px 12px 10px; }
  .dots { padding-top:6px; }
  .side-foot { margin-top:18px; text-align:center; color:#6b7a94; font-size:12px; }
  main { zoom:.92; }
  .ad { display:block; position:relative; margin:10px 0 4px; border-radius:18px; overflow:hidden; padding:18px 18px 16px; min-height:138px; background:linear-gradient(125deg,#17264a 0%,#25396a 58%,#c96a2a 130%); color:#fff; border:1px solid var(--line); }
  .ad .adtag { display:inline-block; font-size:11px; font-weight:800; letter-spacing:.04em; background:rgba(255,255,255,.14); border-radius:999px; padding:3px 10px; margin-bottom:8px; }
  .ad h2 { margin:0 0 4px; font-size:20px; line-height:1.35; text-wrap:balance; }
  .ad p { margin:0 0 12px; font-size:13px; opacity:.88; }
  .ad button { background:#111; color:#fff; border-radius:999px; padding:8px 16px; font-size:13px; }
  .cat-grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:6px 0 12px; }
  .cat-grid2 .tile { width:auto; height:96px; flex:none; }
  .pickrow-note { color:var(--muted); font-size:12px; margin:0 0 8px; }
  .sec-h h3 { white-space:nowrap; }
  #pmodal .modal.enter { animation: modalIn .32s ease; }
  @keyframes modalIn { from { opacity:0; transform:scale(.9) translateY(14px); } to { opacity:1; transform:none; } }
  .overlay { backdrop-filter:none; }
  /* ===== v29 ===== */
  .themebtn svg { width:22px; height:22px; }
  ::view-transition-old(root), ::view-transition-new(root) { animation:none; mix-blend-mode:normal; }
  .sk-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  @media (min-width:860px) { .sk-grid { grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; } }
  .sk-card { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; min-width:0; }
  .sk-img, .sk-l { background:linear-gradient(90deg,var(--card2) 25%,var(--line) 50%,var(--card2) 75%); background-size:200% 100%; animation:sk 1.3s linear infinite; }
  .sk-img { width:100%; aspect-ratio:1 / 1; }
  .sk-l { height:12px; border-radius:6px; margin:12px 12px 0; }
  .sk-l.w { width:80%; } .sk-l.s { width:50%; margin-bottom:14px; }
  @keyframes sk { from { background-position:200% 0; } to { background-position:-200% 0; } }
  @media (prefers-reduced-motion: reduce) { .sk-img, .sk-l { animation:none; } }
  .pbanners { display:grid; gap:10px; margin:12px 0 4px; }
  .pbanners.n2, .pbanners.n4 { grid-template-columns:1fr 1fr; }
  .pbanners.n3 { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .pb { display:flex; flex-direction:column; justify-content:flex-end; align-items:flex-start; gap:3px; min-width:0; min-height:118px; padding:12px; border-radius:14px; border:0; color:#fff; text-align:start; font-family:inherit; cursor:pointer; background:linear-gradient(135deg,var(--c1),var(--c2)); box-shadow:0 6px 16px rgba(0,0,0,.18); }
  .pb-t { font-size:15px; font-weight:800; line-height:1.3; overflow-wrap:anywhere; }
  .pb-s { font-size:12px; opacity:.92; }
  .pb-cta { margin-top:6px; background:#111; color:#fff; border-radius:999px; padding:4px 10px; font-size:12px; font-weight:700; }
  .pbanners.n3 .pb { min-height:96px; padding:10px; }
  .pbanners.n3 .pb-t { font-size:13px; }
  .pbanners.n3 .pb-cta { font-size:11px; padding:3px 8px; }
  .mtitle { transition:font-size .2s, color .2s; }
  #pmodal .modal { margin:auto; }
  .mtitle.morph { font-size:16px; color:var(--orange); }
  .card .pimg { cursor:pointer; }
  .opt-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .opt-row > div { min-width:0; }
  .opt-row select { margin-bottom:0; }
  .gateBox .pref-list { max-height:44vh; }
</style>
<script src="version.js"></script>
<script src="shared.js"></script>
<script src="ui.js"></script>
</head>
<body>

<div class="announce" id="announce"></div>
<header class="hd">
  <div class="hd-row">
    <button class="ic-btn menubtn" id="menuBtn" type="button" data-icon="menu" aria-label="menu"></button>
    <a class="logo" href="index.html" id="siteName">Showbiz</a>
    <div class="hd-acts">
      <button class="pref-btn" id="prefBtn" type="button"></button>
      <button class="ic-btn themebtn" id="themeBtn" type="button" aria-label="theme"></button>
      <button class="ic-btn" id="favBtn" type="button" data-icon="heart" aria-label="wishlist"></button>
      <div class="acctwrap">
        <button class="ic-btn" id="acctBtn" type="button" data-icon="user"></button>
        <div class="menu hidden" id="acctMenu">
          <div class="menu-who" id="menuWho"></div>
          <a href="account.html" id="menuInfo"></a>
          <a href="orders.html" id="menuOrders"></a>
          <a href="addresses.html" id="menuAddr"></a>
          <a href="delete-account.html" id="menuDel"></a>
          <button class="ghost menu-out" id="menuLogout"></button>
        </div>
      </div>
      <button class="ic-btn cartbtn" id="cartBtn" type="button" data-icon="cart" aria-label="cart"><span class="cartn" id="cartN">0</span></button>
    </div>
  </div>
  <div class="hd-row2">
    <div class="catdd" id="catDd">
      <button class="ghost" id="catBtn" type="button"></button>
      <div class="catpanel" id="catPanel"></div>
    </div>
    <div class="searchbox">
      <span class="s-ico" data-icon="search"></span>
      <input id="q" type="search" autocomplete="off">
      <div class="sugg hidden" id="sugg"></div>
    </div>
    <select id="sortSel"></select>
    <select id="countrySel" class="hidden"></select>
  </div>
</header>

<div class="sideov hidden" id="sideOv"></div>
<nav class="side hidden" id="side">
  <div class="side-head"><strong id="sideTitle"></strong><button class="ghost" id="sideX">✕</button></div>
  <div id="sideCats"></div>
  <button class="ghost" id="resetSite" type="button"></button>
  <div class="side-foot" id="sideFoot"></div>
</nav>

<main><div id="view"></div></main>
<div id="buildInfo" class="build"></div>
<div class="overlay hidden" id="pmodal"></div>
<div class="overlay hidden" id="gate">
  <div class="modal gateBox">
    <h3 id="gTitle"></h3>
    <div class="pref-lbl" id="gLangLbl"></div>
    <div class="pref-langs">
      <button class="ghost" data-glang="en" type="button">English</button>
      <button class="ghost" data-glang="ar" type="button">العربية</button>
    </div>
    <div class="pref-lbl" id="gCurLbl"></div>
    <div id="gCur" class="pref-list"></div>
    <button id="gGo" type="button" style="width:100%;margin-top:14px"></button>
  </div>
</div>

<div class="overlay hidden" id="prefModal">
  <div class="modal">
    <button class="xbtn" id="prefX" type="button" aria-label="close">✕</button>
    <h3 id="prefTitle"></h3>
    <div class="pref-lbl" id="prefLangLbl"></div>
    <div class="pref-langs">
      <button class="ghost" data-glang="en" type="button">English</button>
      <button class="ghost" data-glang="ar" type="button">العربية</button>
    </div>
    <div class="pref-lbl" id="prefCurLbl"></div>
    <div id="prefCur" class="pref-list"></div>
  </div>
</div>

  const sessionHint = () => Object.keys(localStorage).some(k => k.startsWith("sb-") && k.endsWith("-auth-token"));

  // ===== مساعدات =====

  function toast(msg) {

  // الذهاب لصفحة الدخول مع تذكّر الصفحة الحالية، وبعد الدخول يرجع لنفس المكان
  function goLogin() {

    location.href = "login.html";
  }

  function fmtFor(code, amount) {
    const c = COUNTRIES[code] || COUNTRIES[state.country];
    const n = Number(amount).toFixed(c.dec);
    return state.lang === "ar" ? `${n} ${c.sym.ar}` : `${c.sym.en} ${n}`;
  }
  const fmt = (amount) => fmtFor(state.country, amount);
  const variantLabel = (v) => (state.lang === "ar" && v.keyAr) ? v.keyAr : (v.key ? String(v.key).replace(/-/g, " · ") : t("defaultVariant"));
  // اسم ووصف المنتج حسب اللغة المختارة
  const pName = (p) => (state.lang === "ar" && p.nameAr) ? p.nameAr : p.nameEn;
  const pDesc = (p) => (state.lang === "ar" && p.descAr) ? p.descAr : (p.descEn || "");

  function stripHTML(html) {
    if (!html) return "";
    const doc = new DOMParser().parseFromString(String(html), "text/html");
    return (doc.body.textContent || "").replace(/\s+/g, " ").trim();
  }
  function findVariant(vid) {
    for (const p of products) {
      const v = p.variants.find(x => x.vid === vid);
      if (v) return { p, v };
    }
    return null;
  }
  function cartLines() {
    return state.cart
      .map(i => { const f = findVariant(i.vid); return f ? { vid: i.vid, qty: i.qty, p: f.p, v: f.v } : null; })

  const cartCount = () => cartLines().reduce((s, l) => s + l.qty, 0);

  const isSelected = (l) => !(state.unsel || []).includes(l.vid);
  const selLines = () => cartLines().filter(isSelected);
  const subtotalUSD = () => selLines().reduce((s, l) => s + l.v.price * l.qty, 0);
  const discountUSD = () => subtotalUSD() * (COUPONS[state.coupon] || 0);

  // ===== العناوين المحفوظة (من صفحة عناويني) =====

  function allAddresses() {
    if (!me) return [];
    try { return JSON.parse(localStorage.getItem("showbiz_addr2_" + me.id) || "[]"); } catch (e) { return []; }
  }

    return allAddresses().filter(a => COUNTRIES[a.country]);

    return savedAddresses().find(a => a.id === state.addrId) || null;
  }
  function addrText(a) {
    const names = (a.path || []).map(id => {
      const n = findNode(id);
      return n ? (state.lang === "en" && n.en ? n.en : n.ar) : id;
    }).join(" ← ");
    const f = a.fields || {};
    const parts = [names];
    if (f.building) parts.push(f.building);
    if (f.street) parts.push(f.street);
    if (f.complex) parts.push(f.complex);
    if (f.flat) parts.push(f.flat);
    if (f.makani) parts.push("Makani " + f.makani);
    if (f.pobox) parts.push("PO " + f.pobox);
    return parts.join(" · ");
  }

  // ===== الحاسبة =====
  function shippingCalc() {
    let actualKg = 0, volKg = 0;
    selLines().forEach(l => {
      const w = (l.v.weightG || l.p.weightG || 500) / 1000;
      const d = l.v.dimsCm || l.p.dimsCm || [10, 10, 10];
      actualKg += w * l.qty;
      volKg += (d[0] * d[1] * d[2] / 5000) * l.qty;
    });
    const chargeable = Math.max(actualKg, volKg);
    const orderBHD = (subtotalUSD() - discountUSD()) * RATE_BHD;
    // التوصيل مجاني فوق الحد المحدد في ui.js
    const shipBHD = ShowbizUI.isFree() ? 0
      : COUNTRIES[state.country].base + Math.max(0, chargeable - 1) * 0.5;
    const riskBHD = Math.max(orderBHD * 0.15, 0.3);
    return { actualKg, volKg, chargeable, shipBHD, riskBHD };
  }
  const shipLocal = (bhd) => bhd * (COUNTRIES[state.country].rate / RATE_BHD);

  // ===== تحميل المنتجات =====
  // يقبل أي شكل قائمة من السيرفر، ويعرض سبب الفشل أسفل الصفحة للتشخيص
  // يدعم شكل CJ الخام (productId, bigImage, sellPrice "15.45-16.41") وشكلنا المعدّل
  const firstNum = (v) => { const n = parseFloat(String(v ?? "").split("-")[0]); return isNaN(n) ? null : n; };
  function normalizeProduct(p) {
    const pid = p.pid ?? p.productId ?? p.id;
    const image = p.image || p.bigImage || "";
    const weightG = p.weightG || firstNum(p.weight);
    const dimsCm = p.dimsCm || (Array.isArray(p.lengthList) && p.lengthList[0]
      ? [firstNum(p.lengthList[0]), firstNum(p.widthList?.[0]) || 10, firstNum(p.heightList?.[0]) || 10] : null);
    let variants = (Array.isArray(p.variants) ? p.variants : [])
      .map(v => ({ ...v, price: Number(v.price) }))
      .filter(v => v.vid && !isNaN(v.price));
    if (!variants.length) {
      const base = firstNum(p.sellPrice ?? p.price);
      if (base !== null) variants = [{ vid: p.vid || ("base-" + pid), key: "", sku: p.sku, price: base, image, weightG, dimsCm }];
    }
    const images = (Array.isArray(p.images) && p.images.length) ? p.images : [image].filter(Boolean);
    return { ...p, pid, nameEn: p.nameEn || p.name || "", image, images, weightG, dimsCm, variants };
  }
  // يبحث عن قائمة المنتجات مهما كان شكل الرد
  function findList(d) {
    if (Array.isArray(d)) return d;

    return cands.find(Array.isArray) || [];

  let usingDemo = false;
  // حالة الأقسام والفلاتر
  let filt = { cat: null, q: "", sort: "default" };
  let openCats = new Set();

  async function loadProducts() {
    loadError = false; loadMsg = "";
    // مرحلة التجربة: منتجات وهمية دائماً، ولا يتم جلب أي منتجات من الـ API أو CJ.
    // لرجوع الجلب الحقيقي: احذف هذا البلوك فقط.
    if (window.SHOWBIZ_DEMO) {
      products = window.SHOWBIZ_DEMO.products.map(normalizeProduct);
      usingDemo = true;
      rawCount = products.length;
      loadMsg = "وضع تجريبي (منتجات وهمية)";
      buildCatRoot();
      loaded = true;
      render();
      openFromUrl();
      return;
    }
    try {
      const res = await fetch(WORKER_URL + "?action=list", { cache: "no-store" });
      if (!res.ok) loadMsg = "HTTP " + res.status;
      const text = await res.text();
      let d = null;
      try { d = JSON.parse(text); } catch (e) { loadMsg = loadMsg || ("الرد مو JSON: " + text.slice(0, 120)); }
      if (d) {
        if (d.success === false || (d.code !== undefined && Number(d.code) !== 200)) {
          loadMsg = String(d.message || ("code " + d.code));
        }
        const list = findList(d);
        rawCount = list.length;
        products = list.map(normalizeProduct).filter(p => p.variants.length > 0);
        if (!products.length && !loadMsg) {
          loadMsg = rawCount ? "المنتجات وصلت بس ما انقرأ فيها سعر أو رقم" : "الرد ما فيه قائمة منتجات";
        }
      } else {
        products = [];
      }
    } catch (e) {
      console.error("loadProducts:", e);
      loadError = true;
      loadMsg = String(e && e.message || e);
      products = [];
    }
    usingDemo = false;
    if (!products.length && window.SHOWBIZ_DEMO) {
      products = window.SHOWBIZ_DEMO.products.map(normalizeProduct);
      usingDemo = true;
      loadError = false;
      loadMsg = "وضع تجريبي (منتجات وهمية)";
    }
    buildCatRoot();
    loaded = true;
    render();
    openFromUrl();
  }
  function openFromUrl() {
    let pid = null;
    try { pid = new URLSearchParams(location.search).get("open"); } catch (e) {}
    if (!pid) return;
    const p = products.find(x => String(x.pid) === String(pid));
    if (p) { history.replaceState(null, "", "index.html"); openProduct(p.pid); }
  }

  // ===== الحساب =====
  // يقرأ الجلسة، وإذا بيانات العميل ناقصة يكملها من بيانات الحساب
  // يقرأ المستخدم من مكتبة Supabase، وإذا ما رجّعت شي والتوكن موجود في المتصفح يعيد المحاولة
  // ثم يقرأ المستخدم من التوكن نفسه (عشان العناوين المحفوظة تظهر في الإتمام)
  async function readSessionUser() {
    try { const { data } = await sb.auth.getSession(); return data?.session?.user || null; } catch (e) { return null; }
  }
  function userFromStoredToken() {
    try {
      const key = Object.keys(localStorage).find(k => k.startsWith("sb-") && k.endsWith("-auth-token"));
      const o = key ? JSON.parse(localStorage.getItem(key)) : null;
      return (o && o.user && o.user.id) ? o.user : null;
    } catch (e) { return null; }
  }
  async function loadProfile() {
    me = null; profile = null;
    // انتهاء الجلسة بعد ساعتين: يسجل الخروج تلقائياً
    await ShowbizCore.enforceLogin(sb);
    me = await readSessionUser();
    if (!me && sessionHint()) {
      await new Promise(r => setTimeout(r, 800));
      me = await readSessionUser();
    }
    if (!me && sessionHint()) me = userFromStoredToken();
    if (me) await ShowbizCore.fetchAddresses(sb, me.id);
    sessionChecked = true;
    // جاي من صفحة العناوين بعد الحفظ: نختار العنوان الجديد تلقائياً
    const pick = localStorage.getItem("showbiz_pick_addr");
    if (pick) {
      localStorage.removeItem("showbiz_pick_addr");
      const pa = allAddresses().find(x => x.id === pick);
      if (pa) { state.addrId = pa.id; state.country = pa.country; save(); }
    }
    if (me) {
      try {
        const { data } = await sb.from("customers").select("*").eq("id", me.id).maybeSingle();
        profile = data || null;
        if (!profile) {
          const md = me.user_metadata || {};
          const row = {
            id: me.id, email: me.email || null,
            first_name: md.first_name || null, last_name: md.last_name || null,
            phone: me.phone ? "+" + String(me.phone).replace(/^\+/, "") : null
          };
          const { error } = await sb.from("customers").upsert(row);
          if (!error) profile = row;
        }
      } catch (e) {}
    }
    // الدولة المفضلة المحفوظة في الحساب تنطبق تلقائيًا
    const pref = me?.user_metadata?.preferred_country;
    if (pref && COUNTRIES[pref] && pref !== state.country) { state.country = pref; state.addrId = null; save(); }
  }
  async function loadOrders() {

    if (!addr) { msg.textContent = t("pickAddrErr"); return; }
    if (!me) { goLogin(); return; }

    const s = shippingCalc();
    const subtotal = localPrice(subtotalUSD());
    const discount = localPrice(discountUSD());
    const ship = shipLocal(s.shipBHD);
    const row = {
      user_id: me.id, country: state.country, status: "test-not-sent-to-cj",
      items: cartLines().map(l => ({ pid: l.p.pid, vid: l.vid, sku: l.v.sku, name: l.p.nameEn, variant: l.v.key, qty: l.qty, unitUSD: l.v.price })),

        phone: addr.phone, recipient: addr.recipient || "", path: addr.path || []
      },
      contact: { name: `${profile?.first_name || ""} ${profile?.last_name || ""}`.trim(), phone: profile?.phone || null },
      coupon: state.coupon, subtotal, discount, shipping: ship,
      total: subtotal - discount + ship, internal_risk_bhd: s.riskBHD
    };

    lastSaveOk = false;
    try {
      const { error } = await sb.from("orders").insert(row);
      if (!error) lastSaveOk = true; else console.warn(error);

  // ===== المتجر: الأقسام (رئيسية وفرعية) والفلاتر والبحث =====
  // مسار المنتج: من catPath (الوهمي) أو من categoryName (الحقيقي، قسم واحد)
  function productPath(p) {
    if (Array.isArray(p.catPath) && p.catPath.length) return p.catPath.map(String);
    if (typeof p.categoryName === "string" && p.categoryName) return [p.categoryName];
    if (typeof p.category === "string" && p.category) return [p.category];
    return [];
  }
  function catOf(p) { return productPath(p)[0] || null; }
  function catLabel(id) {
    const L = window.SHOWBIZ_DEMO && window.SHOWBIZ_DEMO.labels[id];
    return L ? (L[state.lang] || L.en) : id;
  }
  function crumbs(key) { return String(key).split("/").map(catLabel).join(" › "); }
  function minUSD(p) { return Math.min(...p.variants.map(v => v.price)); }
  // أرخص سعر للمنتج (الخيار الأساسي) والفرق لكل لون أو مقاس عنه
  function cheapOf(p) { return Math.min(...p.variants.map(v => v.price)); }
  // السعر يتبع المقاس فقط: أقل سعر بين الخيارات اللي فيها المقاس المختار (اللون ما يغيّر السعر)
  function sizePriceUSD(p) {
    if (!modal || !modal.size) return null;
    const arr = p.variants.filter(x => x.opt.size.en === modal.size);
    return arr.length ? Math.min(...arr.map(x => x.price)) : null;
  }
  function optTag(p, key, o) {
    const d = Math.min(...p.variants.filter(x => x.opt[key].en === o.en).map(x => x.price)) - cheapOf(p);
    if (d <= 0) return "";
    return " · +" + fmt(localPrice(d));
  }
  function allItems(n) { return [...n.direct, ...n.kids.flatMap(allItems)]; }
  function inCat(p, key) { const k = productPath(p).join("/"); return k === key || k.startsWith(key + "/"); }
  function ensureNode(list, parent, id) {
    let n = list.find(x => x.id === id);
    if (!n) { n = { id, key: parent ? parent.key + "/" + id : id, kids: [], direct: [] }; list.push(n); }
    return n;
  }
  // يبني الشجرة: ترتيب الأقسام من شجرة الوهمي (إذا وضع ?demo=1)، وبعدين أي قسم ثاني من المنتجات
  function buildCatRoot() {
    catRoot = { kids: [], uncat: [] };
    const schema = usingDemo && window.SHOWBIZ_DEMO ? window.SHOWBIZ_DEMO.tree : null;
    (function addSchema(list, parent, arr) {
      (arr || []).forEach(s => { const n = ensureNode(list, parent, s.id); addSchema(n.kids, n, s.children); });
    })(catRoot.kids, null, schema);
    products.forEach(p => {
      const path = productPath(p);
      if (!path.length) { catRoot.uncat.push(p); return; }
      let list = catRoot.kids, parent = null, node = null;
      path.forEach(seg => { node = ensureNode(list, parent, seg); parent = node; list = node.kids; });
      node.direct.push(p);
    });
  }
  function nodeByKey(key) {
    let list = catRoot.kids, n = null;
    for (const seg of String(key).split("/")) { n = list.find(x => x.id === seg); if (!n) return null; list = n.kids; }
    return n;
  }
  function filteredProducts() {
    const q = filt.q.trim().toLowerCase();
    let list = products.filter(p => {
      if (filt.cat === SALE && !(cmpUSD(p) > 0)) return false;
      if (filt.cat && filt.cat !== ALL && filt.cat !== SALE && !inCat(p, filt.cat)) return false;
      if (q && !(String(p.nameEn) + " " + String(p.nameAr || "")).toLowerCase().includes(q)) return false;
      return true;
    });
    return sortItems(list);
  }
  // الترتيب يطبّق على أي قائمة منتجات ظاهرة (الصفحة الرئيسية والفئات) بدون ما ينقل لصفحة ثانية
  function sortItems(list) {
    const s = filt.sort;
    if (!s || s === "default") return list;
    const c = list.slice();
    if (s === "asc") c.sort((a, b) => minUSD(a) - minUSD(b));
    else if (s === "desc") c.sort((a, b) => minUSD(b) - minUSD(a));
    else if (s === "name") c.sort((a, b) => pName(a).localeCompare(pName(b)));
    else if (s === "nameDesc") c.sort((a, b) => pName(b).localeCompare(pName(a)));
    return c;
  }
  // سعر قبل الخصم (إذا المنتج فيه compareAt أعلى من السعر الحالي)
  function cmpUSD(p) {

  // ===== حركات الإضافة للسلة وفتح التفاصيل =====
  const reduceMotion = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function bounceEl(el, cls) {
    if (!el || reduceMotion()) return;
    el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
    setTimeout(() => el.classList.remove(cls), 500);
  }
  // المنتج يطير بمنحنى (Bezier) لحد الهدف (السلة أو المفضلة)، ويصغر، وبعدين ينشال وتنط الأيقونة
  function flyTo(srcEl, imgSrc, targetEl, done, withPlus) {
    if (!srcEl || !targetEl || !imgSrc || reduceMotion()) { done(); return; }
    const s = srcEl.getBoundingClientRect(), e = targetEl.getBoundingClientRect();
    const sx = s.left + s.width / 2, sy = s.top + s.height / 2;
    const ex = e.left + e.width / 2, ey = e.top + e.height / 2;
    const cx = (sx + ex) / 2, cy = Math.min(sy, ey) - 150;
    const fly = document.createElement("div");
    fly.className = "fly";
    fly.innerHTML = `<img src="${esc(imgSrc)}" alt="">`;
    document.body.appendChild(fly);
    const dur = 650, t0 = performance.now();
    let finished = false;
    const finish = () => {
      if (finished) return; finished = true;
      fly.remove();
      bounceEl(targetEl, "bounce");
      if (withPlus) {
        const plus = document.createElement("span");
        plus.className = "plus1"; plus.textContent = "+1";
        plus.style.left = (ex - 16) + "px"; plus.style.top = (e.top - 26) + "px";
        document.body.appendChild(plus);
        setTimeout(() => plus.remove(), 700);
      }
      done();
    };
    const step = (now) => {
      const t = Math.min(1, (now - t0) / dur);
      const k = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; // easeInOut
      const x = (1 - k) * (1 - k) * sx + 2 * (1 - k) * k * cx + k * k * ex;
      const y = (1 - k) * (1 - k) * sy + 2 * (1 - k) * k * cy + k * k * ey;
      const scale = 1 - 0.6 * k;
      fly.style.transform = `translate(${x - 32}px, ${y - 32}px) scale(${scale})`;
      if (t < 1) requestAnimationFrame(step); else finish();
    };
    requestAnimationFrame(step);
    setTimeout(finish, dur + 200); // حماية: ما يتعلق أبداً
  }
  function flyToCart(srcEl, imgSrc, done) {
    flyTo(srcEl, imgSrc, document.getElementById("cartBtn"), done, true);
  }
  // فتح التفاصيل: صورة المنتج تطير من البطاقة لمكانها الكبير (مثل Hero)
  function heroOpen(pid, srcImg) {
    const r0 = srcImg.getBoundingClientRect(), src = srcImg.src;
    openProduct(pid);
    const mi = document.getElementById("mImg");
    if (!mi || reduceMotion()) return;
    const r1 = mi.getBoundingClientRect();
    const fl = document.createElement("img");
    fl.className = "hero-fly"; fl.src = src; fl.alt = "";
    fl.style.cssText = `left:${r0.left}px;top:${r0.top}px;width:${r0.width}px;height:${r0.height}px;transition:none`;
    document.body.appendChild(fl);
    mi.style.opacity = "0";
    requestAnimationFrame(() => requestAnimationFrame(() => {
      fl.style.transition = "all .45s ease";
      fl.style.left = r1.left + "px"; fl.style.top = r1.top + "px";
      fl.style.width = r1.width + "px"; fl.style.height = r1.height + "px";
    }));
    setTimeout(() => { fl.remove(); if (mi.isConnected) mi.style.opacity = ""; }, 480);
  }

  // فتح التفاصيل من البطاقة: الصورة تطير لمكانها الكبير، وإذا ما فيه صورة يفتح مباشرة

  async function handleAction(a, ds) {
    if (a === "open") { openFromCard(ds.pid); return; }
    if (a === "quickAdd") {
      const p = products.find(x => x.pid === ds.pid);

      if (p.variants.length === 1) {
        const btn = document.querySelector(`[data-action="quickAdd"][data-pid="${CSS.escape(String(p.pid))}"]`);

      return;
    }
    if (a === "closeModal") { modal = null; renderModal(); return; }
    if (a === "wish") {
      const p = products.find(x => String(x.pid) === String(ds.pid));
      if (!p) return;
      const toggle = () => ShowbizUI.toggleWish(p.pid, ShowbizUI.entryOf(p, p.variants[0]));
      const wasWished = ShowbizUI.wishedPids().includes(String(p.pid));
      const img = document.getElementById("c-" + p.pid);
      const fav = document.getElementById("favBtn");
      if (!img || !fav) { toggle(); return; }
      if (!wasWished) flyTo(img, img.src, fav, toggle, false);      // إضافة: الصورة تطير لأيقونة المفضلة
      else flyTo(fav, img.src, img, toggle, false);                 // إزالة: تطير بالعكس من المفضلة لمكان المنتج
      return;
    }
    if (a === "mprev" || a === "mnext") {
      const c = curModal(); if (!c) return;
      const g = galleryFor(c.p, c.v);
      modal.idx = (modal.idx + (a === "mnext" ? 1 : -1) + g.length) % g.length;
      modal.paused = true; renderModal(); return;
    }
    if (a === "mqinc") { if (modal.qty < 99) modal.qty++; renderModal(); return; }
    if (a === "mqdec") { if (modal.qty > 1) modal.qty--; renderModal(); return; }
    if (a === "mdetails") { modal.details = true; renderModal(); return; }
    if (a === "mback") { modal.details = false; renderModal(); return; }
    if (a === "inc" || a === "dec" || a === "rm") {
      const i = state.cart.find(x => x.vid === ds.vid);
      if (!i) return;
      if (a === "inc") i.qty++;
      if (a === "dec") i.qty--;
      if (a === "rm" || i.qty <= 0) state.cart = state.cart.filter(x => x.vid !== ds.vid);
      save(); render(); return;
    }
    if (a === "applyCoupon") { applyCoupon(); return; }
    if (a === "removeCoupon") { state.coupon = null; save(); render(); return; }
    if (a === "cart") { location.href = "cart.html"; return; }
    if (a === "shop") { go("shop", ""); return; }
    if (a === "login") { goLogin(); return; }
    if (a === "checkout") {
      if (!cartCount()) return;
      location.href = "cart.html#checkout"; return;
    }
    if (a === "addAddr") {
      // نرجع للطلب بعد ما يحفظ العنوان: index.html يقرا showbiz_next عند الفتح
      localStorage.setItem("showbiz_next", "checkout");
      localStorage.setItem("showbiz_open_add", "1");
      location.href = "addresses.html";
      return;
    }
    if (a === "confirm") { await confirmOrder(); return; }
    if (a === "account") {
      if (!me) { goLogin(); return; }
      view = "account"; render(); loadOrders(); return;
    }
    if (a === "saveProfile") {
      const first = document.getElementById("pFirst").value.trim();
      const last = document.getElementById("pLast").value.trim();
      const m = document.getElementById("pMsg");
      if (!first || !last) { m.textContent = t("namesReq"); return; }
      const { error } = await sb.from("customers").update({ first_name: first, last_name: last }).eq("id", me.id);
      if (error) { m.textContent = error.message; return; }
      await loadProfile();
      m.textContent = t("saved");
      return;
    }
    if (a === "logout") {
      // نمسح الجلسة من المتصفح أولاً (ما ننتظر أي طلب شبكة)، وبعدين نطلع من المكتبة
      try { Object.keys(localStorage).forEach(k => { if (k.startsWith("sb-") && k.endsWith("-auth-token")) localStorage.removeItem(k); }); } catch (e) {}
      ShowbizCore.clearLogin();
      me = null; profile = null; accountOrders = null;
      go("shop", "");
      try { sb.auth.signOut({ scope: "local" }).catch(() => {}); } catch (e) {}
      return;
    }
  }

  document.getElementById("view").addEventListener("click", (e) => {
    const b = e.target.closest("[data-action]");
    if (b && !b.disabled) handleAction(b.dataset.action, b.dataset);
  });
  document.getElementById("view").addEventListener("change", (e) => {
    if (e.target.name === "addr") {
      state.addrId = e.target.value; save();
      const picked = selectedAddr();
      // العنوان يحدد الدولة تلقائياً (مثلاً عنوان سعودي يفتح السعودية)
      if (picked && picked.country !== state.country) state.country = picked.country;
      save(); render();
    }
  });
  document.getElementById("pmodal").addEventListener("click", (e) => {
    if (e.target.id === "pmodal") { modal = null; renderModal(); return; }
    if (e.target.id === "mAdd") {
      const c = curModal(); if (!c || !c.v) return;
      const mi = document.getElementById("mImg");
      const vid = c.v.vid, qty = modal.qty;
      flyToCart(mi, mi ? mi.src : "", () => { addLine(vid, qty); modal = null; render(); });
      return;
    }
    const b = e.target.closest("[data-action]");
    if (b) handleAction(b.dataset.action, b.dataset);
  });
  document.getElementById("pmodal").addEventListener("change", (e) => {
    if (!modal) return;
    if (e.target.id === "mVariant") { modal.vid = e.target.value; modal.idx = 0; modal.paused = true; renderModal(); }
    if (e.target.id === "mColor") { modal.color = e.target.value || null; modal.idx = 0; modal.paused = true; renderModal(); }
    if (e.target.id === "mSize") { modal.size = e.target.value || null; modal.idx = 0; modal.paused = true; renderModal(); }
  });

  // تغيير الدولة من الهيدر: يتحفظ كدولة مفضلة لو الزائر مسجل دخول
  async function changeCountry(code) {
    state.country = code; state.addrId = null; save();
    if (me) { try { await sb.auth.updateUser({ data: { preferred_country: code } }); } catch (e) {} }
    render();
  }
  document.getElementById("countrySel").addEventListener("change", (e) => changeCountry(e.target.value));
  document.getElementById("gCur").addEventListener("click", (e) => {
    const b = e.target.closest("[data-cur]");
    if (b) changeCountry(b.dataset.cur);
  });
  document.querySelectorAll("[data-glang]").forEach(btn => {
    btn.addEventListener("click", () => { state.lang = btn.dataset.glang; save(); render(); });
  });
  document.getElementById("gGo").addEventListener("click", () => { state.seen = true; save(); try { sessionStorage.setItem("showbiz_gate_ok", "1"); } catch (e) {} render(); });
  // زر السلة يفتح اللوحة الجانبية (بدون ما يغادر الصفحة)
  document.getElementById("cartBtn").addEventListener("click", () => { ShowbizUI.open(); });
  document.getElementById("favBtn").addEventListener("click", () => { ShowbizUI.open("wish"); });
  // نافذة التفضيلات: اللغة والعملة
  function openPref(on) { document.getElementById("prefModal").classList.toggle("hidden", !on); }
  document.getElementById("prefBtn").addEventListener("click", () => openPref(true));
  document.getElementById("prefX").addEventListener("click", () => openPref(false));
  document.getElementById("prefModal").addEventListener("click", (e) => { if (e.target.id === "prefModal") openPref(false); });
  document.getElementById("prefCur").addEventListener("click", (e) => {
    const b = e.target.closest("[data-cur]");
    if (!b) return;
    changeCountry(b.dataset.cur);
    openPref(false);
  });
  function renderPrefs() {
    const L = state.lang === "en"
      ? { title: "Preferences", lang: "Language", cur: "Currency" }
      : { title: "التفضيلات", lang: "اللغة", cur: "العملة" };
    document.getElementById("prefTitle").textContent = L.title;
    document.getElementById("prefLangLbl").textContent = L.lang;
    document.getElementById("prefCurLbl").textContent = L.cur;
    const curHTML = Object.entries(COUNTRIES).map(([code, c]) => `
      <button class="pref-item ${code === state.country ? "on" : ""}" data-cur="${code}" type="button">
        <span>${c.flag} ${esc(c.name[state.lang])}</span>
        <strong>${esc(c.sym.ar)} · ${c.iso}</strong>
      </button>`).join("");
    document.getElementById("prefCur").innerHTML = curHTML;
    document.getElementById("gCur").innerHTML = curHTML;
    document.querySelectorAll("[data-glang]").forEach(b => b.classList.toggle("on", b.dataset.glang === state.lang));
  }

  // ===== المتجر: أقسام، بحث، فلاتر، قائمة الجوال =====
  document.addEventListener("click", (e) => {
    const ci = e.target.closest(".card .pimg img");
    if (ci && ci.id && ci.id.startsWith("c-")) { heroOpen(ci.id.slice(2), ci); return; }
    const tg = e.target.closest("[data-tog]");
    if (tg) {
      const k = tg.dataset.tog;
      if (openCats.has(k)) openCats.delete(k); else openCats.add(k);
      document.getElementById("catPanel").innerHTML = catLinksHTML();
      document.getElementById("sideCats").innerHTML = catLinksHTML();
      return;
    }
    const hm = e.target.closest("[data-home]");
    if (hm && hm.closest("#catPanel, #sideCats, #shopBody")) { catsGrid = false; setCat(null); return; }
    const c = e.target.closest("[data-cat]");
    if (c && c.closest("#shopBody, #catPanel, #sideCats")) { setCat(c.dataset.cat || null); return; }
    const cs = e.target.closest("[data-cats]");
    if (cs) { catsGrid = cs.dataset.cats === "all"; refreshShop(); window.scrollTo(0, 0); return; }
    const cl = e.target.closest("[data-clear]");
    if (cl) { clearFilters(); return; }
    const qb = e.target.closest("[data-q]");
    if (qb) {
      filt.q = qb.dataset.q; document.getElementById("q").value = filt.q;
      refreshShop(); renderSugg(); return;
    }
    const op = e.target.closest("[data-openp]");
    if (op) {
      ShowbizUI.pushSearch(filt.q);
      document.getElementById("sugg").classList.add("hidden");
      openProduct(op.dataset.openp); return;
    }
    if (!e.target.closest(".searchbox")) document.getElementById("sugg").classList.add("hidden");
    if (!e.target.closest("#catDd")) document.getElementById("catDd").classList.remove("open");
  });
  document.getElementById("catBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    document.getElementById("catDd").classList.toggle("open");
  });
  document.getElementById("menuBtn").addEventListener("click", () => {
    document.getElementById("side").classList.remove("hidden");
    document.getElementById("sideOv").classList.remove("hidden");
  });
  document.getElementById("sideX").addEventListener("click", closeMenus);
  // تصفير الموقع: يرجع يطلب اللغة والدولة والعملة من جديد. السلة ما تنمسح.
  document.getElementById("resetSite").addEventListener("click", () => {
    state.seen = false; save();
    try { sessionStorage.removeItem("showbiz_gate_ok"); } catch (e) {}
    closeMenus(); render();
  });
  document.getElementById("sideOv").addEventListener("click", closeMenus);
  const qEl = document.getElementById("q");
  qEl.addEventListener("input", () => { filt.q = qEl.value; refreshShop(); renderSugg(); });
  qEl.addEventListener("focus", renderSugg);
  qEl.addEventListener("keydown", (e) => { if (e.key === "Enter") { ShowbizUI.pushSearch(qEl.value); document.getElementById("sugg").classList.add("hidden"); } });
  document.getElementById("sortSel").addEventListener("change", (e) => { filt.sort = e.target.value; refreshShop(); });
  // تحديث السلة الجانبية وعدّاد الهيدر عند أي تغيير
  document.addEventListener("cartchange", () => render());
  // زر "حسابي" يفتح قائمة منسدلة، وما يرجع لصفحة الدخول إلا إذا ما فيه جلسة
  const acctMenu = document.getElementById("acctMenu");
  document.getElementById("acctBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    if (isLoggedIn()) acctMenu.classList.toggle("hidden");
    else goLogin();
  });
  document.addEventListener("click", (e) => {
    if (!e.target.closest(".acctwrap")) acctMenu.classList.add("hidden");
  });
  document.getElementById("menuLogout").addEventListener("click", () => {
    acctMenu.classList.add("hidden");
    handleAction("logout", {});
  });

  // تبديل الصور كل 5 ثواني
  setInterval(() => {
    if (modal && !modal.paused && !modal.details) {
      const c = curModal();
      if (c) {
        const g = galleryFor(c.p, c.v);
        if (g.length > 1) {
          modal.idx = (modal.idx + 1) % g.length;
          const img = document.getElementById("mImg");
          if (img) img.src = g[modal.idx];
          document.querySelectorAll("#pmodal .dot").forEach((el, i) => el.classList.toggle("on", i === modal.idx));
        }
      }
    }
    products.forEach(p => {
      if (p.images.length > 1) {
        cardIdx[p.pid] = ((cardIdx[p.pid] || 0) + 1) % p.images.length;
        const img = document.getElementById("c-" + p.pid);
        if (img) img.src = p.images[cardIdx[p.pid]];
        document.querySelectorAll(`[data-cd="${p.pid}"]`).forEach((el, i) => el.classList.toggle("on", i === cardIdx[p.pid]));
      }
    });
  }, SLIDE_MS);

  // تحديث صفحة الإتمام تلقائياً إذا تغيّرت العناوين من صفحة ثانية أو تبويب ثاني
  // (مثلاً أضفت عنوان في عناويني ورجعت للسلة)
  window.addEventListener("storage", (e) => {
    if (e.key && e.key.startsWith("showbiz_addr2_")) render();
  });
  window.addEventListener("pageshow", () => render());
  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

  // تغيّر الجلسة (دخول أو خروج من صفحة أخرى)
  sb.auth.onAuthStateChange(async (event) => {
    if (event === "SIGNED_OUT") { me = null; profile = null; render(); return; }
    await loadProfile();
    render();
  });

  // ===== البدء =====
  render();
  (async () => {
    await loadProfile();
    // نرجع الزائر للصفحة اللي كان فيها قبل الدخول أو قبل إضافة العنوان (السلة أو إتمام الطلب)
    const next = localStorage.getItem("showbiz_next");
    localStorage.removeItem("showbiz_next");
    if (me && (next === "checkout" || next === "cart") && cartCount()) {
      location.replace(next === "checkout" ? "cart.html#checkout" : "cart.html");
      return;
    }
    render();
  })();
  ShowbizUI.setDetailsHandler((pid) => {
    const p = products.find(x => String(x.pid) === String(pid));
    if (p) openProduct(p.pid);
  });
  // الوضع الفاتح/الداكن: الدائرة تبدأ من الزر وتكبر على الشاشة (مثل Telegram)
  const themeBtn = document.getElementById("themeBtn");
  const MOON = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  const SUN = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const curTheme = () => ShowbizCore.theme();
  function paintThemeBtn() { if (themeBtn) themeBtn.innerHTML = curTheme() === "light" ? MOON : SUN; }
  window.__sbFly = (src, img, tgt, done) => flyTo(src, img, tgt, done, false);
  paintThemeBtn();
  if (themeBtn) themeBtn.addEventListener("click", () => { ShowbizCore.setTheme(curTheme() === "light" ? "dark" : "light", themeBtn); setTimeout(paintThemeBtn, 280); });

  loadProducts();
</script>
</body>
</html>
