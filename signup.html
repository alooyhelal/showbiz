  .msg.info { color:var(--info); background:var(--card2); border:1px solid var(--line); }
  .msg.ok { color:var(--ok); background:var(--okbg); border:1px solid var(--okline); }
  .toast { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:var(--card); color:var(--ok); border:1px solid var(--okline); padding:16px 26px; border-radius:14px; font-size:17px; font-weight:700; box-shadow:0 12px 30px rgba(0,0,0,.4); z-index:50; max-width:90vw; text-align:center; }

  .strength i { height:6px; border-radius:4px; background:var(--line); transition:background .2s; }
  .strength i.on { background:#2f8f5f; }
  .hint { font-size:12px; color:var(--muted); margin-top:6px; line-height:1.6; }
  .resend-cd { opacity:.6; cursor:default; text-decoration:none; }
  .okpop { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:min(88vw,340px); background:var(--card); border:1px solid var(--okline); border-radius:20px; box-shadow:0 18px 40px rgba(0,0,0,.45); padding:22px 20px; text-align:center; z-index:50; animation:okIn .35s cubic-bezier(.22,.8,.2,1) both; }

  .okpop .ok-t { color:var(--fg); font-weight:800; font-size:17px; line-height:1.6; }
  @keyframes okIn { from { opacity:0; transform:translate(-50%,-46%) scale(.96); } to { opacity:1; transform:translate(-50%,-50%) scale(1); } }
  .ver { text-align:center; color:var(--muted); font-size:12px; margin-top:18px; direction:ltr; }
</style>

  // v42: طول الجوال والمثال حسب الدولة، وقوة كلمة المرور
  const codeByDial = (d) => Object.keys(ShowbizFlags.DIAL).find(c => ShowbizFlags.DIAL[c] === d) || "BH";

    else if (!S.pCodeSent) {
      const opts = COUNTRIES.map(c => `<option value="${c.dial}" ${c.dial === S.pDial ? "selected" : ""}>${c.dial}</option>`).join("");
      b2 = `<div class="phonerow"><select id="sDial" aria-label="${lang === "ar" ? "رمز الدولة" : "Country code"}">${opts}</select><input id="sPhone" type="tel" dir="ltr" inputmode="numeric" maxlength="${lenByDial(S.pDial)}" placeholder="${exampleByDial(S.pDial)}" value="${esc(S.pPhone)}"></div>
            <div class="hint">${lang === "ar" ? "اكتب الرقم بدون الرمز" : "Enter the number without the country code"}</div>
            <div class="ferr hidden" id="sPhoneErr"></div>
            ${msgHTML("sms")}
            <button class="btn btn-main" type="button" data-act="sendPhoneCode">${t().sendCode}</button>`;
    } else b2 = codeBlock("sms");

    const countryOpts = COUNTRIES.map(c => `<option value="${c.code}" ${c.code === S.country ? "selected" : ""}>${lang === "ar" ? c.ar : c.en}</option>`).join("");
    const b3 = detailsOpen ? `
        <label for="sFirst" class="req">${t().first}</label>
        <input id="sFirst" value="${esc(S.first)}" placeholder="Showbiz">
        <div class="ferr hidden" id="sFirstErr"></div>
        <label for="sLast" class="req">${t().last}</label>
        <input id="sLast" value="${esc(S.last)}" placeholder="Showbiz">
        <div class="ferr hidden" id="sLastErr"></div>
        <label for="sCountry" class="req">${t().country}</label>
        <select id="sCountry">${countryOpts}</select>
        <label for="sPass" class="req">${t().password}</label>
        <div class="pw"><input id="sPass" type="password" dir="ltr" autocomplete="new-password" placeholder="••••••••">${eyeBtn("sPass")}</div>
        <div class="strength" id="sStr" aria-label="${lang === "ar" ? "قوة كلمة المرور" : "Password strength"}">${(() => { const c = pwChecks(S.pw || ""); return c.map(x => `<i class="${x ? "on" : ""}"></i>`).join(""); })()}</div>
        <div class="hint">${t().pwHint}</div>
        <div class="ferr hidden" id="sPassErr"></div>
        <label for="sPass2" class="req">${t().confirm}</label>
        <div class="pw"><input id="sPass2" type="password" dir="ltr" autocomplete="new-password" placeholder="••••••••">${eyeBtn("sPass2")}</div>
        <div class="ferr hidden" id="sPass2Err"></div>
        <button class="btn btn-main" type="button" data-act="create">${t().create}</button>`
      : `<p class="sub" style="margin:10px 0 0">${t().locked}</p>`;

    const step = (n, done, locked, label, body) => `
      <section class="step ${done ? "done" : ""} ${locked ? "locked" : ""}">
        <div class="sh"><span class="badge">${done ? "✓" : n}</span>${label}</div>${body}
      </section>`;

    return `
      ${step(1, emailOK, false, t().s1, b1)}
      ${step(2, phoneOK, !emailOK, t().s2, b2)}
      ${step(3, false, !detailsOpen, t().s3, b3)}`;
  }

  function render() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.title = "Showbiz " + t().title;
    $("app").innerHTML = `
      <div class="top"><button class="lang" type="button" data-act="lang">${t().switchLabel}</button></div>
      <div class="brand"><div class="mark">S<b>.</b></div><div class="name">Showbiz</div></div>
      <h1>${t().title}</h1>
      <p class="sub">${t().sub}</p>
      ${stepsHTML()}
      <div id="notice" class="msg hidden"></div>
      <div class="linkrow"><a class="link" href="login.html">${t().haveAcc}</a></div>
      <div class="row2"><a class="btn btn-line" href="index.html" style="margin-top:0">${t().cancel}</a></div>`;
    ShowbizFlags.attach($("sDial"));
    ShowbizFlags.attach($("sCountry"));
    tickCooldown();
  }

  // ===== خطوة البريد =====
  async function sendEmailCode() {
    if (Date.now() < cool.email) return;
    const el = $("sEmail");
    const email = (el ? el.value : S.sEmail).trim();
    S.sEmail = email;
    if (!isEmail(email)) { if (el) setErr("sEmail", t().emailBad); return; }
    const seq = ++S.sendSeq;
    S.sLoading = true; S.sCodeSent = false; S.sMsg = null; render();
    // الطلب يكمل في الخلفية، وإذا رجع خطأ حقيقي يظهر تحت الخانات
    sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true } })
      .then(({ error }) => { if (error && seq === S.sendSeq) showMsg("email", errMsg(error), "err"); })
      .catch((e) => { if (seq === S.sendSeq) showMsg("email", errMsg(e), "err"); });
    await wait(SEND_MS);
    if (seq !== S.sendSeq) return;
    S.sLoading = false; S.sCodeSent = true; cool.email = Date.now() + COOL_MS; render(); focusBox("email", 0);
  }
  async function verifyEmail() {
    if (S.busy) return;
    const code = getCode("email");
    if (!/^\d{6}$/.test(code)) return showMsg("email", t().enterCode, "err");
    S.busy = true; showMsg("email", t().checking, "info");
    try {
      let res = await sb.auth.verifyOtp({ email: S.sEmail, token: code, type: "email" });
      if (res.error) res = await sb.auth.verifyOtp({ email: S.sEmail, token: code, type: "magiclink" });
      if (res.error) throw res.error;
      S.sVerified = true; S.sMsg = null; toast(t().emailOk); render();
    } catch (e) {
      clearCode("email"); focusBox("email", 0);
      showMsg("email", codeErr(e), "err");
    } finally { S.busy = false; }
  }
  function changeEmail() {
    S.sVerified = false; S.sCodeSent = false; S.sMsg = null;
    S.pVerified = false; S.pCodeSent = false; S.pMsg = null;
    sb.auth.signOut().catch(() => {});
    render();
  }

  // ===== خطوة الجوال =====
  async function sendPhoneCode() {
    if (Date.now() < cool.sms) return;
    const el = $("sPhone");
    const digits = digitsOnly(el ? el.value : S.pPhone);
    S.pPhone = digits;
    if (el) S.pDial = $("sDial").value;
    const need = lenByDial(S.pDial);
    if (digits.length !== need) { if (el) setErr("sPhone", t().phoneLen(need)); return; }
    S.pFull = S.pDial + digits;
    const seq = ++S.sendSeq;
    S.pLoading = true; S.pCodeSent = false; S.pMsg = null; render();
    sb.auth.updateUser({ phone: S.pFull })
      .then(({ error }) => { if (error && seq === S.sendSeq) showMsg("sms", errMsg(error), "err"); })
      .catch((e) => { if (seq === S.sendSeq) showMsg("sms", errMsg(e), "err"); });
    await wait(SEND_MS);
    if (seq !== S.sendSeq) return;
    S.pLoading = false; S.pCodeSent = true; cool.sms = Date.now() + COOL_MS; render(); focusBox("sms", 0);
  }
  async function verifyPhone() {
    if (S.busy) return;
    const code = getCode("sms");
    if (!/^\d{6}$/.test(code)) return showMsg("sms", t().enterCode, "err");
    S.busy = true; showMsg("sms", t().checking, "info");
    try {
      const { error } = await sb.auth.verifyOtp({ phone: S.pFull, token: code, type: "phone_change" });
      if (error) throw error;
      S.pVerified = true; S.pMsg = null; toast(t().phoneOk); render();
    } catch (e) {
      clearCode("sms"); focusBox("sms", 0);
      showMsg("sms", codeErr(e), "err");
    } finally { S.busy = false; }
  }
  function changePhone() { S.pVerified = false; S.pCodeSent = false; S.pMsg = null; render(); }

  // ===== إنشاء الحساب =====
  async function createAccount() {
    if (S.busy) return;
    const first = $("sFirst").value.trim(), last = $("sLast").value.trim();
    const p1 = $("sPass").value, p2 = $("sPass2").value;
    S.first = first; S.last = last;
    ["sFirst", "sLast", "sPass", "sPass2"].forEach(id => setErr(id, ""));
    if (!first) setErr("sFirst", t().namesReq);
    if (!last) setErr("sLast", t().namesReq);
    if (p1.length < 8) setErr("sPass", t().passShort);
    else if (!pwStrong(p1)) setErr("sPass", t().passWeak);
    if (p1 !== p2) setErr("sPass2", t().passMismatch);
    if (!first || !last || !pwStrong(p1) || p1 !== p2) return;

    S.busy = true; setNotice(t().creating, "info");
    try {
      const { data } = await sb.auth.getSession();
      const session = data?.session;
      if (!session) return setNotice(t().sessionLost, "err");

      // 1) كلمة المرور وبيانات الحساب (هذي الخطوة لازم تنجح)
      const { error } = await sb.auth.updateUser({
        password: p1, data: { first_name: first, last_name: last, preferred_country: S.country }
      });
      if (error) throw error;

      // 2) بيانات العميل في جدول customers. إذا تأخر، الرئيسية تكملها تلقائيًا من بيانات الحساب
      const { error: e2 } = await sb.from("customers").upsert({
        id: session.user.id, email: session.user.email, first_name: first, last_name: last,
        phone: REQUIRE_PHONE ? S.pFull : null
      });
      if (e2) console.warn("customers upsert:", e2);

      // 3) الدولة المختارة تصير المفضلة، ويدخل الموقع مسجّل ويرجع لنفس المكان
      mergeState({ country: S.country });
      toast(t().created);
      ShowbizCore.markLogin();
      setTimeout(() => { location.href = ShowbizCore.nextUrl(); }, TOAST_MS);
    } catch (e) {
      setNotice(errMsg(e), "err");
    } finally { S.busy = false; }
  }

  // ===== الأحداث =====
  const ACT = {
    lang() { lang = lang === "ar" ? "en" : "ar"; mergeState({ lang }); render(); },
    eye(el) {
      const i = $(el.dataset.t); if (!i) return;
      i.type = i.type === "password" ? "text" : "password";
      const label = i.type === "password" ? t().show : t().hide;
      el.setAttribute("aria-label", label); el.title = label;
    },
    sendEmailCode, verifyEmail, changeEmail,
    sendPhoneCode, verifyPhone, changePhone,
    create: createAccount
  };
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]");
    if (!b) return;
    const fn = ACT[b.dataset.act];
    if (fn) fn(b);
  });
  document.addEventListener("input", (e) => {
    const el = e.target;
    if (el.dataset && el.dataset.otp) {
      el.value = digitsOnly(el.value).slice(-1);
      const p = el.dataset.otp, i = Number(el.dataset.i);
      if (el.value && i < 5) focusBox(p, i + 1);
      if (getCode(p).length === 6) (p === "email" ? verifyEmail : verifyPhone)();
      return;
    }
    if (el.id === "sPass") {
      S.pw = el.value;
      const bars = document.querySelectorAll("#sStr i");
      pwChecks(el.value).forEach((ok, k) => bars[k] && bars[k].classList.toggle("on", ok));
    }
    const MAP = { sEmail: "sEmail", sPhone: "pPhone", sFirst: "first", sLast: "last" };
    if (MAP[el.id]) S[MAP[el.id]] = el.value;
    if (el.id && $(el.id + "Err")) setErr(el.id, "");
  });
  document.addEventListener("change", (e) => {
    if (e.target.id === "sDial") {
      S.pDial = e.target.value;
      const ph = $("sPhone");
      if (ph) { ph.maxLength = lenByDial(S.pDial); ph.placeholder = exampleByDial(S.pDial); }
    }
    if (e.target.id === "sCountry") S.country = e.target.value;
  });
  document.addEventListener("keydown", (e) => {
    const el = e.target;
    if (el.dataset && el.dataset.otp) {
      const p = el.dataset.otp, i = Number(el.dataset.i);
      if (e.key === "Backspace" && !el.value && i > 0) {
        e.preventDefault();
        const prev = document.querySelector(`[data-otp="${p}"][data-i="${i - 1}"]`);
        if (prev) { prev.value = ""; prev.focus(); }
      } else if (e.key === "Enter") {
        e.preventDefault(); (p === "email" ? verifyEmail : verifyPhone)();
      }
      return;
    }
    if (e.key !== "Enter") return;
    const map = { sEmail: "sendEmailCode", sPhone: "sendPhoneCode", sPass2: "create" };
    if (map[el.id]) { e.preventDefault(); ACT[map[el.id]](); }
  });
  document.addEventListener("paste", (e) => {
    const el = e.target;
    if (!(el.dataset && el.dataset.otp)) return;
    e.preventDefault();
    const digits = digitsOnly(e.clipboardData?.getData("text")).slice(0, 6);
    if (!digits) return;
    const p = el.dataset.otp, start = Number(el.dataset.i);
    [...digits].forEach((d, k) => {
      const box = document.querySelector(`[data-otp="${p}"][data-i="${start + k}"]`);
      if (box) box.value = d;
    });
    focusBox(p, Math.min(start + digits.length, 5));
    if (getCode(p).length === 6) (p === "email" ? verifyEmail : verifyPhone)();
  });

  // إذا فيه جلسة لحساب مكتمل نرجع للرئيسية، وإذا جلسة بدون بيانات نبدأ من جديد
  (async () => {
    try {
      const { data } = await sb.auth.getSession();
      if (data?.session) {
        const { data: p } = await sb.from("customers").select("id").eq("id", data.session.user.id).maybeSingle();
        if (p) { ShowbizCore.markLogin(); return location.replace(ShowbizCore.nextUrl()); }
        await sb.auth.signOut();
      }
    } catch (e) {}
  })();

  render();
</script>
<div id="verLine" style="text-align:center;font:12px monospace;color:#6b7a94;padding:10px 12px 18px;direction:ltr"></div>
</body>
